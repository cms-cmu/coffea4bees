# Per-subsample mixed-data JCM for the bkg_syst closure of the MvD-MIXED method (Run 3, 2024):
# the 2024 hemisphere-mixed library's four-tag events (mixeddata_all) as the "3b" sample, fit to each
# declustered subsample's four-tag events (B_1 passes --data4bName mix_v<m>), as the 2024 MvD roast's
# V.1 fit does with real four-tag data (mixed_jcm in mvd_run3_2024.yml). Applied by nSelJets.
data4bName: data
taglabel4b:   fourTag

data3bName: mixeddata_all
taglabel3b:   fourTag

taglabel3b_tt: threeTag

selJets: selJets_noJCM.n
tagJets: tagJets_noJCM.n

subtract3bTT: False
threeTightTagFraction: 0.47781   # acts as the fit seed when float_t is true (as mvd_run3_2024.yml)
float_t: true                    # mixed-data fit: derive t from data4b/(JCM·mixed_3b) normalization
