runner:
  #workers: 4
  max_workers: 200
  chunksize: 10000
  # condor_cores: 1
  # dashboard_address: 10201
  worker_memory: 2GB
  condor_transfer_input_files: 
    - coffea4bees/analysis/
    - coffea4bees/metadata/
    - coffea4bees/classifier/
    - src/


config:
  SvB: true
  SvB_MA: true
  blind: false
  apply_FvT: false
  apply_trigWeight: true
  # TEMPORARY: ZZ4b UL16_preVFP/UL16_postVFP were re-skimmed and the trigger-weight friend index
  # (metadata/datasets/trigweights_2024_v2.json) still indexes the old files, so those 16 chunks
  # have no trigger weight (warning, as before 2026-09-19). Remove once the ZZ4b UL16 friends are
  # regenerated (workflows/config/trigweights_ZZ4b_UL16.yml) and merged into the index.
  require_trigWeight: false
  apply_btagSF: true
  apply_boosted_veto: false
  run_SvB: true
  hist_cuts: []
  # SvB_MA:
  #   - path: 'coffea4bees/analysis/weights/pytorch_models/2024_HHUL_all_kl/result.json'
  #     name: Final
  top_reconstruction: fast
