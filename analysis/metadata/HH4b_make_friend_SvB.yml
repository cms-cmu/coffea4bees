runner:
  workers: 4
  worker_memory: 2GB
  friend_base: &friend_base root://cmsdata.phys.cmu.edu//store/group/HH4b/Run2/opendata_project/ 
  # friend_base: &friend_base /srv/output/all_friends/
  chunksize: 10000

config:
  blind: false
  apply_FvT: true
  FvT:
    - path: 'root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/nominal_sel/classifier/FvT_nominal/result.json'
      name: Final
  apply_trigWeight: false
  apply_btagSF: true
  apply_boosted_veto: false
  run_SvB: true
  SvB: null
  SvB_MA:
    - path: 'root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/nominal_sel/classifier/SvB_nominal_TEST/result.json'
      name: Final
  top_reconstruction: fast
  fill_histograms: false
  make_friend_SvB: *friend_base
  make_friend_JCM_weight: *friend_base
  make_friend_FvT_weight: *friend_base
  make_classifier_input: *friend_base

  

