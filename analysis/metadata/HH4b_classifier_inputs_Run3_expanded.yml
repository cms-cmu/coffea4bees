runner:
  workers: 4
  # Expanded canJet feature set makes each event heavier; 5GB/100k OOM'd
  # (KilledWorker on TTToSemiLeptonic). Bump memory + halve chunksize.
  worker_memory: 8GB
  # friend_base: output/local/
  chunksize: 50000

config:
  blind: false
  apply_FvT: false
  apply_trigWeight: true
  apply_btagSF: true
  apply_boosted_veto: false
  run_SvB: false
  top_reconstruction: fast
  fill_histograms: false
  # Expanded per-jet canJet feature set (btagScore, PNet flavor outputs, nSVs,
  # energy fractions, area, rawFactor, HF shape vars, ...). Written to a
  # dedicated EOS subdir so it never collides with the legacy classifier inputs.
  # Classifier-agnostic: usable for SvB, FvT, and MvD training alike.
  make_classifier_input: root://cmseos.fnal.gov//store/user/jda102/XX4b/Run3ClassiferInputs_expanded
  #make_friend_FvT_weight: root://cmseos.fnal.gov//store/user/jda102/XX4b/Run3ClassiferInputs_expanded
  #make_classifier_input: output/local/   ### local
  #make_friend_FvT_weight: output/local/   ### local
