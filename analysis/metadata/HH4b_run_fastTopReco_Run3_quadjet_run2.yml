runner:
  workers: 4
  worker_memory: 5GB

config:
  SvB: default
  SvB_MA: default
  blind: false
  apply_FvT: false
  apply_trigWeight: true
  apply_btagSF: true
  apply_boosted_veto: false
  run_SvB: false
  run_SvB_FeynNet_comparison: false  # set true to add 2D/3D SvB_MA vs SvB_FeynNet hists for the comparison study (off by default — adds storage)
  apply_MvD: false
  apply_MvD_weight: false
  plot_ttbar_with_weights: true
  top_reconstruction: fast
  fourTag_use_tight: true
  candidates_selection_cfg: "coffea4bees/analysis/metadata/candidates_selection_thresholds_quadjet_run2.yml"
  compute_hemi_mixing_diagnostics: false  # gate hemisphere-mixing diagnostic histograms (off by default — adds storage)
