runner:
  #workers: 4
  max_workers: 200
  chunksize: 10000
  # condor_cores: 1
  # dashboard_address: 10201
  worker_memory: 2GB
  condor_transfer_input_files: 
    - coffea4bees/analysis/
    - coffea4bees/metadata/
    - coffea4bees/classifier/
    - src/


config:
  blind: false
  apply_FvT: false
  apply_trigWeight: false
  apply_btagSF: true
  apply_boosted_veto: false
  run_SvB: true
  hist_cuts: []
  # SvB_MA:
  #   - path: 'coffea4bees/analysis/weights/pytorch_models/2024_HHUL_all_kl/result.json'
  #     name: Final
  SvB_FeynNet:
  - path: coffea4bees/analysis/weights/pytorch_models/FeynNet/Run3/preparking_svb/model.onnx
    preprocess: coffea4bees/analysis/weights/pytorch_models/FeynNet/Run3/preparking_svb/preprocess.json
  top_reconstruction: fast
