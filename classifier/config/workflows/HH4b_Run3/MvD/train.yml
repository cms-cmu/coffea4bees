# template:
# - model: path to model

main:
  module: train
  option:
    - --max-loaders 2
    - --max-trainers 3

dataset:
  - module: HCR.MvD.TrainBaseline
    option:
      - --metadata coffea4bees/metadata/datasets_HH4b_Run3/archive/datasets_HH4b_Run3_2025_Run3_skims
      - --max-workers 20
      - --data-source mixed_all detector
      - --JCM-weight "source:mixed_all" coffea4bees/analysis/weights/JCM/Run3_MvD/jetCombinatoricModel_SB_.yml@@JCM_weights
      - --friends "" coffea4bees/metadata/datasets_HH4b_Run3/classifier_inputs_mixeddata_all.json@@HCR_input

model:
  - module: HCR.MvD.baseline.Train
    option:
      - --kfolds 3
      - --kfold-seed MvD random
      - --kfold-seed-offsets 0
      - --training FixedStep
      - epoch: 20
        bs_init: 1024
      - --finetuning FixedStep
      - epoch: 1
        bs_init: 16384

setting:
  - module: IO
    option:
      - output: "{model}"
