# coffea4bees/classifier/config/workflows/HH4b_Run3/MvD/workflow_config.yml
#
# Config for src/classifier/workflow/Snakefile.
# Placeholders {lpc_user} and {eos_base} are resolved by the Snakefile.
# To keep outputs from a separate run, change output_dir.

lpc_user: jda102
cern_user: j/johnda
eos_base: "root://cmseos.fnal.gov//store/user/{lpc_user}/HH4b_Run3_v2"

classifier_config_paths: coffea4bees
wfs_base: coffea4bees/classifier/config/workflows/HH4b_Run3/MvD
output_dir: output/Run3_MvD/

# plot_inputs not yet supported for Run3 classifiers (no metadata file)
plot_inputs: false

model: "{eos_base}/classifier/MvD"
friend: "{eos_base}/friend/MvD"
train_template: "model: {eos_base}/classifier/MvD"
eval_template: "model: {eos_base}/classifier/MvD, MvD: {eos_base}/friend/MvD"
metadata: ""
