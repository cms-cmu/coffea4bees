# template:
# - model: path to model

# when run with
#   template/-template "model: path/to/model" path/to/this/file.yml
# the {model} will be replaced by path/to/model

main:
  module: train # run training task
  option:
    - --max-loaders 2 # use 2 workers to load dataset
    - --max-trainers 3 # use 3 workers to train

dataset:
  - module: HCR.FvT.TrainBaseline # use the baseline dataset for FvT training
    option:
      - --metadata coffea4bees/metadata/datasets_HH4b_Run3/archive/datasets_HH4b_Run3_2025_Run3_skims # choose dataset
      - --max-workers 20 # use 20 workers to load ROOT files
      - --data-source detector # only use data (not mixed data or synthetic data)
      - --JCM-weight "" coffea4bees/analysis/weights/JCM/Run3/jetCombinatoricModel_SB_v2.yml@@JCM_weights # set JCM weight, where the @@ is used to get the key JCM_weights inside the file
      - --friends "" coffea4bees/metadata/datasets_HH4b_Run3/classifier_inputs_Run3.json@@HCR_input # set input friend tree

model:
  - module: HCR.FvT.baseline.Train # use the baseline model for FvT
    option:
      - --kfolds 3 # use 3-fold
      - --kfold-seed FvT random # setup base seed to be ("FvT", "random")
      - --kfold-seed-offsets 0 # use seed ("FvT", "random", 0)
      # --kfold-seed-offsets 0-14 will use seed ("FvT", "random", 0), ... ("FvT", "random", 14) to train 15 models
      - --training FixedStep # setup training schedule
      # FixedStep is defined in config/scheduler
      # SWA variant of HH4b_Run3/FvT: the nominal schedule (lr 1e-2 to epoch 15, x0.25 per epoch
      # after), with the weights averaged uniformly over the end-of-epoch states of epochs 6-15 (the
      # constant-lr plateau, where the closure wanders from epoch to epoch) and the average swapped
      # into the model after epoch 15, so the lr decay starts from it.
      - epoch: 20
        bs_init: 1024
        average: swa
        average_start: 6
        average_end: 15
      - --finetuning FixedStep # setup finetuning schedule
      - epoch: 1
        bs_init: 16384

setting:
  - module: IO # setup output directory
    option:
      - output: "{model}" # will be replaced by the template
