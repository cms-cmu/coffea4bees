# template:
# - model: path to model (e.g. ${{EOS}}/HH4b_Run3_quadjet_run2/classifier/SvB)
# - FvT:   path to FvT friend tree directory (e.g. ${{EOS}}/HH4b_Run3_quadjet_run2/friend/FvT)
#
# Adapted from coffea4bees/classifier/config/workflows/HH4b_2024_v2/SvB/train.yml
# for Run3 quadjet_run2 — uses the quadjet_run2 JCM table, the
# MvD-produced classifier_inputs JSON (matches the candidate selection
# used downstream in the histogramming), and a 3-fold split mirroring
# the Run3 FvT training.

main:
  module: train
  option:
    - --max-loaders 2
    - --max-trainers 3

dataset:
  - module: HCR.SvB.Background
    option:
      - --metadata coffea4bees/metadata/datasets_HH4b_Run3/archive/datasets_HH4b_Run3_SvB
      - --max-workers 20
      - --data-source detector
      - --norm 3
      - --JCM-weight "" coffea4bees/analysis/weights/JCM/Run3/jetCombinatoricModel_SB_quadjet_run2.yml@@JCM_weights
      - --friends "" coffea4bees/metadata/datasets_HH4b_Run3/classifier_inputs_SvB_Run3_quadjet_run2.json@@HCR_input
      - --friends label:data {FvT}/result.json@@analysis.0.merged
  - module: HCR.SvB.Signal
    option:
      - --metadata coffea4bees/metadata/datasets_HH4b_Run3/archive/datasets_HH4b_Run3_SvB
      - --max-workers 20
      # Restrict to ggF only — Run3 does not yet have ZZ4b/ZH4b/ggZH4b skims.
      # Drop this once those samples are produced and added to the archive.
      - --mc-processes ggF
      # Run3 ggF samples are named GluGlutoHHto4B_kl-{{kl}}_kt-{{kt}}_c2-{{c2}}
      # (lowercase 'to', explicit kt/c2). Override the default Run2 pattern
      # and use the fixed-2-decimal coupling format (1.0 -> '1p00').
      # Braces doubled to survive yml str.format (template substitution).
      - --ggf-signal-pattern "GluGlutoHHto4B_kl-{{kl}}_kt-{{kt}}_c2-{{c2}}"
      - --ggf-coupling-format fixed2
      - --ggf-coupling-defaults "kt=1.0,c2=0.0"
      # Restrict to the SM kl=1 point for the first SvB training.
      # Remove --ggf-load-kl (or list more values) once BSM signal
      # classifier-inputs exist.
      - --ggf-load-kl 1.0
      - --friends "" coffea4bees/metadata/datasets_HH4b_Run3/classifier_inputs_SvB_Run3_quadjet_run2.json@@HCR_input

model:
  - module: HCR.SvB.ggF.baseline.Train      # attention is default in HCRArch
    option:
      - --kfolds 3
      - --kfold-seed SvB random
      - --kfold-seed-offsets 0
      - --roc-signal-by-category
      - --training FixedStep
      - epoch: 20
        bs_init: 1024
      - --finetuning FinetuneStep
      - epoch: 1
        bs_init: 16384

setting:
  - module: IO
    option:
      - output: "{model}"
