main:
  module: evaluate
  option:
    # Phase D eval-memory ruling (orchestrator jgaytanv-e7, 2026-10-14): one evaluator at a time + 8x larger batches.
    # EvalLoader enqueues every batch loader into a Manager queue before the first batch (~15.7 MB RSS each for this dataset):
    # 3 x 12,786 queued loaders at the default batch_eval 2^15 -> ~720 GB predicted; 1 x 3,867 at 2^18 -> ~73 GB.
    # batch_eval is output-neutral in eval mode (max rel. diff 6.9e-7, identical NaN pattern, on one picoAOD).
    - --max-evaluators 1
    - --device cuda cpu # use GPU if available, fall back to CPU

model:
  - module: HCR.SvB.ttHbb.baseline.Eval
    option:
      - --models
      - Final
      - "{model}/result.json"

dataset:
  - module: HCR.ttHbb.Eval
    option:
      - --metadata coffea4bees/metadata/datasets/
      - --data-source detector
      # PROCESS names, not dataset names: MC.mc_processes = {ttbar, ttHbb} ∩ this list (_picoAOD.py:342-352);
      # the ttbar files come from cms.MC_TTbar.datasets (the *_stitched entries of common.yml)
      - --mc-processes ttHbb ttbar
      - --max-workers 8
      - --friends "" coffea4bees/metadata/datasets/classifier_inputs_ttHbb_run3.json@@HCR_input

analysis:
  - module: kfold.Merge
    option:
      - --name SvB_MA
      - --step 100000
      - --workers 2
      - --clean

setting:
  - module: IO
    option:
      - output: "{SvB}"
  - module: ml.DataLoader
    option:
      - num_workers: 8
      - batch_eval: 262144
