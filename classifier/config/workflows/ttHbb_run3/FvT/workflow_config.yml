# Standalone config for src/classifier/workflow/Snakefile (the Phase C Snakefiles read the same keys
# from the `fvt` block of workflows/config/analysis_ttHbb_run3.yml).
eos_base: "root://eoscms.cern.ch//eos/cms/store/group/phys_higgs/ttHbb/mmarcheg/4b/Run3_v1/ttHbb_stitched"
plot_base: "root://eosuser.cern.ch//eos/user/m/mmarcheg/www/plots/ttHbb/analysis/4b"

classifier_config_paths: coffea4bees
wfs_base: coffea4bees/classifier/config/workflows/ttHbb_run3/FvT
label: FvT_ttHbb_run3
output_dir: /eos/cms/store/group/phys_higgs/ttHbb/mmarcheg/4b/output/ttHbb_run3/FvT_ttHbb_run3/

plot_inputs: true
plot_weights: true
evaluate: true

model: "{eos_base}/classifier/{label}"
friend: "{eos_base}/friend/{label}"
train_template: "model: {eos_base}/classifier/{label}"
eval_template: "model: {eos_base}/classifier/{label}, FvT: {eos_base}/friend/{label}"
metadata: "coffea4bees/metadata/datasets/classifier_inputs_ttHbb_run3.json@@HCR_input"
