### Common classifier settings for the tt+bb stitched ttbar training.
###
### Same as HH4b_2024_v2/common.yml, plus the one switch that makes the
### training use the stitched ttbar sample instead of the plain 5FS one.

setting:
  - module: ml.DataLoader
    option:
      - optimize_sliceable_dataset: true # use a custom dataloader to speed up batch generation
  - module: ROOT
    option:
      - friend_allow_missing: false

  ### THE tt+bb STITCHING SWITCH #############################################
  # _picoAOD._ttbar builds the `label:ttbar` file lists from MC_TTbar.datasets.
  # Default is ["TTToSemiLeptonic", "TTToHadronic", "TTTo2L2Nu"] (the plain 5FS
  # samples, src/classifier/config/setting/cms.py). Point it at the stitched
  # entries so the t3/t4 training classes come from
  #   tt+C, tt+LF  <- inclusive 5FS   (tt+B removed)
  #   tt+B         <- dedicated 4FS TTbb (genWeight rescaled)
  # These keys are defined in
  #   coffea4bees/metadata/datasets/archive/Run2_2024_v2/TT_stitched.yml
  # which is picked up because --metadata points at that whole directory.
  - module: cms.MC_TTbar
    option:
      - datasets:
          - TTToSemiLeptonic_stitched
          - TTToHadronic_stitched
          - TTTo2L2Nu_stitched
  ###########################################################################

  ## remove the whole block below if you want to use all years ##
  - module: cms.CollisionData
    option:
      - eras:
          UL16_preVFP: [C, D, E, F]
          UL16_postVFP: [F, G, H]
          UL17: [B, C, D, E, F]
          UL18: [A, B, C, D]
  - module: HCR.InputBranch
    option:
      - feature_ancillary: [xW, nSelJets, xbW, year]
      # remove the "year" from the input when the dataset only contains one year
      # otherwise the variance will be infinite and the output will be NaN
  ##########################################################
