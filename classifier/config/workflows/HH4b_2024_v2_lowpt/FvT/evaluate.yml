# template:
# - model: path to model
# - FvT: path to friend tree

main:
  module: evaluate
  option:
    - --max-evaluators 3 # use 3 workers to evaluate
    - --device cuda cpu # use GPU if available, fall back to CPU

dataset:
  - module: HCR.FvT_lowpt.Eval
    option:
      - --metadata coffea4bees/metadata/datasets_HH4b_Run2/2024_v2/datasets_HH4b_2024_v2
      - --max-workers 8 # use 8 workers to fetch metadatas for ROOT files
      # - --test-files 2 # limit to 2 files per group for quick testing (remove for full evaluation)
      - --data-source detector
      - --friends "" coffea4bees/metadata/datasets_HH4b_Run2/2024_v2/classifier_inputs_lowpt_wlowptJCM.json@@HCR_input_lowpt # set input friend tree

model:
  - module: HCR.FvT.baseline.Eval
    option:
      - --models
      - Final # choose name of the model to evaluate, for now only Final is available
      - "{model}/result.json" # setup the path to the training result

analysis:
  - module: kfold.Merge # merge different k-folds
    option:
      - --name FvT # set the name of friend tree
      - --step 100000 # set the step to read ROOT files
      - --workers 5
      - --clean # remove the original files

setting:
  - module: IO
    option:
      - output: "{FvT}"
  - module: ml.DataLoader
    option:
      - num_workers: 0
