plot_inputs: true

model: "{eos_base}/classifier/FvT_lowpt"
friend: "{eos_base}/friend/FvT_lowpt"
train_template: "model: {eos_base}/classifier/FvT_lowpt"
eval_template: "model: {eos_base}/classifier/FvT_lowpt, FvT: {eos_base}/friend/FvT_lowpt"
