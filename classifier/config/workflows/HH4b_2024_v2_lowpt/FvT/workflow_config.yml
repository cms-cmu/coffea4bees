eos_base: "root://cmseos.fnal.gov//store/user/{lpc_user}/XX4b/2024_v2"

classifier_config_paths: coffea4bees
wfs_base: coffea4bees/classifier/config/workflows/HH4b_2024_v2_lowpt/FvT
