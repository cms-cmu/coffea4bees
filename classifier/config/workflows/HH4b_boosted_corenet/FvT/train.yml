# Boosted CoReNet FvT training (template). Instructions: coffea4bees/workflows/docs/CoReNet_boosted_workflow.md
main:
  module: train
  option:
    - --max-loaders 2
    - --max-trainers 3

dataset:
  - module: HCR.FvT.TrainBaseline
    option:
      - --metadata {metadata}
      - --max-workers 20
      - --data-source detector
      - --JCM-weight "" {jcm}
      - --friends "" {inputs}

model:
  - module: CoReNet.FvT.baseline.Train
    option:
      - --network file:##{network}
      - --inputs
      - b: CanJet
        other: NotCanJet
      - --kfolds 3
      - --kfold-seed FvT random
      - --kfold-seed-offsets 0
      - --training FixedStep
      - epoch: 20
        bs_init: 1024
      - --finetuning FinetuneStep
      - epoch: 1
        bs_init: 16384

setting:
  - module: IO
    option:
      - output: "{fvt_model}"
