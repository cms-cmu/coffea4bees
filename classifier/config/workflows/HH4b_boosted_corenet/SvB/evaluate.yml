# Boosted CoReNet SvB evaluation (template). Instructions: coffea4bees/workflows/docs/CoReNet_boosted_workflow.md
main:
  module: evaluate
  option:
    - --max-evaluators 3
    - --device cuda cpu

dataset:
  - module: HCR.SvB.Eval
    option:
      - --metadata {metadata}
      - --max-workers 8
      - --friends "" {inputs}

model:
  - module: CoReNet.SvB.ggF.baseline.Eval
    option:
      - --models
      - Final
      - "{svb_model}/result.json"

analysis:
  - module: kfold.Merge
    option:
      - --name SvB
      - --step 100000
      - --workers 5
      - --clean

setting:
  - module: IO
    option:
      - output: "{svb_friend}"
  - module: ml.DataLoader
    option:
      - num_workers: 8
