# Boosted CoReNet SvB training (template). Instructions: coffea4bees/workflows/docs/CoReNet_boosted_workflow.md
main:
  module: train
  option:
    - --max-loaders 2
    - --max-trainers 3

dataset:
  - module: HCR.SvB.Background
    option:
      - --metadata {metadata}
      - --max-workers 20
      - --data-source detector
      - --norm 3
      - --JCM-weight "" {jcm}
      - --friends "" {inputs}
      - --friends label:data {fvt_friend}/result.json@@analysis.0.merged
  - module: HCR.SvB.Signal
    option:
      - --metadata {metadata}
      - --max-workers 20
      - --friends "" {inputs}

model:
  - module: CoReNet.SvB.ggF.baseline.Train
    option:
      - --network file:##{network}
      - --inputs
      - b: CanJet
        other: NotCanJet
      - --roc-signal-by-category
      - --kfolds 3
      - --kfold-seed SvB random
      - --kfold-seed-offsets 0
      - --training FixedStep
      - epoch: 20
        bs_init: 1024
      - --finetuning FinetuneStep
      - epoch: 1
        bs_init: 16384

setting:
  - module: IO
    option:
      - output: "{svb_model}"
