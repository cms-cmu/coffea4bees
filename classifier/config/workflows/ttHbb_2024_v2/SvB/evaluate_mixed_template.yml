main:
  module: evaluate
  option:
    - --max-evaluators 3
    - --device cuda cpu

model:
  - module: HCR.SvB.ttHbb.baseline.Eval
    option:
      - --models
      - Final
      - "{model}/result.json"

dataset:
  - module: HCR.legacy.Eval
    option:
      - --files "year:{year}" "{file}"
      - --max-workers 4
      - --friends ""

analysis:
  - module: kfold.Merge
    option:
      - --name SvB
      - --step 100000
      - --workers 2
      - --clean

setting:
  - module: IO
    option:
      - output: "{output}"
  - module: ml.DataLoader
    option:
      - num_workers: 4
