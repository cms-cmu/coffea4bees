main:
  module: evaluate
  option:
    - --device cpu
    - --max-evaluators 1

dataset:
  - module: HCR.SimplifiedEval
    option:
      - --max-workers 1
      - --preserve-order
      - --files label:sparse output/dataset/sparse.root
      - --files label:dense output/dataset/dense.root

model:
  - module: CoReNet.SparseDenseEval
    option:
      - --models
      - Final
      - output/corenet_from_hcr/result.json

analysis:
  - module: kfold.Merge
    option:
      - --name SvD
      - --naming {name}_{start}_{stop}_{path0}
      - --step 100000
      - --workers 1
      - --clean
  - module: compare.CompareRootFile
    option:
      - --atol 0
      - --rtol 0
      - --result output/corenet_evaluate_from_hcr/chunks/SvD_0_8192_sparse.root
      - --reference output/main_evaluate/chunks/SvD_0_8192_sparse.root
  - module: compare.CompareRootFile
    option:
      - --atol 0
      - --rtol 0
      - --result output/corenet_evaluate_from_hcr/chunks/SvD_0_8192_dense.root
      - --reference output/main_evaluate/chunks/SvD_0_8192_dense.root

setting:
  - module: IO
    option:
      - output: output/corenet_evaluate_from_hcr
  - module: Analysis
    option:
      - max_workers: 1
