<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>barista webPlot</title>
  <style>
    /* ---- CMU color palette (light theme) ---- */
    :root {
      --cmu-red:       #C41230;
      --cmu-red-dark:  #96001d;
      --cmu-red-dim:   #e8b4bc;
      --bg-base:       #f5f0ee;
      --bg-panel:      #ffffff;
      --bg-toolbar:    #C41230;
      --bg-input:      #ffffff;
      --border:        #d6c8c8;
      --border-hover:  #C41230;
      --text-primary:  #2a1a1a;
      --text-muted:    #7a5a5a;
      --text-link:     #96001d;
      --success:       #4a7c3f;
    }

    /* ---- reset & base ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Georgia, sans-serif; font-size: 14px;
           background: var(--bg-base); color: var(--text-primary);
           display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ---- header ---- */
    header { background: var(--bg-toolbar); border-bottom: 2px solid var(--cmu-red);
             padding: 8px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    header h1 { font-size: 18px; color: #fff; letter-spacing: 0.5px; font-weight: 600; }
    .header-meta { font-size: 12px; color: rgba(255,255,255,0.75); flex: 1; }
    .btn { cursor: pointer; padding: 6px 14px; border-radius: 5px; border: none;
           font-size: 13px; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary   { background: var(--cmu-red); color: #fff; }
    .btn-secondary { background: rgba(255,255,255,0.15); color: #fff;
                     border: 1px solid rgba(255,255,255,0.5); }
    .btn-accent    { background: var(--cmu-red-dark); color: #fff; }
    #archive-msg { font-size: 12px; color: #fff; margin-left: 8px; }

    /* ---- main layout: gallery | interactive ---- */
    main { display: flex; flex: 1; overflow: hidden; }

    /* ---- gallery panel ---- */
    #gallery-panel { width: 55%; border-right: 1px solid var(--border);
                     display: flex; flex-direction: column; overflow: hidden; }
    #gallery-toolbar { padding: 8px 12px; background: var(--bg-toolbar);
                       border-bottom: 1px solid var(--border);
                       display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    #gallery-filter { flex: 1; background: var(--bg-input); border: 1px solid var(--border);
                      color: var(--text-primary); padding: 5px 9px;
                      border-radius: 5px; font-size: 13px; }
    #gallery-filter:focus { outline: none; border-color: var(--cmu-red); }
    #gallery-count { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    #gallery-grid { flex: 1; overflow-y: auto; padding: 12px;
                    display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
    .thumb { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px;
             padding: 8px; width: 180px; cursor: pointer; transition: border-color 0.15s; }
    .thumb:hover { border-color: var(--cmu-red); }
    .thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { font-size: 11px; color: var(--text-muted); margin-top: 5px;
                   word-break: break-all; line-height: 1.3; }
    .thumb-pdf { font-size: 11px; color: var(--text-link); text-decoration: none;
                 display: block; margin-top: 3px; }
    .thumb-pdf:hover { text-decoration: underline; }
    #gallery-loading { padding: 40px; text-align: center; color: var(--text-muted);
                       font-size: 14px; width: 100%; }

    /* ---- interactive panel ---- */
    #iplot-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #iplot-form  { padding: 12px; overflow-y: auto; flex-shrink: 0; max-height: 55%;
                   border-bottom: 1px solid var(--border); }
    #iplot-form h2 { font-size: 15px; color: var(--cmu-red); margin-bottom: 10px; font-weight: 600; }

    .form-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .field { display: flex; flex-direction: column; gap: 3px; }
    .field label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .field select, .field input[type=text], .field input[type=number] {
      background: var(--bg-input); border: 1px solid var(--border);
      color: var(--text-primary); padding: 5px 8px; border-radius: 4px; font-size: 13px; }
    .field select:focus, .field input:focus { outline: none; border-color: var(--cmu-red); }
    .field select { min-width: 140px; }
    .field input[type=number] { width: 75px; }
    .field.wide select { min-width: 220px; }

    .check-group { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .check-item { display: flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; }
    .check-item input { cursor: pointer; accent-color: var(--cmu-red); }

    .region-group { display: flex; gap: 10px; flex-wrap: wrap; }

    #plot-btn { margin-top: 10px; }
    #plot-status { font-size: 12px; color: var(--text-muted); margin-left: 10px; }

    /* ---- result area ---- */
    #iplot-results { flex: 1; overflow-y: auto; padding: 12px; }
    .result-item { background: var(--bg-panel); border: 1px solid var(--border);
                   border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .result-item img { max-width: 100%; border-radius: 4px; display: block; }
    .result-meta { font-size: 13px; color: var(--text-muted); margin-top: 6px;
                   display: flex; align-items: center; gap: 10px; }
    .result-meta a { color: var(--text-link); font-size: 13px; text-decoration: none; }
    .result-meta a:hover { text-decoration: underline; }
    .result-error { color: #e05060; font-size: 13px; padding: 8px; }
    .result-dismiss { margin-left: auto; color: var(--text-muted); cursor: pointer; font-size: 16px; }
    .result-dismiss:hover { color: var(--cmu-red); }

    /* ---- 2D section visibility ---- */
    #row-process-2d { display: none; }

    /* ---- lightbox ---- */
    #lb { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88);
          align-items: center; justify-content: center; z-index: 1000; }
    #lb.active { display: flex; }
    #lb-img { max-width: 90vw; max-height: 90vh; border-radius: 6px; }
    #lb-close { position: absolute; top: 14px; right: 20px; font-size: 28px;
                cursor: pointer; color: #fff; line-height: 1; }
    #lb-close:hover { color: var(--cmu-red); }
    #lb-dl { position: absolute; bottom: 20px; right: 20px; }

    /* ---- scrollbar styling ---- */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d0b8b8; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--cmu-red); }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <h1>barista webPlot</h1>
  <span class="header-meta">
    {{ input_files | join(', ') }} &nbsp;|&nbsp; {{ metadata_file }}
  </span>
  <button class="btn btn-secondary" onclick="archiveSession()">Archive Session</button>
  <span id="archive-msg"></span>
</header>

<!-- Main -->
<main>

  <!-- Gallery Panel -->
  <section id="gallery-panel">
    <div id="gallery-toolbar">
      <input id="gallery-filter" type="text" placeholder="Filter by variable name..."
             oninput="filterGallery()" />
      <span id="gallery-count"></span>
    </div>
    <div id="gallery-grid">
      <div id="gallery-loading">Loading gallery...</div>
    </div>
  </section>

  <!-- Interactive Panel -->
  <section id="iplot-panel">
    <div id="iplot-form">
      <h2>Interactive Plot</h2>

      <!-- Row 1: variable + cut -->
      <div class="form-row">
        <div class="field wide">
          <label>Variable</label>
          <select id="f-var"><option value="">loading...</option></select>
        </div>
        <div class="field wide">
          <label>Cut</label>
          <select id="f-cut"><option value="">(none)</option></select>
        </div>
      </div>

      <!-- Row 2: region checkboxes -->
      <div class="form-row">
        <div class="field">
          <label>Region</label>
          <div class="region-group" id="f-region-group">
            <!-- populated by JS -->
          </div>
        </div>
      </div>

      <!-- Row 3: process + year -->
      <div class="form-row">
        <div class="field">
          <label>Process</label>
          <select id="f-process"><option value="">(all / default)</option></select>
        </div>
        <div class="field">
          <label>Year</label>
          <select id="f-year"><option value="">(all)</option></select>
        </div>
      </div>

      <!-- Row 4: process for 2D (hidden unless 2D checked) -->
      <div class="form-row" id="row-process-2d">
        <div class="field">
          <label>Process (2D, required)</label>
          <select id="f-process-2d"><option value="">select...</option></select>
        </div>
      </div>

      <!-- Row 5: checkboxes -->
      <div class="form-row">
        <div class="field">
          <label>Options</label>
          <div class="check-group">
            <label class="check-item"><input type="checkbox" id="f-doRatio" checked /> doRatio</label>
            <label class="check-item"><input type="checkbox" id="f-norm" /> Normalize</label>
            <label class="check-item"><input type="checkbox" id="f-is2d" onchange="toggle2d()" /> 2D plot</label>
            <label class="check-item"><input type="checkbox" id="f-add-flow" /> Add flow</label>
          </div>
        </div>
        <div class="field">
          <label>yscale</label>
          <select id="f-yscale">
            <option value="linear">linear</option>
            <option value="log">log</option>
          </select>
        </div>
        <div class="field">
          <label>Rebin</label>
          <input type="number" id="f-rebin" value="1" min="1" step="1" />
        </div>
      </div>

      <!-- Row 6: axis ranges -->
      <div class="form-row">
        <div class="field">
          <label>xlim min</label>
          <input type="number" id="f-xlim-min" placeholder="auto" step="any" />
        </div>
        <div class="field">
          <label>xlim max</label>
          <input type="number" id="f-xlim-max" placeholder="auto" step="any" />
        </div>
        <div class="field">
          <label>ylim min</label>
          <input type="number" id="f-ylim-min" placeholder="auto" step="any" />
        </div>
        <div class="field">
          <label>ylim max</label>
          <input type="number" id="f-ylim-max" placeholder="auto" step="any" />
        </div>
      </div>

      <!-- Submit -->
      <div style="display:flex; align-items:center;">
        <button class="btn btn-primary" id="plot-btn" onclick="submitPlot()">Plot it</button>
        <span id="plot-status"></span>
      </div>
    </div>

    <!-- Results -->
    <div id="iplot-results"></div>
  </section>

</main>

<!-- Lightbox -->
<div id="lb" onclick="closeLb(event)">
  <span id="lb-close" onclick="closeLb()">✕</span>
  <img id="lb-img" src="" alt="plot" />
  <a id="lb-dl" class="btn btn-accent" href="#" download>⬇ PDF</a>
</div>

<script>
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let galleryData = [];
let axesData    = {};
let currentLbPdf = '';

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
async function init() {
  const [gRes, aRes] = await Promise.all([
    fetch('/gallery'), fetch('/axes')
  ]);
  galleryData = await gRes.json();
  axesData    = await aRes.json();

  buildGallery();
  populateForm();
}

// ---------------------------------------------------------------------------
// Gallery
// ---------------------------------------------------------------------------
function buildGallery() {
  const grid = document.getElementById('gallery-grid');
  grid.innerHTML = '';

  if (galleryData.length === 0) {
    grid.innerHTML = '<div id="gallery-loading">No pre-generated plots (--no-pregallery mode or gallery still loading).</div>';
    updateCount(0);
    return;
  }

  galleryData.forEach(item => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.dataset.label = item.label.toLowerCase();
    div.innerHTML = `
      <img src="${item.png_url}" alt="${item.label}" loading="lazy"
           onclick="openLb('${item.png_url}', '${item.pdf_url}')" />
      <div class="thumb-label">${item.label}</div>
      <a class="thumb-pdf" href="${item.pdf_url}" download onclick="event.stopPropagation()">⬇ PDF</a>`;
    grid.appendChild(div);
  });

  updateCount(galleryData.length);
}

function filterGallery() {
  const q = document.getElementById('gallery-filter').value.toLowerCase();
  let visible = 0;
  document.querySelectorAll('.thumb').forEach(el => {
    const show = el.dataset.label.includes(q);
    el.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  updateCount(visible);
}

function updateCount(n) {
  document.getElementById('gallery-count').textContent =
    n === galleryData.length ? `${n} plots` : `${n} / ${galleryData.length} plots`;
}

// ---------------------------------------------------------------------------
// Lightbox
// ---------------------------------------------------------------------------
function openLb(pngUrl, pdfUrl) {
  document.getElementById('lb-img').src = pngUrl;
  document.getElementById('lb-dl').href = pdfUrl;
  currentLbPdf = pdfUrl;
  document.getElementById('lb').classList.add('active');
}

function closeLb(e) {
  if (!e || e.target === document.getElementById('lb') ||
      e.target === document.getElementById('lb-close')) {
    document.getElementById('lb').classList.remove('active');
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('lb').classList.remove('active'); });

// ---------------------------------------------------------------------------
// Form population
// ---------------------------------------------------------------------------
function populateForm() {
  // Variable
  const fVar = document.getElementById('f-var');
  fVar.innerHTML = '';
  (axesData.variables || []).forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    fVar.appendChild(opt);
  });

  // Cut
  const fCut = document.getElementById('f-cut');
  fCut.innerHTML = '<option value="">(none)</option>';
  (axesData.cuts || []).forEach(c => {
    const opt = document.createElement('option'); opt.value = c; opt.textContent = c;
    fCut.appendChild(opt);
  });

  // Region checkboxes
  const rGroup = document.getElementById('f-region-group');
  rGroup.innerHTML = '';
  (axesData.regions || ['SR', 'SB']).forEach((r, i) => {
    const label = document.createElement('label');
    label.className = 'check-item';
    label.innerHTML = `<input type="checkbox" class="region-cb" value="${r}" ${i === 0 ? 'checked' : ''} /> ${r}`;
    rGroup.appendChild(label);
  });

  // Process
  const fProc = document.getElementById('f-process');
  const fProc2d = document.getElementById('f-process-2d');
  fProc.innerHTML = '<option value="">(all / default)</option>';
  fProc2d.innerHTML = '';
  (axesData.processes || []).forEach((p, i) => {
    [fProc, fProc2d].forEach((sel, idx) => {
      const opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      if (idx === 1 && i === 0) opt.selected = true;
      sel.appendChild(opt);
    });
  });

  // Year
  const fYear = document.getElementById('f-year');
  fYear.innerHTML = '<option value="">(all)</option>';
  (axesData.years || []).forEach(y => {
    const opt = document.createElement('option'); opt.value = y; opt.textContent = y;
    fYear.appendChild(opt);
  });
}

function toggle2d() {
  const is2d = document.getElementById('f-is2d').checked;
  document.getElementById('row-process-2d').style.display = is2d ? 'flex' : 'none';
  document.getElementById('f-doRatio').disabled = is2d;
  document.getElementById('f-norm').disabled    = is2d;
}

// ---------------------------------------------------------------------------
// Submit plot
// ---------------------------------------------------------------------------
async function submitPlot() {
  const btn    = document.getElementById('plot-btn');
  const status = document.getElementById('plot-status');
  btn.disabled = true;
  status.textContent = 'Generating...';
  status.style.color = '#8b949e';

  const regions = Array.from(document.querySelectorAll('.region-cb:checked')).map(cb => cb.value);
  if (regions.length === 0) {
    status.textContent = 'Select at least one region.';
    status.style.color = '#f85149';
    btn.disabled = false;
    return;
  }

  const is2d    = document.getElementById('f-is2d').checked;
  const rebin   = parseInt(document.getElementById('f-rebin').value) || 1;
  const xlimMin = parseFloat(document.getElementById('f-xlim-min').value);
  const xlimMax = parseFloat(document.getElementById('f-xlim-max').value);
  const ylimMin = parseFloat(document.getElementById('f-ylim-min').value);
  const ylimMax = parseFloat(document.getElementById('f-ylim-max').value);

  const body = {
    var:      document.getElementById('f-var').value,
    cut:      document.getElementById('f-cut').value || null,
    region:   regions,
    is2d:     is2d,
    process:  is2d
              ? document.getElementById('f-process-2d').value
              : (document.getElementById('f-process').value || null),
    year:     document.getElementById('f-year').value || null,
    doRatio:  !is2d && document.getElementById('f-doRatio').checked ? 1 : 0,
    norm:     !is2d && document.getElementById('f-norm').checked ? 1 : 0,
    yscale:   document.getElementById('f-yscale').value,
    rebin:    rebin,
    add_flow: document.getElementById('f-add-flow').checked,
    xlim:     [isNaN(xlimMin) ? null : xlimMin, isNaN(xlimMax) ? null : xlimMax],
    ylim:     [isNaN(ylimMin) ? null : ylimMin, isNaN(ylimMax) ? null : ylimMax],
  };

  try {
    const res  = await fetch('/plot', { method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();

    if (data.error) {
      prependResult(null, null, data.error, body);
      status.textContent = 'Error — see result below.';
      status.style.color = '#f85149';
    } else {
      prependResult(data.png_b64, data.pdf_url, null, body);
      status.textContent = 'Done.';
      status.style.color = '#56d364';
    }
  } catch (e) {
    status.textContent = 'Request failed: ' + e;
    status.style.color = '#f85149';
  }

  btn.disabled = false;
  setTimeout(() => { status.textContent = ''; }, 4000);
}

function prependResult(png_b64, pdf_url, error, params) {
  const div = document.createElement('div');
  div.className = 'result-item';

  const label = `${params.var} | ${params.region.join('+')} | cut=${params.cut || 'none'}`;

  if (error) {
    div.innerHTML = `
      <div class="result-meta">
        <span>${label}</span>
        <span class="result-dismiss" onclick="this.closest('.result-item').remove()">✕</span>
      </div>
      <div class="result-error">Error: ${error}</div>`;
  } else {
    const imgSrc = `data:image/png;base64,${png_b64}`;
    div.innerHTML = `
      <img src="${imgSrc}" alt="${label}"
           onclick="openLb('${imgSrc}', '${pdf_url}')" style="cursor:pointer;" />
      <div class="result-meta">
        <span>${label}</span>
        <a href="${pdf_url}" download>⬇ PDF</a>
        <span class="result-dismiss" onclick="this.closest('.result-item').remove()">✕</span>
      </div>`;
  }

  const container = document.getElementById('iplot-results');
  container.insertBefore(div, container.firstChild);
}

// ---------------------------------------------------------------------------
// Archive
// ---------------------------------------------------------------------------
async function archiveSession() {
  const msg = document.getElementById('archive-msg');
  msg.textContent = 'Archiving...';
  try {
    const res  = await fetch('/archive', { method: 'POST' });
    const data = await res.json();
    msg.textContent = `Saved to: ${data.archive_path}`;
  } catch(e) {
    msg.textContent = 'Archive failed: ' + e;
  }
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
init();
</script>

</body>
</html>
