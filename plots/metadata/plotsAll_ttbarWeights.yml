# Run-agnostic: the HH4b `process` list names both the Run 2 and the Run 3 signal samples, and
# makePlots drops whichever are absent from the input file (one warning per dropped entry), so
# this config serves both productions. ZZ4b / ZH4b have no Run 3 skims and are dropped there;
# the Run 3 SvB is the binary ggF training, so its ps_zz / ps_zh gallery pins below never match.
hists:
        data:
                process: data
                tag: fourTag
                label: Four-tag data
                edgecolor: k
                fillcolor: k

        HH4b:
                process: [GluGluToHHTo4B_cHHH1, GluGlutoHHto4B_kl-1p00_kt-1p00_c2-0p00]
                tag: fourTag
                label: HH4b (x100)
                edgecolor: "#e42536"
                fillcolor: "#e42536"            
                histtype: step
                scalefactor: 100
                
        ZH4b:
                process: [ZH4b, ggZH4b]
                tag: fourTag
                label: ZH4b (x100)
                edgecolor: "#964a8b"
                fillcolor: "#964a8b"            
                histtype: step
                scalefactor: 100

        ZZ4b:
                process: ZZ4b
                tag: fourTag
                label: ZZ4b (x100)
                edgecolor: "#7a21dd"
                fillcolor: "#7a21dd"            
                histtype: step
                scalefactor: 100


stack:
        TTbar:
                process: TTbar4b_from_d3
                tag: threeTag
                fillcolor: "#85D1FBff"
                edgecolor: k
                label: $t\bar{t}$


        Multijet:
                process: data
                tag: threeTag
                fillcolor: "#FFDF7Fff"
                edgecolor: k
                label: QCD multijet

ratios:
        dataToBkg:
                numerator:
                        type: hists
                        key: data
                denominator:
                        type: stack
                uncertianty:
                        nominal
                color: k
                marker: "o"

doRatio:
    1


# Key plots pinned at the top of the HTML gallery (src/plotting/make_gallery.py); names match image
# basenames with '.' and '_' interchangeable, and a bare prefix pins every matching plot.
# Chosen for the main analysis pass (Phase F.1): the SvB scores per channel, the FvT model and the
# ttbar-from-d3 stack in the basic kinematics.
summary:
    - SvB_MA.ps_hh
    - SvB_MA.ps_zz
    - SvB_MA.ps_zh
    - SvB_MA.ps
    - FvT
    - selJets.n
    - canJet0.pt
    - m4j
    - v4j.mass
    - quadJet_selected.lead.mass
    - quadJet_selected.subl.mass
    - quadJet_selected.xHH
