hists:
  mixeddata:
    process: mix_v0
    tag: fourTag
    label: "Mixed data (4b)"
    edgecolor: k
    fillcolor: k            

  ttHbb:
    process: ttHbb
    tag: fourTag
    label: ttHbb
    edgecolor: "#e42536"
    fillcolor: "#e42536"            
    histtype: step
    scalefactor: 1

stack:
  TTbar:
    process: TTbar4b_from_d3
    tag: threeTag
    fillcolor: "#85D1FBff"
    edgecolor: k
    label: $t\bar{t}$

  MultiJet:
    process: data
    tag: threeTag
    fillcolor: "#FFDF7Fff"
    edgecolor: k
    label: Multijet

  ttHbb:
    process: ttHbb
    tag: fourTag
    label: None
    edgecolor: "#e42536"
    fillcolor: "#e42536"
    scalefactor: 1

ratios:
  mixedToBkg:
    numerator:
      type: hists
      key: mixeddata
    denominator:
      type: stack
    uncertianty:
      nominal
    color: k
    marker: "o"

doRatio: 1

categories:
  - "inclusive"
  - "pass_nSelJets_gt6"

regions:
  - "SR"
  - "SB"
