# Stage F_1: Mixed-Data Background Systematics Closure Plots
# Compares 4-tag Mixed Data pseudo-data against the 3-tag Data (JCM * FvT) + ttbar background model stack.

hists:
  mixeddata:
    process:
      - mix_v0
      - mix_v1
      - mix_v2
      - mix_v3
      - mix_v4
      - mix_v5
      - mix_v6
      - mix_v7
      - mix_v8
      - mix_v9
      - mix_v10
      - mix_v11
      - mix_v12
      - mix_v13
      - mix_v14
      - mix_v15
    tag: fourTag
    label: "Mixed data (4b)"
    edgecolor: k
    fillcolor: k

stack:
  ttbar:
    process: TTbar4b_from_d3
    tag: threeTag
    fillcolor: "#85D1FBff"
    edgecolor: k
    label: "$t\\bar{t}$"

  multijet:
    process: data
    tag: threeTag
    fillcolor: "#FFDF7Fff"
    edgecolor: k
    label: "QCD multijet (JCM * FvT)"

ratios:
  mixedToModel:
    numerator:
      type: hists
      key: mixeddata
    denominator:
      type: stack
    uncertainty: nominal
    color: k
    marker: "o"

doRatio: 1
categories:
  - "inclusive"
  - "pass_nSelJets_gt6"
regions:
  - "SR"
  - "SB"

summary:
  - SvB_MA.ps_hh
  - SvB_MA.ps_zh
  - SvB_MA.ps_zz
  - SvB_MA.ps
  - FvT
  - selJets.n
  - canJet0.pt
  - m4j
  - v4j.mass
  - quadJet_selected.lead.mass
  - quadJet_selected.subl.mass
  - quadJet_selected.xHH
