# Stage F_1: Mixed-Data Background Systematics Closure Plots
# Compares 4-tag Mixed Data pseudo-data against the 3-tag Data (JCM * FvT) + ttbar background model stack.

hists:
  mixeddata:
    process: mix_v0
    tag: fourTag
    label: "Mixed data (4b)"
    edgecolor: k
    fillcolor: k

stack:
  ttbar:
    process: TTbar4b_from_d3
    tag: threeTag
    fillcolor: "#85D1FBff"
    edgecolor: k
    label: "$t\\bar{t}$"

  multijet:
    process: data
    tag: threeTag
    fillcolor: "#FFDF7Fff"
    edgecolor: k
    label: "QCD multijet (JCM * FvT)"

ratios:
  mixedToModel:
    numerator:
      type: hists
      key: mixeddata
    denominator:
      type: stack
    uncertainty: nominal
    color: k
    marker: "o"

doRatio: 1
categories:
  - "inclusive"
  - "pass_nSelJets_gt6"
regions:
  - "SR"
  - "SB"

summary:
  - overlay_SvB_MA_ps_ttHbb
  - overlay_SvB_MA_ps
  - overlay_FvT
  - overlay_selJets_pt
  - SvB_MA.ps_ttHbb
  - SvB_MA.ps
  - SvB_MA.ps_hh
  - SvB_MA.ps_zh
  - SvB_MA.ps_zz
  - FvT
  - selJets.n
  - canJet0.pt
  - m4j
