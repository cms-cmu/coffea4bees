hists:
  data:
    process: data
    tag: fourTag
    year: RunII
    label: "Four-tag Data"
    edgecolor: k
    fillcolor: k

  JCM:
    process: JCM
    tag: fourTag
    year: RunII
    label: "JCM fit"
    edgecolor: r
    fillcolor: r
    histtype: step
    scalefactor: 1

stack:
  TTbar:
    year: RunII
    fillcolor: "#85D1FBff"
    edgecolor: k
    label: "$t\\bar{t}$"
    sum:
      TTToHadronic:
        process: TTToHadronic_stitched
        tag: fourTag
        scalefactor: 1.0
      TTToSemiLeptonic:
        process: TTToSemiLeptonic_stitched
        tag: fourTag
        scalefactor: 1.0
      TTTo2L2Nu:
        process: TTTo2L2Nu_stitched
        tag: fourTag
        scalefactor: 1.0

  MultiJet:
    year: RunII
    fillcolor: "#FFDF7Fff"
    edgecolor: k
    label: "Multijet"
    sum:
      data_3tag:
        process: data
        tag: threeTag
        scalefactor: 1.0
      TTToHadronic_3tag:
        process: TTToHadronic_stitched
        tag: threeTag
        scalefactor: -1.0
      TTToSemiLeptonic_3tag:
        process: TTToSemiLeptonic_stitched
        tag: threeTag
        scalefactor: -1.0
      TTTo2L2Nu_3tag:
        process: TTTo2L2Nu_stitched
        tag: threeTag
        scalefactor: -1.0

ratios:
  dataToBkg:
    numerator:
      type: hists
      key: data
    denominator:
      type: stack
    uncertainty:
      nominal
    color: k
    marker: "o"

  dataToJCM:
    numerator:
      type: hists
      key: data
    denominator:
      type: hists
      key: JCM
    uncertainty:
      nominal
    color: r
    marker: "o"

codes:
  region:
    SR: 2
    SB: 1
    other: 0
  tag:
    threeTag: 3
    fourTag: 4
    other: 0

doRatio: 1

categories:
  - "inclusive"
  - "pass_nSelJets_gt6"

regions:
  - "SR"
  - "SB"
