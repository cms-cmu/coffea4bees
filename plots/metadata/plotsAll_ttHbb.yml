hists:
  data:
    process: data
    tag: fourTag
    label: Four-tag data
    edgecolor: k
    fillcolor: k            

  ttHbb:
      process: ttHbb
      tag: fourTag
      label: ttHbb
      edgecolor: "#e42536"
      fillcolor: "#e42536"            
      histtype: step
      scalefactor: 1

stack:
  TTbar:
    process: TTbar4b_from_d3 #[TTToHadronic, TTToSemiLeptonic, TTTo2L2Nu]
    tag: threeTag
    fillcolor: "#85D1FBff"
    edgecolor: k
    label: $t\bar{t}$


  MultiJet:
    process: data
    tag: threeTag
    fillcolor: "#FFDF7Fff"
    edgecolor: k
    label: Multijet


  ttHbb:
      process: ttHbb
      tag: fourTag
      label: None
      edgecolor: "#e42536"
      fillcolor: "#e42536"
      scalefactor: 1

ratios:
  dataToBkg:
    numerator:
      type: hists
      key: data
    denominator:
      type: stack
    uncertianty:
      nominal
    color: k
    marker: "o"

doRatio: 1
