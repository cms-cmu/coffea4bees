# Run 3 variant of plotsJCM_ttHbb_stitched.yml (year aggregate Run3); used by the Phase B.1 JCM fit (-m).
hists:
        data:
                process: data
                tag: fourTag
                year: Run3
                label: Four-tag Data
                edgecolor: k
                fillcolor: k

        JCM:
                process: JCM
                tag: fourTag
                year: Run3
                label: JCM fit
                edgecolor: r
                fillcolor: r
                histtype: step
                scalefactor: 1

stack:
        TTTo2L2Nu:
                process: TTTo2L2Nu_stitched
                tag: fourTag
                year: Run3
                fillcolor: "#85D1FBff"
                edgecolor: "#85D1FBff"
                label: None

        TTToSemiLeptonic:
                process: TTToSemiLeptonic_stitched
                tag: fourTag
                year: Run3
                fillcolor: "#85D1FBff"
                edgecolor: "#85D1FBff"
                label: None

        TTToHadronic:
                process: TTToHadronic_stitched
                tag: fourTag
                year: Run3
                fillcolor: "#85D1FBff"
                edgecolor: k
                label: TTbar

        MultiJet:
                year: Run3
                fillcolor: "#FFDF7Fff"
                edgecolor: k
                label: Multijet
                year: Run3
                sum:
                    data_3tag:
                            process: data
                            tag: threeTag
                            scalefactor: +1

                    TTTo2L2Nu_3tag:
                            process: TTTo2L2Nu_stitched
                            tag: threeTag
                            scalefactor: -1

                    TTToSemiLeptonic_3tag:
                            process: TTToSemiLeptonic_stitched
                            tag: threeTag
                            scalefactor: -1

                    TTToHadronic_3tag:
                            process: TTToHadronic_stitched
                            tag: threeTag
                            scalefactor: -1


ratios:
        dataToBkg:
                numerator:
                        type: hists
                        key: data
                denominator:
                        type: stack
                uncertianty:
                        nominal
                color: k
                marker: "o"

        dataToJCM:
                numerator:
                        type: hists
                        key: data
                denominator:
                        type: hists
                        key: JCM
                uncertianty:
                        nominal
                color: r
                marker: "o"



codes:
   region:
      SR: 2
      SB: 1
      other: 0
   tag:
      threeTag: 3
      fourTag: 4
      other: 0

doRatio:
    1
