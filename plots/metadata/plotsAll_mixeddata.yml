hists:
  mixeddata:
    process: mix_v0
    tag: fourTag
    label: Mixed data (4b)
    edgecolor: k
    fillcolor: k

  HH4b:
    process: GluGluToHHTo4B_cHHH1
    tag: fourTag
    label: HH4b (x100)
    edgecolor: "#e42536"
    fillcolor: "#e42536"
    histtype: step
    scalefactor: 100

  ZH4b:
    process: [ZH4b, ggZH4b]
    tag: fourTag
    label: ZH4b (x100)
    edgecolor: "#964a8b"
    fillcolor: "#964a8b"
    histtype: step
    scalefactor: 100

  ZZ4b:
    process: ZZ4b
    tag: fourTag
    label: ZZ4b (x100)
    edgecolor: "#7a21dd"
    fillcolor: "#7a21dd"
    histtype: step
    scalefactor: 100

stack:
  TTbar:
    process: TTbar4b_from_d3
    tag: threeTag
    fillcolor: "#85D1FBff"
    edgecolor: k
    label: $t\bar{t}$

  Multijet:
    process: data
    tag: threeTag
    fillcolor: "#FFDF7Fff"
    edgecolor: k
    label: QCD multijet

ratios:
  mixeddataToBkg:
    numerator:
      type: hists
      key: mixeddata
    denominator:
      type: stack
    uncertianty:
      nominal
    color: k
    marker: "o"

doRatio: 1

categories:
  - "inclusive"
  - "pass_nSelJets_gt6"

regions:
  - "SR"
  - "SB"
