# Run-agnostic: the signal `process` lists name both the Run 2 and the Run 3 samples, and
# makePlots drops whichever are absent from the input file (logging one warning per dropped
# entry), so this config serves both productions. ZZ4b / ZH4b have no Run 3 skims and are
# dropped there. There are no `year:` keys: `year` is a style key (src/plotting/
# helpers_make_plot_dict.py _STYLE_KEYS) and never reaches the hist indexing — the year comes
# from makePlots' --year, which the phase rules set (Run3 / RunII) and which is auto-inferred
# from the histogram's year axis otherwise.
hists:
        data:
                process: data
                tag: fourTag
                label: Four-tag data
                edgecolor: k
                fillcolor: k

        HH4b:
                process: [GluGluToHHTo4B_cHHH1, GluGlutoHHto4B_kl-1p00_kt-1p00_c2-0p00]
                tag: fourTag
                label: HH4b (x100)
                edgecolor: r
                fillcolor: r
                histtype: step
                scalefactor: 100

        ZH4b:
                process: ZH4b
                tag: fourTag
                label: ZH4b (x100)
                edgecolor: b
                fillcolor: b
                histtype: step
                scalefactor: 100

        ZZ4b:
                process: ZZ4b
                tag: fourTag
                label: ZZ4b (x100)
                edgecolor: g
                fillcolor: g
                histtype: step
                scalefactor: 100


stack:
        TTbar:
                process: [TTToHadronic, TTToSemiLeptonic, TTTo2L2Nu]
                tag: fourTag
                fillcolor: "#85D1FBff"
                edgecolor: k
                label: $t\bar{t}$


        MultiJet:
                fillcolor: "#FFDF7Fff"
                edgecolor: k
                label: Multijet
                sum:
                    data_3tag:
                            process: data
                            tag: threeTag
                            scalefactor: +1            

                    TTTo2L2Nu_3tag:
                            process: TTTo2L2Nu
                            tag: threeTag
                            scalefactor: -1
                            
                    TTToSemiLeptonic_3tag:
                            process: TTToSemiLeptonic
                            tag: threeTag
                            scalefactor: -1
                            
                    TTToHadronic_3tag:
                            process: TTToHadronic
                            tag: threeTag
                            scalefactor: -1

ratios:
        dataToBkg:
                numerator:
                        type: hists
                        key: data
                denominator:
                        type: stack
                uncertianty:
                        nominal
                color: k
                marker: "o"



codes:
   region:
      SR: 2
      SB: 1
      other: 0
   tag:
      threeTag: 3
      fourTag: 4
      other: 0

doRatio:
    1

# Key plots pinned at the top of the HTML gallery (src/plotting/make_gallery.py).
# Names match image basenames with '.' and '_' interchangeable.
summary:
    - selJets_noJCM.n
    - tagJets_noJCM.n
    - selJets.n
    - canJet0.pt
    - canJet3.pt
    - m4j
    - v4j.mass
    - quadJet_selected.lead.mass
    - quadJet_selected.subl.mass
    - quadJet_selected.xHH
