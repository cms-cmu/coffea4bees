# DeClustered-data validation (Snakefile_DeClustered_5_monitoring.smk, step D.5), after M.6. All
# four-tag, as written for declustering.subtract_ttbar: true (the default):
#   * 4b data (points)            vs the stack (declustered multijet, seed k + ttbar MC)
#                                 -> does the declustered model follow the 4b data it was made from?
#   * ttbar pseudodata (line)     vs the stack's ttbar MC part -> is the pseudodata that the consumer
#                                 dataset folds in right?
# With subtract_ttbar: false the declustered sample already contains the ttbar: D.5 moves TTbar out
# of the stack into a reference line and drops the pseudodata. `syn_vK` is a placeholder: D.5 writes
# the actual sample (syn_v<k> / syn_noTT_v<k>, seed k drawn per roast or pinned as validation.seed).
hists:
        data:
                process: data
                tag: fourTag
                label: Four-tag data
                edgecolor: k
                fillcolor: k
        psdata:
                process: ttbar_PSData
                tag: fourTag
                label: $t\bar{t}$ pseudodata
                edgecolor: "#1f4e9c"
                fillcolor: "#1f4e9c"
                histtype: step

stack:
        TTbar:
                process: [TTToHadronic, TTToSemiLeptonic, TTTo2L2Nu]
                tag: fourTag
                fillcolor: "#85D1FBff"
                edgecolor: k
                label: $t\bar{t}$ MC
        MultiJet:
                process: syn_vK
                tag: fourTag
                fillcolor: "#FFDF7Fff"
                edgecolor: k
                label: Declustered multijet (seed K)

ratios:
        dataToBkg:
                numerator:
                        type: hists
                        key: data
                denominator:
                        type: stack
                uncertianty:
                        nominal
                color: k
                marker: "o"
        psdataToTTbar:
                numerator:
                        type: hists
                        key: psdata
                denominator:
                        type: stack
                        key: TTbar
                color: "#1f4e9c"
                marker: "^"

codes:
   region:
      SR: 2
      SB: 1
      other: 0
   tag:
      threeTag: 3
      fourTag: 4
      other: 0

doRatio:
    1

summary:
    - selJets.n
    - tagJets.n
    - canJet0.pt
    - canJet1.pt
    - canJet2.pt
    - canJet3.pt
    - canJet0.eta
    - m4j
    - v4j.mass
    - v4j.pt
    - quadJet_selected.lead.mass
    - quadJet_selected.subl.mass
    - quadJet_selected.lead.dr
    - quadJet_selected.subl.dr
    - quadJet_selected.xHH
