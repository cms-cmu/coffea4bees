stack:
  TTbar:
    process: [TTToHadronic, TTToSemiLeptonic, TTTo2L2Nu]
    tag: lowpt_fourTag
    fillcolor: "#85D1FBff"
    edgecolor: k
    label: $t\bar{t}$

  Multijet:
    process: data
    tag: lowpt_threeTag
    fillcolor: "#FFDF7Fff"
