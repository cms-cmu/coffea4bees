runner:
  #maxchunks: 1
  #test_files: 1
  workers: 4
  min_workers: 1
  max_workers: 200
  chunksize: 100000
  picosize: 100000
  basketsize: 10000
  class_name: HemiMixer
  data_tier: picoAOD
  condor_cores: 1
  worker_memory: 6GB
  condor_transfer_input_files:
    - src
    - coffea4bees/
  allowlist_sites:
    - T2_US_Nebraska
    - T2_US_Purdue
    - T3_US_FNALLPC
    - T3_US_NotreDame

config:
  base_path: root://cmseos.fnal.gov//store/user/jda102/XX4b/mixed_data_all_noTT_pz
  # base_path: skimmer/test/
  subtract_ttbar_with_weights: True
  JCM_file : coffea4bees/analysis/weights/JCM/Run3/jetCombinatoricModel_SB_v2.yml
  hemi_library_yaml: coffea4bees/skimmer/metadata/hemisphere_library_Run3_noTT.yml
  hemi_stats_path: coffea4bees/skimmer/metadata/hemi_statistics_noTT
  use_boost_corrected_matching: True  # Set to True to enable 3D matching with pz boost correction
  use_topk_matching: True              # Set to True to use the parallel top-K matcher with rank-based collision retry
  k_neighbors: 10                      # K for the kd-tree top-K query (only used when use_topk_matching is True)
  collision_mode: retry                # ignore | drop | retry — policy when pos/neg hemis come from same library event
  default_rank: 0                      # 0 = nearest neighbor; >0 selects further neighbors (future dataset-expansion knob)
  campaign:   
  step: 100000
  skip_collections:
    - notCanJet
    - canJet0
    - canJet1
    - canJet2
    - canJet3        
  skip_branches:
    - "btagWeight_.*"
    - HHSR
    - ZZSR
    - ZHSR
    - SR
    - st
    - d01TruthMatch
    - nMuon_selected
    - fourTag
    - threeTag
    - xW
    - leadStM
    - nSelJets
    - d02TruthMatch
    - d12TruthMatch    
    - truthMatch
    - pseudoTagWeight
    - ttbarWeight
    - nIsoMuons
    - xt
    - weight
    - aveAbsEtaOth
    - xWbW
    - nAllNotCanJets
    - dRjjOther
    - xWt
    - nPSTJets
    - passXWt
    - d03TruthMatch
    - xbW
    - mcPseudoTagWeight
    - d23TruthMatch
    - m4j
    - sublStM
    - dRjjClose
    - aveAbsEta
    - stNotCan
    - SB
    - selectedViewTruthMatch
    - d13TruthMatch