runner:
  #maxchunks: 2
  #test_files: 1
  workers: 4
  min_workers: 1
  max_workers: 200
  chunksize: 100000
  picosize: 100000
  basketsize: 10000
  class_name: Skimmer
  data_tier: picoAOD
  condor_cores: 1
  worker_memory: 4GB
  condor_transfer_input_files:
    - src/
    - coffea4bees/analysis/
    - coffea4bees/skimmer/
    - coffea4bees/metadata/
  allowlist_sites:
    - T2_US_Nebraska
    - T2_US_Purdue
    - T3_US_FNALLPC
    - T3_US_NotreDame

config:
#  base_path: root://cmseos.fnal.gov//store/user/jda102/XX4b/2025_vDebug_v2/
  base_path: root://cmseos.fnal.gov//store/user/jda102/XX4b/2025_Run3_skims/
# base_path: /srv/output/skimmer/test/   ### local
  step: 100000
  loosePtForSkim: False
  skim4b: True
  skip_collections:
    - notCanJet
    - canJet0
    - canJet1
    - canJet2
    - canJet3        
  skip_branches:
    - "btagWeight_.*"
    - HHSR
    - ZZSR
    - ZHSR
    - SR
    - st
    - d01TruthMatch
    - nMuon_selected
    - fourTag
    - threeTag
    - xW
    - leadStM
    - nSelJets
    - d02TruthMatch
    - d12TruthMatch    
    - truthMatch
    - pseudoTagWeight
    - ttbarWeight
    - nIsoMuons
    - xt
    - weight
    - aveAbsEtaOth
    - xWbW
    - nAllNotCanJets
    - dRjjOther
    - xWt
    - nPSTJets
    - passXWt
    - d03TruthMatch
    - xbW
    - mcPseudoTagWeight
    - d23TruthMatch
    - m4j
    - sublStM
    - dRjjClose
    - aveAbsEta
    - stNotCan
    - SB
    - selectedViewTruthMatch
    - d13TruthMatch
