### tt+bb stitching, stage 2: write the stitched picoAODs -- RUN 3.
###
### Run 3 counterpart of stitch_ttbb.yml (which is kept unchanged so the Run 2
### recipe stays reproducible). Runs StitchTTbb over the *existing* picoAODs of
### both sides in a single pass:
###   - inclusive (TTTo2L2Nu, TTToSemiLeptonic, TTToHadronic) -> keep tt+C, tt+LF
###   - TTbb (TTbb_2L2Nu, TTbb_SemiLeptonic, TTbb_Hadronic)   -> keep tt+B, genWeight *= k
###
### The scale factors k must be produced first by
###   coffea4bees/skimmer/tools/ttbb_stitch_factors.py
### with --eras covering all five Run 3 eras (its default ERAS is the Run 2 set,
### and omitting --eras yields a JSON with an empty "stitch" block, which makes
### this processor raise SkimmingError on its first chunk).
###
### The TTbb picoAODs this reads come from Phase A.1, skimmed per era to match the
### HLT treatment of their inclusive partner -- see the header of
### coffea4bees/workflows/config/skim_ttbb_run3_2022_2023.yml. Nothing in this
### stage applies an event selection (only the genTtbarId category mask), so the
### HLT question does not arise here; it is already baked into the inputs.
###
### Usage (from the barista root):
###   ./run_container python runner.py -s \
###     -p coffea4bees/skimmer/processor/stitch_ttbb.py \
###     -c coffea4bees/skimmer/metadata/stitch_ttbb_run3.yml \
###     -m coffea4bees/metadata/datasets/TT.yml \
###     -y 2022_preEE 2022_EE 2023_preBPix 2023_BPix 2024 \
###     -d TTTo2L2Nu TTToSemiLeptonic TTToHadronic \
###        TTbb_2L2Nu TTbb_SemiLeptonic TTbb_Hadronic \
###     --friends none --weights none \
###     -o picoaod_datasets_ttbb_stitched_run3.yml \
###     -op coffea4bees/skimmer/metadata/ \
###     --condor --dashboard-address 0
###
### Pass the full dataset key names: find_matching_dataset() does substring
### matching and errors on multiple hits, so a bare "TTbb" is now ambiguous
### across the three channels.

runner:
  min_workers: 1
  max_workers: 200
  chunksize: 100000
  picosize: 100000
  basketsize: 10000
  class_name: StitchTTbb
  # Input is the already-skimmed picoAOD, not nanoAOD.
  data_tier: picoAOD
  condor_cores: 1
  worker_memory: 4GB
  condor_transfer_input_files:
    - src/
    - coffea4bees/analysis/
    - coffea4bees/skimmer/
    - coffea4bees/metadata/
  allowlist_sites:
    - T3_US_FNALLPC
    - T2_US_Nebraska
    - T2_US_Purdue

config:
  base_path: root://cmseos.fnal.gov//store/user/mmarcheg/ttHbb/Run3_v1/stitched/
  step: 100000
  stitch_factors: coffea4bees/skimmer/metadata/ttbb_stitch_factors_run3.json
  # Pinned (not auto-generated) so that re-running after a failure resumes from
  # the chunks already written instead of redoing them. Projected output is
  # ~500 GB over ~2500 chunks, so resumability matters more here than in Run 2.
  campaign: ttbb-stitch-run3-v1
  # No skip_collections / skip_branches on purpose: every branch of the input
  # picoAOD is copied through untouched, except genWeight on the TTbb side.
