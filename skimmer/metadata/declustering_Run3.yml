runner:
  #maxchunks: 1
  #test_files: 1
  workers: 4
  min_workers: 1
  max_workers: 200
  # runner.py reads `worker_memory` (not `condor_memory`) for the dask/condor
  # worker size; `condor_memory` was silently ignored, leaving workers at the
  # 4GB default. Declustering the 2023 pt25 selection (more jets) OOMs 4GB on
  # dense chunks (KilledWorker). Bump the worker and shrink the chunk.
  worker_memory: 8GB
  chunksize: 25000
  picosize: 100000
  basketsize: 10000
  class_name: DeClusterer
  data_tier: picoAOD
  condor_cores: 1
  condor_transfer_input_files:
    - src
    - coffea4bees
  allowlist_sites:
    - T2_US_Nebraska
    - T2_US_Purdue
    - T3_US_FNALLPC
    - T3_US_NotreDame

config:
  base_path: root://cmseos.fnal.gov//store/user/jda102/XX4b/DeClustered_noTT
  # base_path: skimmer/test/
  clustering_pdfs_file: "coffea4bees/jet_clustering/jet-splitting-PDFs-00-11-01/clustering_pdfs_vs_pT_XXX.yml"
  subtract_ttbar_with_weights: False
  declustering_rand_seed: 5
  # Declustered b-jet pT floor. Leave unset (commented out) to track the
  # selected-jet pt_min from object_selection_thresholds.yml (era-aware: 30 GeV
  # for 2022, 25 GeV for 2023). Uncomment to force an explicit value for studies.
  # b_pt_threshold: 30
  # Minimum angular separation (dR) required between declustered jets.
  dr_threshold: 0.4
  # Resampling retry caps for the per-jet and per-event declustering loops.
  max_jet_retry: 8
  max_event_retry: 8
  step: 100000
  skip_collections:
    - notCanJet
    - canJet0
    - canJet1
    - canJet2
    - canJet3        
  skip_branches:
    - "btagWeight_.*"
    - HHSR
    - ZZSR
    - ZHSR
    - SR
    - st
    - d01TruthMatch
    - nMuon_selected
    - fourTag
    - threeTag
    - xW
    - leadStM
    - nSelJets
    - d02TruthMatch
    - d12TruthMatch    
    - truthMatch
    - pseudoTagWeight
    - ttbarWeight
    - nIsoMuons
    - xt
    - weight
    - aveAbsEtaOth
    - xWbW
    - nAllNotCanJets
    - dRjjOther
    - xWt
    - nPSTJets
    - passXWt
    - d03TruthMatch
    - xbW
    - mcPseudoTagWeight
    - d23TruthMatch
    - m4j
    - sublStM
    - dRjjClose
    - aveAbsEta
    - stNotCan
    - SB
    - selectedViewTruthMatch
    - d13TruthMatch  
  campaign:     