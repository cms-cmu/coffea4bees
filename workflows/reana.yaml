inputs:
  files:
    - bootstrap.smk
    - workspace.tar.gz
  parameters:
    input: coffea4bees/workflows/inputs_reana.yaml
workflow:
  type: snakemake
  file: bootstrap.smk
  resources:
    compute_backend: slurmcern
    voms_proxy: true
    slurm_time: 480
workspace:
  retention_days:
    output_test/*: 30
outputs:
  directories:
    - output_test/