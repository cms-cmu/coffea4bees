inputs:
  git: 
    - repo: git@github.com:cms-cmu/barista.git
      branch: "master"
      target: "."
    - repo: git@github.com:cms-cmu/coffea4bees.git
      branch: "master"
      target: "coffea4bees"
  parameters:
    input: coffea4bees/workflows/inputs_reana.yaml
workflow:
  type: snakemake
  file: coffea4bees/workflows/Snakefile_reana.smk
  resources:
    compute_backend: slurmcern
    voms_proxy: true
workspace:
  retention_days:
    output_test/*: 30
outputs:
  directories:
    - output_test/