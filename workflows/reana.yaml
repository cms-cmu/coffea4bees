version: 0.9.4
inputs:
  directories:
    - src/
    - coffea4bees/analysis/
    - coffea4bees/metadata/
    - coffea4bees/plots/
    - coffea4bees/stats_analysis/
    - coffea4bees/workflows/
  parameters:
    input: coffea4bees/workflows/inputs_reana.yaml
  files:
    - gitdiff.txt
    - runner.py
    - run_container
    - coffea4bees/scripts/run-analysis-processor.sh
workflow:
  type: snakemake
  file: coffea4bees/workflows/Snakefile_reana.smk
  resources:
    compute_backend: slurmcern
    voms_proxy: true
workspace:
  retention_days:
    output/*: 30
outputs:
  directories:
    - output/