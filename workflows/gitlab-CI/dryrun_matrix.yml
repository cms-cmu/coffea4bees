# Workflow dry-run matrix, read by workflows/scripts/ci_workflow_dryrun.py (CI job
# workflow_validation_coffea4bees in stages_workflows.yml).
#
# runs: each production config (under workflows/config/) -> the Snakefiles its roast runs,
#   named without the `Snakefile_` prefix and `.smk` suffix. Every pair is dry-run
#   (`snakemake -n`) with test=false and test=true; a `base:` config is layered over its base
#   chain exactly as `roast new` captures it. Seeded from the roasts/ records (2026-09-28).
#
#   `upstream:` lists path fragments of products an EARLIER phase of the same roast writes
#   (a standalone dry run cannot see them). The pair passes only if every missing input
#   matches one of them; any other missing file is a failure.
#
# not_covered: top-level Snakefiles deliberately left out of `runs` (no production config to
#   pair them with). They are still compile-checked. A top-level Snakefile in neither list
#   fails the job, so a new workflow cannot land without being placed in one of them.

runs:
  nominal_run2.yml:
    - PhaseA
    - PhaseB
    - PhaseC
    - {snakefile: PhaseC_4_FvT_closure, upstream: ["computeJCM/singlefiles/", "metadata/weights/JCM/"]}
    - PhaseD
    - PhaseF
    - PhaseF_1_analysis
  nominal_run3.yml:
    - PhaseA
    - PhaseB
    - PhaseC
    - {snakefile: PhaseC_4_FvT_closure, upstream: ["computeJCM/singlefiles/", "metadata/weights/JCM/"]}
    - PhaseD
    - PhaseF
    - PhaseF_1_analysis
  nominal_run3_30x.yml:
    - PhaseC
    - PhaseC_4_FvT_closure
    - PhaseD
    - PhaseF
  nominal_run3_quadjet_run2.yml:
    - PhaseB
    - PhaseC
    - {snakefile: PhaseC_4_FvT_closure, upstream: ["computeJCM/singlefiles/", "metadata/weights/JCM/"]}
    - PhaseD
    - PhaseF
  nominal_run3_nontight.yml:
    - PhaseB
    - PhaseB_1_computeJCM
    - PhaseC
    - {snakefile: PhaseC_4_FvT_closure, upstream: ["computeJCM/singlefiles/", "metadata/weights/JCM/"]}
  nominal_run3_feynnet.yml:
    - PhaseF
  nominal_run3_fvt_closure_plots.yml:
    - PhaseC_4_FvT_closure
  nominal_run3_ci.yml:
    - PhaseF_1_analysis
  lowpt_run2.yml:
    - PhaseF
    - PhaseF_1_analysis
  analysis_ttHbb.yml:
    - PhaseA
    - PhaseB
    - PhaseC
    - PhaseD
    - PhaseF
    - PhaseF_1_analysis
  mixeddata_run2.yml:
    - MakeMixedData
  mixeddata_run3.yml:
    - MakeMixedData
  mvd_run3.yml:
    - MvD
    - MvD_2_train
    - MvD_3_svb
  mvd_run3_30x.yml:
    - MvD
    - MvD_2_train
    - MvD_3_svb
  declustered_run3.yml:
    - DeClustered
  svbfeynnet_run3.yml:
    - SvBFeynNet_friendtrees_Run3

