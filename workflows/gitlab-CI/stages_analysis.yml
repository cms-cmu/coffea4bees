analysis_test_coffea4bees:
  stage: analysis   
  extends:
    - .base_analysis_coffea4bees
  script:
    - source coffea4bees/scripts/analysis-test.sh --output-base /builds/$CI_PROJECT_PATH/output
  artifacts: 
    paths:
      - output/analysis_test/test_databkgs.coffea

