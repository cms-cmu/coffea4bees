  needs:
    - setup_coffea4bees
    - phaseB_2_classifier_inputs_ttHbb_coffea4bees
    - phaseC_fvt_ttHbb_coffea4bees
  script:
    - SNAKEMAKE=.pixi/envs/ci/bin/snakemake; [ -x "$SNAKEMAKE" ] || SNAKEMAKE=.pixi/envs/default/bin/snakemake
    - $SNAKEMAKE all_PhaseD -s coffea4bees/workflows/Snakefile_PhaseD.smk --configfile coffea4bees/workflows/config/ttHbb.yml --config test=true eos_prod=output web_prod=output 'test_year_eras={"UL18":["A"]}' --jobs 2
    - python coffea4bees/workflows/scripts/validate_phaseD.py --yields output/SvB_ttHbb_stitched/yields.json --model-result output/ttHbb/classifier/SvB_ttHbb_stitched/result.json --friend-result output/ttHbb/friend/SvB_ttHbb_stitched/result.json --output output/SvB_ttHbb_stitched/phaseD_validation.txt
    - python coffea4bees/workflows/scripts/validate_phaseD.py --yields output/SvB_MA_ttHbb_stitched/yields.json --model-result output/ttHbb/classifier/SvB_MA_ttHbb_stitched/result.json --friend-result output/ttHbb/friend/SvB_MA_ttHbb_stitched/result.json --quantiles output/SvB_MA_ttHbb_stitched/svb_quantiles.json --output output/SvB_MA_ttHbb_stitched/phaseD_validation.txt
  artifacts:
    when: always
    paths:
      - output/SvB_ttHbb_stitched/
      - output/SvB_MA_ttHbb_stitched/
      - output/ttHbb/classifier/SvB_ttHbb_stitched/
      - output/ttHbb/classifier/SvB_MA_ttHbb_stitched/
      - output/ttHbb/friend/SvB_ttHbb_stitched/
      - output/ttHbb/friend/SvB_MA_ttHbb_stitched/
      - output/ttHbb/handoff/
      - barista_framework/output/SvB_ttHbb_stitched/
      - barista_framework/output/SvB_MA_ttHbb_stitched/
      - barista_framework/output/ttHbb/classifier/SvB_ttHbb_stitched/
      - barista_framework/output/ttHbb/classifier/SvB_MA_ttHbb_stitched/
      - barista_framework/output/ttHbb/friend/SvB_ttHbb_stitched/
      - barista_framework/output/ttHbb/friend/SvB_MA_ttHbb_stitched/
      - barista_framework/output/ttHbb/handoff/
    expire_in: 1 day
