phaseF_2_bkg_syst_closure_run2_coffea4bees:
  stage: phaseF
  extends:
    - .base_combine_coffea4bees
  needs:
    - setup_coffea4bees
    - phaseF_1_bkg_syst_run2_coffea4bees
  script:
    - |
      OUT_F2="output/HH4b_bkg_syst_ci/bkg_syst_F_2_run_two_stage_closure"
      export PYTHONPATH="$PWD:${PYTHONPATH:-}"
      for REGION in SR SB; do
        mkdir -p "$OUT_F2/closure_fits/HH4b_bkg_syst_ci/SvB_MA/rebin12/$REGION/HH4b"
        python3 coffea4bees/stats_analysis/runTwoStageClosure.py \
          --mix_name HH4b_bkg_syst_ci \
          --classifier SvB_MA \
          --var SvB_MA_ps_hh_fine \
          --channel HH4b \
          --region "$REGION" \
          --rebin 12 \
          --maxBasis 5 \
          --outputPath "$OUT_F2/closure_fits/" \
          --input_file_mix "$OUT_F2/root_inputs/histAll_HH4b_bkg_syst_ci.root" \
          --input_file_data3b "$OUT_F2/root_inputs/histAll_HH4b_bkg_syst_ci.root" \
          --input_file_sig "$OUT_F2/root_inputs/hist_signal_HH4b.root" \
          --input_file_TT "$OUT_F2/root_inputs/histAll_HH4b_bkg_syst_ci.root" \
          --years UL18 \
          --nMixes 2 \
          --subsample_indices 0 1 \
          --do_CI \
          --ignore_failures
        test -s "$OUT_F2/closure_fits/HH4b_bkg_syst_ci/SvB_MA/rebin12/$REGION/HH4b/hists_closure_HH4b_bkg_syst_ci_SvB_MA_ps_hh_fine_rebin12.pkl"
        test -s "$OUT_F2/closure_fits/HH4b_bkg_syst_ci/SvB_MA/rebin12/$REGION/HH4b/closure_status.json"
        cp -f "$OUT_F2/closure_fits/HH4b_bkg_syst_ci/SvB_MA/rebin12/$REGION/HH4b/closure_status.json" "$OUT_F2/closure_fits/HH4b_bkg_syst_ci/SvB_MA/rebin12/$REGION/HH4b/closure_status_SvB_MA_ps_hh_fine.json"
        python3 coffea4bees/stats_analysis/evaluate_closure_candidates.py \
          --status-files "$OUT_F2/closure_fits/HH4b_bkg_syst_ci/SvB_MA/rebin12/$REGION/HH4b/closure_status_SvB_MA_ps_hh_fine.json" \
          --channel HH4b \
          --output "$OUT_F2/summary_SvB_MA_${REGION}.json"
      done
      python3 coffea4bees/stats_analysis/make_closure_summary_html.py \
        --classifier SvB_MA \
        --channel HH4b \
        --summary-sr "$OUT_F2/summary_SvB_MA_SR.json" \
        --summary-sb "$OUT_F2/summary_SvB_MA_SB.json" \
        --output_dir "$OUT_F2/" \
        --output "$OUT_F2/summary_SvB_MA.html"
      cp -f "$OUT_F2/summary_SvB_MA_SR.json" "$OUT_F2/closure_summary.json"
      cp -f "$OUT_F2/summary_SvB_MA.html" "$OUT_F2/closure_summary.html"
      test -s "$OUT_F2/closure_summary.json" && test -s "$OUT_F2/closure_summary.html"
  artifacts:
    when: always
    paths:
      - output/HH4b_bkg_syst_ci/bkg_syst_F_2_run_two_stage_closure/
      - barista_framework/output/HH4b_bkg_syst_ci/bkg_syst_F_2_run_two_stage_closure/
    expire_in: 1 day
