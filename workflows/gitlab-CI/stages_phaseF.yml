phaseF_1_analysis_run2_coffea4bees:
  stage: phaseF
  extends:
    - .base_analysis_coffea4bees
  needs:
    - setup_coffea4bees
    - phaseB_1_computeJCM_run2_coffea4bees
    - phaseB_2_classifier_inputs_run2_coffea4bees
    - phaseC_fvt_run2_coffea4bees
    - phaseD_svb_run2_coffea4bees
  script:
    - SNAKEMAKE=.pixi/envs/ci/bin/snakemake; [ -x "$SNAKEMAKE" ] || SNAKEMAKE=.pixi/envs/default/bin/snakemake
    - $SNAKEMAKE output/TEST/PhaseF_1_analysis/histAll_TEST.coffea output/TEST/PhaseF_1_analysis/cutflow_TEST.yml output/TEST/PhaseF_1_analysis/cutflow_TEST.html -s coffea4bees/workflows/Snakefile_PhaseF_1_analysis.smk --configfile coffea4bees/workflows/config/nominal_run2.yml --config test=true 'test_year_eras={"UL16_preVFP":["C"],"UL16_postVFP":["F"],"UL17":["C"],"UL18":["A"]}' 'dataset=["data","GluGluToHHTo4B_cHHH1","GluGluToHHTo4B_cHHH0","GluGluToHHTo4B_cHHH2p45","GluGluToHHTo4B_cHHH5","ZZ4b","ZH4b","ggZH4b","TTTo2L2Nu","TTToSemiLeptonic","TTToHadronic"]' --jobs 4
    - |
      mkdir -p /tmp/matplotlib_dotest
      "$SNAKEMAKE" output/TEST/PhaseF_1_analysis/plots_TEST/plots_done.txt -s coffea4bees/workflows/Snakefile_PhaseF_1_analysis.smk --configfile coffea4bees/workflows/config/nominal_run2.yml --config test=true 'test_year_eras={"UL16_preVFP":["C"],"UL16_postVFP":["F"],"UL17":["C"],"UL18":["A"]}' 'dataset=["data","GluGluToHHTo4B_cHHH1","GluGluToHHTo4B_cHHH0","GluGluToHHTo4B_cHHH2p45","GluGluToHHTo4B_cHHH5","ZZ4b","ZH4b","ggZH4b","TTTo2L2Nu","TTToSemiLeptonic","TTToHadronic"]' --allowed-rules make_plots --jobs 2 &
      PLOTS_PID=$!
      MPLCONFIGDIR=/tmp/matplotlib_dotest python coffea4bees/workflows/scripts/validate_phaseF1.py --coffea output/TEST/PhaseF_1_analysis/histAll_TEST.coffea --cutflow output/TEST/PhaseF_1_analysis/cutflow_TEST.yml --output output/TEST/PhaseF_1_analysis/phaseF1_validation.txt
      MPLCONFIGDIR=/tmp/matplotlib_dotest python coffea4bees/plots/tests/iPlot_test.py --inputFile output/TEST/PhaseF_1_analysis/histAll_TEST.coffea
      MPLCONFIGDIR=/tmp/matplotlib_dotest python coffea4bees/plots/makePlots.py output/TEST/PhaseF_1_analysis/histAll_TEST.coffea --doTest -o output/TEST/PhaseF_1_analysis/plots_doTest -m coffea4bees/plots/metadata/plotsAll.yml -f pdf,png
      MPLCONFIGDIR=/tmp/matplotlib_dotest python coffea4bees/plots/plot_from_yaml.py \
        --input_yaml \
          output/TEST/PhaseF_1_analysis/plots_doTest/RunII/region_SR_vs_SB/data/SvB_MA_ps_logy.yaml \
          output/TEST/PhaseF_1_analysis/plots_doTest/RunII/region_SR_vs_SB/HH4b/SvB_MA_ps_logy.yaml \
          output/TEST/PhaseF_1_analysis/plots_doTest/RunII/failSvB_vs_passSvB/region_SR/data/v4j_mass.yaml \
          output/TEST/PhaseF_1_analysis/plots_doTest/RunII/failSvB_vs_passSvB/region_SR/HH4b/v4j_mass.yaml \
          output/TEST/PhaseF_1_analysis/plots_doTest/RunII/region_SB/HH4b/quadJet_min_dr_close_vs_other_m.yaml \
          output/TEST/PhaseF_1_analysis/plots_doTest/RunII/region_SB/Multijet/quadJet_min_dr_close_vs_other_m.yaml \
          output/TEST/PhaseF_1_analysis/plots_doTest/RunII/region_SB/ZH4b/quadJet_selected_lead_vs_subl_m.yaml \
        --out output/TEST/PhaseF_1_analysis/plots_from_yaml
      for f in \
        RunII/region_SR_vs_SB/data/SvB_MA_ps_logy.pdf \
        RunII/region_SR_vs_SB/HH4b/SvB_MA_ps_logy.pdf \
        RunII/failSvB_vs_passSvB/region_SR/data/v4j_mass.pdf \
        RunII/failSvB_vs_passSvB/region_SR/HH4b/v4j_mass.pdf \
        RunII/region_SB/HH4b/quadJet_min_dr_close_vs_other_m.pdf \
        RunII/region_SB/Multijet/quadJet_min_dr_close_vs_other_m.pdf \
        RunII/region_SB/ZH4b/quadJet_selected_lead_vs_subl_m.pdf; do
        test -s "output/TEST/PhaseF_1_analysis/plots_doTest/$f"
        test -s "output/TEST/PhaseF_1_analysis/plots_from_yaml/$f"
      done
      wait "$PLOTS_PID"
  artifacts:
    when: always
    paths:
      - output/TEST/PhaseF_1_analysis/
      - barista_framework/output/TEST/PhaseF_1_analysis/
    expire_in: 1 day

