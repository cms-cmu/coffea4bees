phaseF_1_analysis_run2_coffea4bees:
  stage: phaseF
  extends:
    - .base_analysis_coffea4bees
  needs:
    - setup_coffea4bees
    - phaseB_1_computeJCM_run2_coffea4bees
    - phaseB_2_classifier_inputs_run2_coffea4bees
    - phaseC_fvt_run2_coffea4bees
    - phaseD_svb_run2_coffea4bees
  script:
    - SNAKEMAKE=.pixi/envs/ci/bin/snakemake; [ -x "$SNAKEMAKE" ] || SNAKEMAKE=.pixi/envs/default/bin/snakemake
    - $SNAKEMAKE output/TEST/PhaseF_1_analysis/histAll_TEST.coffea output/TEST/PhaseF_1_analysis/cutflow_TEST.yml output/TEST/PhaseF_1_analysis/cutflow_TEST.html output/TEST/PhaseF_1_analysis/plots_TEST/plots_done.txt -s coffea4bees/workflows/Snakefile_PhaseF_1_analysis.smk --configfile coffea4bees/workflows/config/nominal_run2.yml --config test=true error_threshold=1.0 'test_year_eras={"UL16_preVFP":["C"],"UL16_postVFP":["F"],"UL17":["C"],"UL18":["A"]}' 'dataset=["data","GluGluToHHTo4B_cHHH1","GluGluToHHTo4B_cHHH0","GluGluToHHTo4B_cHHH2p45","GluGluToHHTo4B_cHHH5","ZZ4b","ZH4b","ggZH4b","TTTo2L2Nu","TTToSemiLeptonic","TTToHadronic"]' --jobs 4
    - python coffea4bees/workflows/scripts/validate_phaseF1.py --coffea output/TEST/PhaseF_1_analysis/histAll_TEST.coffea --cutflow output/TEST/PhaseF_1_analysis/cutflow_TEST.yml --output output/TEST/PhaseF_1_analysis/phaseF1_validation.txt
  artifacts:
    when: always
    paths:
      - output/TEST/PhaseF_1_analysis/
      - barista_framework/output/TEST/PhaseF_1_analysis/
    expire_in: 1 day

