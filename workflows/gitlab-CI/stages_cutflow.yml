analysis_cutflow_Run3_2025_coffea4bees:
  stage: cutflow
  extends:
    - .base_analysis_coffea4bees
  needs:
    - setup_coffea4bees
    - analysis_test_Run3_2025_coffea4bees
  script:
    - source coffea4bees/scripts/analysis-cutflow-Run3-2025.sh --output-base /builds/$CI_PROJECT_PATH/output
  artifacts:
    paths:
      - output/analysis_cutflow_Run3_2025/test_dump_cutflow.yml

analysis_unsup_cutflow_coffea4bees:
  stage: cutflow
  extends:
    - .base_analysis_coffea4bees
  needs: 
    - setup_coffea4bees
    - job: analysis_unsup_test_coffea4bees
      optional: true
  script:
    - source coffea4bees/scripts/analysis-unsup-cutflow.sh --output-base /builds/$CI_PROJECT_PATH/output
  artifacts:
    paths:
      - output/analysis_unsup_cutflow/test_dump_cutflow_job_unsup.yml
