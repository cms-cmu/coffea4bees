analysis_unsup_test_coffea4bees:
  stage: extras
  extends:
    - .base_analysis_coffea4bees
  script:
    - source coffea4bees/scripts/analysis-unsup-test.sh --output-base /builds/$CI_PROJECT_PATH/output
  artifacts:
    paths:
      - output/analysis_unsup_test/test_unsup.coffea

analysis_unsup_cutflow_coffea4bees:
  stage: extras
  extends:
    - .base_analysis_coffea4bees
  needs:
    - setup_coffea4bees
    - job: analysis_unsup_test_coffea4bees
      optional: true
  script:
    - source coffea4bees/scripts/analysis-unsup-cutflow.sh --output-base /builds/$CI_PROJECT_PATH/output
  artifacts:
    paths:
      - output/analysis_unsup_cutflow/test_dump_cutflow_job_unsup.yml

analysis_unsup_plot_coffea4bees:
  stage: extras
  extends:
    - .base_analysis_coffea4bees
  needs:
    - setup_coffea4bees
    - analysis_unsup_test_coffea4bees
  script:
    - source coffea4bees/scripts/analysis-unsup-plot.sh --output-base /builds/$CI_PROJECT_PATH/output
  artifacts:
    paths:
      - output/analysis_plot_unsup/RunII/
