workflow_validation_coffea4bees:
  stage: workflows
  extends:
    - .base_analysis_coffea4bees
  # Every .smk compiles, every top-level Snakefile is in dryrun_matrix.yml, and every
  # (production config, Snakefile) pair there dry-runs with test=false/true. Offline, ~10 s.
  # coffea4bees CI installs the pixi `ci` env, barista CI (which includes this job) only the default one.
  script:
    - SNAKEMAKE=.pixi/envs/ci/bin/snakemake; [ -x "$SNAKEMAKE" ] || SNAKEMAKE=.pixi/envs/default/bin/snakemake
    - python coffea4bees/workflows/scripts/ci_workflow_dryrun.py --snakemake "$SNAKEMAKE"

workflow_config_validation_coffea4bees:
  stage: workflows
  extends:
    - .base_analysis_coffea4bees
  # Audits CI workflow configs for base layering, parameter divergence (datasets, eras, flags),
  # and reference integrity before workflows execute.
  script:
    - python coffea4bees/workflows/scripts/validate_config.py --ci

phaseA_1_skimmer_run2_coffea4bees:
  stage: skimmer
  extends:
    - .base_analysis_coffea4bees
  needs:
    - setup_coffea4bees
  script:
    - pixi run snakemake -s coffea4bees/workflows/Snakefile_PhaseA_1_skimmer.smk --configfile coffea4bees/workflows/config/nominal_run2_ci.yml --config test=true dataset=GluGluToHHTo4B_cHHH1 year=UL18 --jobs 4
    - python coffea4bees/workflows/scripts/validate_phaseA.py skimmer --new-datasets output/run2_nominal_ci/modified_datasets/new_datasets.yml --known coffea4bees/analysis/tests/known_PhaseA_run2.yml
  artifacts:
    when: always
    paths:
      - output/run2_nominal_ci/skimmer/
      - output/run2_nominal_ci/modified_datasets/
      - output/run2_nominal_ci/logs/
      - barista_framework/output/run2_nominal_ci/skimmer/
      - barista_framework/output/run2_nominal_ci/modified_datasets/
      - barista_framework/output/run2_nominal_ci/logs/
    expire_in: 1 day

phaseA_2_trigWeights_run2_coffea4bees:
  stage: friendtree
  extends:
    - .base_analysis_coffea4bees
  needs:
    - setup_coffea4bees
    - phaseA_1_skimmer_run2_coffea4bees
  script:
    - pixi run snakemake -s coffea4bees/workflows/Snakefile_PhaseA_2_trigWeights.smk --configfile coffea4bees/workflows/config/nominal_run2_ci.yml --config test=true dataset=GluGluToHHTo4B_cHHH1 year=UL18 trigger_weights_dataset_location=output/run2_nominal_ci/modified_datasets/modified_datasets.yml --jobs 4
    - python coffea4bees/workflows/scripts/validate_phaseA.py trigweights --friends output/run2_nominal_ci/trigger_weights/trigger_weights_friends.json --known coffea4bees/analysis/tests/known_PhaseA_run2.yml
  artifacts:
    when: always
    paths:
      - output/run2_nominal_ci/trigger_weights/
      - output/run2_nominal_ci/logs/
      - barista_framework/output/run2_nominal_ci/trigger_weights/
      - barista_framework/output/run2_nominal_ci/logs/
    expire_in: 1 day

phaseA_3_trigValidation_run2_coffea4bees:
  stage: analysis
  extends:
    - .base_analysis_coffea4bees
  needs:
    - setup_coffea4bees
    - phaseA_1_skimmer_run2_coffea4bees
    - phaseA_2_trigWeights_run2_coffea4bees
  script:
    - pixi run snakemake all_trig_validation -s coffea4bees/workflows/Snakefile_TrigWeights.smk --configfile coffea4bees/workflows/config/nominal_run2_ci.yml --config test=true dataset=GluGluToHHTo4B_cHHH1 year=UL18 dataset_location=output/run2_nominal_ci/modified_datasets/modified_datasets.yml trigger_weights_dataset_location=output/run2_nominal_ci/modified_datasets/modified_datasets.yml --jobs 4
    - cat output/run2_nominal_ci/trig_validation/trig_validation.txt
  artifacts:
    when: always
    paths:
      - output/run2_nominal_ci/trig_validation/
      - barista_framework/output/run2_nominal_ci/trig_validation/
    expire_in: 1 day

phaseB_1_computeJCM_run2_coffea4bees:
  stage: analysis
  extends:
    - .base_analysis_coffea4bees
  needs:
    - setup_coffea4bees
  script:
    - pixi run snakemake output/run2_nominal_ci/PhaseB_1_computeJCM/JCM_2024_v2/jetCombinatoricModel_SB_2024_v2.yml output/run2_nominal_ci/PhaseB_1_computeJCM/cutflow_validation_NoJCM.txt output/run2_nominal_ci/PhaseB_1_computeJCM/cutflow_NoJCM.html -s coffea4bees/workflows/Snakefile_PhaseB.smk --configfile coffea4bees/workflows/config/nominal_run2_ci.yml --config test=true --jobs 4
  artifacts:
    when: always
    paths:
      - output/run2_nominal_ci/PhaseB_1_computeJCM/
      - barista_framework/output/run2_nominal_ci/PhaseB_1_computeJCM/
    expire_in: 1 day

phaseB_2_classifier_inputs_run2_coffea4bees:
  stage: classifier
  extends:
    - .base_analysis_coffea4bees
  needs:
    - setup_coffea4bees
    - phaseB_1_computeJCM_run2_coffea4bees
  script:
    - pixi run snakemake all_PhaseB -s coffea4bees/workflows/Snakefile_PhaseB.smk --configfile coffea4bees/workflows/config/nominal_run2_ci.yml --config test=true --jobs 4
    - cat output/run2_nominal_ci/phaseB_validation.txt
  artifacts:
    when: always
    paths:
      - output/run2_nominal_ci/PhaseB_1_computeJCM/
      - output/run2_nominal_ci/PhaseB_2_classifier_inputs/
      - output/run2_nominal_ci/handoff/
      - output/run2_nominal_ci/logs/
      - output/run2_nominal_ci/phaseB_validation.txt
      - barista_framework/output/run2_nominal_ci/PhaseB_1_computeJCM/
      - barista_framework/output/run2_nominal_ci/PhaseB_2_classifier_inputs/
      - barista_framework/output/run2_nominal_ci/handoff/
      - barista_framework/output/run2_nominal_ci/logs/
      - barista_framework/output/run2_nominal_ci/phaseB_validation.txt
    expire_in: 1 day

