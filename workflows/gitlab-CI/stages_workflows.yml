workflow_validation_coffea4bees:
  stage: workflows
  extends:
    - .base_analysis_coffea4bees
  script:
    - python -m pip install snakemake --quiet
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseA.smk --configfile coffea4bees/workflows/config/analysis_ttHbb.yml -n
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseB.smk --configfile coffea4bees/workflows/config/analysis_ttHbb.yml -n
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseC.smk --configfile coffea4bees/workflows/config/analysis_ttHbb.yml -n
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseD.smk --configfile coffea4bees/workflows/config/analysis_ttHbb.yml -n
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseF.smk --configfile coffea4bees/workflows/config/nominal_run2.yml -n
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseF_1_analysis.smk --configfile coffea4bees/workflows/config/nominal_run2.yml -n
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseF_1_analysis.smk --configfile coffea4bees/workflows/config/lowpt_run2.yml -n
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseF_1_analysis.smk --configfile coffea4bees/workflows/config/nominal_run3.yml -n
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseF_1_analysis.smk --configfile coffea4bees/workflows/config/analysis_ttHbb.yml -n
    - mkdir -p output/ttHbb_stitched/computeJCM/ output/ttHbb_stitched/
    - touch output/ttHbb_stitched/computeJCM/histAll_NoJCM.coffea output/ttHbb_stitched/histAll_ttHbb_stitched.json
    - mkdir -p output/ttHbb_mixeddata_stitched_closure/json_inputs/ output/ttHbb_mixeddata_stitched_closure/root_inputs/ output/ttHbb_mixeddata_stitched_closure/singlefiles/ output/ttHbb_mixeddata_stitched_closure/JCM_subsamples/ output/ttHbb_mixeddata_stitched_closure/FvT_training/friends/ output/ttHbb_mixeddata_stitched_closure/closure_fits/ttHbb_mixeddata_stitched/SvB_MA/rebin1/SR/ttHbb/
    - touch output/ttHbb_mixeddata_stitched_closure/histAll_ttHbb_mixeddata_stitched.coffea output/ttHbb_mixeddata_stitched_closure/json_inputs/histAll_ttHbb_mixeddata_stitched.json output/ttHbb_mixeddata_stitched_closure/root_inputs/histAll_ttHbb_mixeddata_stitched.root output/ttHbb_mixeddata_stitched_closure/root_inputs/histMixedBkg_data_3b_for_mixed.root
    - for i in $(seq 0 15); do touch output/ttHbb_mixeddata_stitched_closure/JCM_subsamples/jetCombinatoricModel_SB_mix_v${i}.yml output/ttHbb_mixeddata_stitched_closure/FvT_training/friends/friends_FvT_ttHbb_mixeddata_stitched_v${i}.json; done
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseE.smk --configfile coffea4bees/workflows/config/analysis_ttHbb_mixeddata.yml -n
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseE_1_make_mixeddata.smk --configfile coffea4bees/workflows/config/analysis_ttHbb_mixeddata.yml -n
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseE_2_make_subsamples.smk --configfile coffea4bees/workflows/config/analysis_ttHbb_mixeddata.yml -n
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseE_3_make_ttbar_psdata.smk --configfile coffea4bees/workflows/config/analysis_ttHbb_mixeddata.yml -n
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseE_4_FvT_training.smk --configfile coffea4bees/workflows/config/analysis_ttHbb_mixeddata.yml -n
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseE_5_analysis.smk --configfile coffea4bees/workflows/config/analysis_ttHbb_mixeddata.yml -n
    - python -m snakemake -s coffea4bees/workflows/Snakefile_PhaseE_6_closure.smk --configfile coffea4bees/workflows/config/analysis_ttHbb_mixeddata.yml -n

