analysis_unsup_plot_coffea4bees:
  stage: plot
  extends:
    - .base_analysis_coffea4bees
  needs:
    - setup_coffea4bees
    - analysis_unsup_test_coffea4bees
  script:
    - source coffea4bees/scripts/analysis-unsup-plot.sh --output-base /builds/$CI_PROJECT_PATH/output
  artifacts:
    paths:
      - output/analysis_plot_unsup/RunII/

synthetic_dataset_plot_coffea4bees:
  stage: plot
  extends:
    - .base_analysis_coffea4bees
  needs:
    - setup_coffea4bees
    - synthetic_dataset_cluster_coffea4bees
  script:
    - source coffea4bees/scripts/synthetic-dataset-plot.sh --output-base /builds/$CI_PROJECT_PATH/output
  artifacts:
    paths:
      - output/synthetic_dataset_plot/jet-splitting-PDFs-test/
