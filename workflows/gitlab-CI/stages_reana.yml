reana-job:
  stage: reana
  image: reanahub/reana-client:0.9.4
  needs:
    - setup_coffea4bees
  tags:
    - k8s-cvmfs
  before_script:
    - set -e
    - set -o pipefail
    - cd barista_framework/
  script:
    - bash coffea4bees/scripts/reana-job.sh $NAME
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        NAME: "coffea4bees_scheduled_${CI_COMMIT_SHORT_SHA}"
    - if: $RUN_REANA == "true"
      variables:
        NAME: "coffea4bees_${CI_COMMIT_SHORT_SHA}"
    - if: $CI_PIPELINE_SOURCE == "push"
      when: never
  allow_failure: true
