phaseC_fvt_run2_coffea4bees:
  stage: phaseC
  extends:
    - .base_analysis_coffea4bees
  needs:
    - setup_coffea4bees
    - phaseB_2_classifier_inputs_run2_coffea4bees
  script:
    - SNAKEMAKE=.pixi/envs/ci/bin/snakemake; [ -x "$SNAKEMAKE" ] || SNAKEMAKE=.pixi/envs/default/bin/snakemake
    - $SNAKEMAKE all_PhaseC -s coffea4bees/workflows/Snakefile_PhaseC.smk --configfile coffea4bees/workflows/config/nominal_run2.yml --config test=true eos_prod=output web_prod=output 'test_year_eras={"UL16_preVFP":["C"],"UL16_postVFP":["F"],"UL17":["C"],"UL18":["A"]}' --jobs 2
    - python coffea4bees/workflows/scripts/validate_phaseC.py --yields output/TEST/PhaseC_FvT/yields.json --model-result output/TEST/classifier/FvT_nominal/result.json --friend-result output/TEST/friend/FvT_nominal/result.json --output output/TEST/PhaseC_FvT/phaseC_validation.txt
  artifacts:
    when: always
    paths:
      - output/TEST/PhaseC_FvT/
      - output/TEST/classifier/FvT_nominal/
      - output/TEST/friend/FvT_nominal/
      - barista_framework/output/TEST/PhaseC_FvT/
      - barista_framework/output/TEST/classifier/FvT_nominal/
      - barista_framework/output/TEST/friend/FvT_nominal/
    expire_in: 1 day

