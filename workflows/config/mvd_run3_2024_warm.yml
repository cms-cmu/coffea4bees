# ==============================================================================
# 2024 MvD (mixed 1x) finetune-fix redo, WARM START from the original MvD models -- the CHECK
# ==============================================================================
# As mvd_run3_2024_ftfix.yml, with the MvD warm-started from mvd_run3_2024_20261023_c1e0fcf-788068e's
# saved fold models (HH4b_Run3/MvD_warm: the schedule's 5-epoch decay tail + the fixed finetune; see
# mvd_run3_warm.yml). 2024 mixed also has a from-scratch redo (mvd_run3_2024_ftfix_20261107_1c7c8db-3d65ecc),
# so this one validates the warm start: it should reach the same closure, loss and limit.
#
#   roast new --config coffea4bees/workflows/config/mvd_run3_2024_warm.yml \
#       --step nautilus:coffea4bees/workflows/Snakefile_MvD_2_train.smk \
#       --step cmslpc:coffea4bees/workflows/Snakefile_MvD.smk \
#       --step nautilus:coffea4bees/workflows/Snakefile_MvD_3_svb.smk
# ==============================================================================
base: coffea4bees/workflows/config/mvd_run3_2024_ftfix.yml

label: "mvd_run3_2024_warm"

mvd:
  wfs_base: "coffea4bees/classifier/config/workflows/HH4b_Run3/MvD_warm"
  workflow_inserts:
    --training: ["--pretrained-weights {roast:mvd_run3_2024_20261023_c1e0fcf-788068e}/classifier/MvD"]

closure:
  known_counts: "coffea4bees/analysis/tests/known_fullCounts_MvD_closure_Run3_2024_warm.yml"

analysis:
  known_counts: "coffea4bees/analysis/tests/known_fullCounts_MvD_Run3_2024_warm.yml"
