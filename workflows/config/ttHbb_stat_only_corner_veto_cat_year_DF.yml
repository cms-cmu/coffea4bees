# Phase F: reuse Nov 24 JCM and CatYear FvT; use THIS roast's Phase D SvB, SvB_MA, and svb_quantiles
analysis_config:
  config:
    SvB: true
    SvB_MA: true
    fill_histograms: "kinematics+FvT+SvB"
    svb_binning_file: "{eos_prod}/{roast_id}/handoff/svb_quantiles.json"
    JCM_file:
      UL16_preVFP: "{eos_prod}/ttHbb_stat_only_corner_veto_20261124_2426411-ea08b10/handoff/jetCombinatoricModel_SB_2024_v2_UL16_preVFP.yml"
      UL16_postVFP: "{eos_prod}/ttHbb_stat_only_corner_veto_20261124_2426411-ea08b10/handoff/jetCombinatoricModel_SB_2024_v2_UL16_postVFP.yml"
      UL17: "{eos_prod}/ttHbb_stat_only_corner_veto_20261124_2426411-ea08b10/handoff/jetCombinatoricModel_SB_2024_v2_UL17.yml"
      UL18: "{eos_prod}/ttHbb_stat_only_corner_veto_20261124_2426411-ea08b10/handoff/jetCombinatoricModel_SB_2024_v2_UL18.yml"
    friends:
      FvT: "{eos_prod}/ttHbb_stat_only_corner_veto_cat_year_20261125_d095fd0-3b71047/friend/FvT_ttHbb_stitched/result.json@@analysis.0.merged"
      SvB: "{eos_prod}/{roast_id}/friend/SvB_ttHbb_stitched/result.json@@analysis.0.merged"
      SvB_MA: "{eos_prod}/{roast_id}/friend/SvB_MA_ttHbb_stitched/result.json@@analysis.0.merged"
    candidates_selection_cfg: "coffea4bees/analysis/metadata/candidates_selection_thresholds_ttHbb_corner_veto.yml"

convert_hist_to_json:
  histos:
    - "SvB_MA.ps"
    - "SvB_MA.ps_ttHbb"
    - "SvB.ps"
    - "SvB.ps_ttHbb"

make_combine_inputs:
  rebin: 12
  stat_only: "--stat_only"
  unify_background: true
  tt_processes:
    - "TTbar4b_from_d3"

# Phase F.2: add SvB channels alongside inherited SvB_MA channels
channels:
  inclusive_SvB:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB.ps_ttHbb"
    signal: "ttHbb"
    closure_subdir: "ttHbb"
    region: "SR"
    cut: "sum"
    rebin: 24
    stat_only: false
    metadata: "coffea4bees/stats_analysis/metadata/ttHbb.yml"
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
  lepton_veto_SvB:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB.ps_ttHbb"
    signal: "ttHbb"
    closure_subdir: "ttHbb"
    region: "SR"
