# ==============================================================================
# 2024 nominal F.1 + F.2, BLINDED rerun on nominal_run3_2024_20261011_852c1c2-be0604a
# ==============================================================================
#   roast new --config coffea4bees/workflows/config/nominal_run3_2024_blindF.yml --phases F
#
# Only the differences from nominal_run3_2024.yml (`base:` overlay). A BLINDED rerun of the Phase F of
# nominal_run3_2024_20261011_852c1c2-be0604a, whose first Phase F ran with blind: false and published unblinded 4b SR data
# (taken down from CERNBox 2026-10-19). Nothing upstream is re-run: the JCM, the FvT and the SvB friends are read from that roast.
# The base now carries the blinding (4b SR data with any SvB ps > 0.8 dropped; MC and mixed data never blinded).
base: coffea4bees/workflows/config/nominal_run3_2024.yml

label: "Run3_2024_nominal_blind"
output_path: "output/Run3_2024_nominal_blind/"

handoff:
  # F reads the base production's handoff/friend areas, which check_handoff_refs would otherwise
  # reject as drift from this roast's (empty) handoff area.
  allow_external_refs: true

analysis_config:
  config:
    friends:
      FvT: "{roast:nominal_run3_2024_20261011_852c1c2-be0604a}/friend/FvT_nominal/result.json@@analysis.0.merged"
      SvB_MA: "{roast:nominal_run3_2024_20261011_852c1c2-be0604a}/friend/SvB_nominal/result.json@@analysis.0.merged"
    JCM_file: "{roast:nominal_run3_2024_20261011_852c1c2-be0604a}/handoff/jetCombinatoricModel_SB_Run3_2024_v1.yml"

# No C.4 in this roast: the F.1 vs C.4 crosscheck writes its placeholder (it passed, 576/576 entries, in
# the unblinded F of nominal_run3_2024_20261011_852c1c2-be0604a; blinding only removes 4b SR data).
# The blinded counts, blessed from this rerun.
known_counts: "coffea4bees/analysis/tests/known_fullCounts_Run3_2024_nominal.yml"
