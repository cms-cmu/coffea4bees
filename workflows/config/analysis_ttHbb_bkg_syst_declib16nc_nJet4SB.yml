# ttHbb Run 2 background systematic with the DeClustered library (declib16nc), reading the
# *nominal* products (JCM histograms, classifier inputs, SvB friend/model, nominal histograms) from the
# can_ttH asymmetric-ellipse SR (nJet>=5) + SB (nJet==4 inside the ellipse) roast. A_3, B_1 and F_1 run
# the same can_ttH pairing so every region definition matches the nominal products.
base: coffea4bees/workflows/config/analysis_ttHbb_bkg_syst_declib16nc.yml
label: "ttHbb_bkg_syst_declib16nc_nJet4SB"
inputs:
  upstream_roasts:
    nominal: ttHbb_asymEllipse_nJet4SB_20261017_aa1ba89-f610a88
  # That roast trained a single SvB model (SvB_ttHbb_stitched) and used it as the SvB_MA classifier,
  # so SvB_MA points at the same files as SvB (the base config expects a separate SvB_MA_ttHbb_stitched).
  SvB_MA: "{roast:nominal}/friend/SvB_ttHbb_stitched/result.json@@analysis.0.merged"
  SvB_MA_model: "{roast:nominal}/classifier/SvB_ttHbb_stitched/result.json"
# Only SvB_MA: scoring the same model again as SvB would duplicate the evaluation and histograms.
classifiers:
  - "SvB_MA"
classifier_variables:
  SvB_MA: "SvB_MA_ps_ttHbb"
# Let the whole workflow finish when the closure bias / ensemble-variance tests do not pass
# (the old nJet4SB roast ran this way; the workflow no longer passes --ignore_failures itself).
closure_extra_args: "--ignore_failures"
analysis_config:
  config:
    pairing: can_ttH
