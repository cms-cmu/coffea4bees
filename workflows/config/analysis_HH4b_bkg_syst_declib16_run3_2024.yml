# ==============================================================================
# HH4b Run 3 2024 BACKGROUND SYSTEMATIC: FvT nominal, systematic on the 16x DECLUSTERED subsamples
# ==============================================================================
# The 2024 counterpart of analysis_HH4b_bkg_syst_declib16_run3_ftfix.yml (2022+2023; roast
# analysis_HH4b_bkg_syst_declib16_run3_ftfix_20261109_8b3f88c-1dbd8f3), written standalone from that
# roast's captured config: a `base:` overlay would merge the 2022/2023 year_eras keys in (dicts merge).
#   nominal     nominal_run3_2024_ftfix (FvT + SvB, finetune fix); its Phase B (JCM histograms,
#               classifier-input manifest) is nominal_run3_2024_20261021's, which the redo reused
#   subsamples  the 16 seeds of the 2024 declustered library declib16_run3_2024_20261025 (multijet)
#               + the 2024 ttbar pseudodata (mixeddata_run3_2024_20261022's M.5), re-tagged tight
#   2024        one year, eras C..I3; no `year` ancillary feature (constant in one year); one
#               JCM-weight; trigger weights trigweights_Run3_v6.json; datacard template HH4b_run3_2024.yml
#   GPU         CMU ORCHARD (roast --train-on/--eval-on orchard): two FvT trainings per job, FvT
#               evaluations split by era group (the unsplit 2024 evaluation OOMs at 63 Gi), 8 per job
# Compared with analysis_HH4b_bkg_syst_mvd_declib16_mixed_run3_2024.yml (MvD-declustered, systematic on mixed data).
#
#   bin/roast new --config coffea4bees/workflows/config/analysis_HH4b_bkg_syst_declib16_run3_2024.yml \
#       --phases BKG_AB,BKG_C,BKG_C4,BKG_F --cmslpc --train-on orchard --eval-on orchard
# ==============================================================================
label: HH4b_bkg_syst_declib16_run3_2024
output_path: output/{roast_id}/
per_year_jcm: false
unify_background: false
match_closure_normalization: false
fourTag_use_tight: true
publish_base: '{eos_prod}/{roast_id}'
handoff:
  eos_base: '{eos_prod}/{roast_id}/handoff'
channel: HH4b
mix_name: HH4b_bkg_syst_declib16_run3_2024
dataset_location: coffea4bees/metadata/datasets/
weights_file: coffea4bees/metadata/weights/weights_HH4b.yml
years:
- '2024'
year_eras:
  '2024':
  - C
  - D
  - E
  - F
  - G
  - H
  - I2
  - I3
phase_f_output_path: inputs/
phase_f_label: Run3_2024_nominal
ttbar_processes:
- TTTo2L2Nu
- TTToSemiLeptonic
- TTToHadronic
inputs:
  upstream_roasts:
    declib: declib16_run3_2024_20261025_d23bf9a-616755c
    nominal: nominal_run3_2024_ftfix_20261106_1c7c8db-d5ec5c4
    nominal_b: nominal_run3_2024_20261021_975a18e-e176976
    mixeddata: mixeddata_run3_2024_20261022_d7a35ab-8470e14
  mixeddata_all: '{roast:declib}/handoff/synthetic_data_lib16_2024_multijet.yml'
  ttbar_psdata: '{roast:mixeddata}/handoff/ttbar_PSData.yml'
  jcm_hists: '{roast:nominal_b}/{roast:nominal_b:output_path}computeJCM/histAll_NoJCM.coffea'
  nominal_hists: '{roast:nominal}/{roast:nominal:output_path}histAll_{roast:nominal:label}.coffea'
  classifier_inputs: '{roast:nominal_b}/handoff/classifier_inputs_{roast:nominal_b:id}.json'
  SvB: '{roast:nominal}/friend/SvB_nominal/result.json@@analysis.0.merged'
  SvB_model: '{roast:nominal}/classifier/SvB_nominal/result.json'
worker_memory: 8GB
subsamples:
  source: seeds
  n: 16
  dataset_name: mixeddata_4b
  runner:
    condor: true
    shared_dask: true
    worker_memory: 8GB
subsample_processor_config: coffea4bees/workflows/config/analysis_config_bkg_syst_subsamples_HH4b_run3.yml
phaseA_3:
  runner:
    workers: 4
    min_workers: 25
    max_workers: 200
validation:
  plot_template: coffea4bees/plots/metadata/plots_bkg_syst_mixed_validation_HH4b.yml
  hists:
  - SvB_MA.ps_hh
  - SvB_MA.ps
  - SvB_MA.tt_vs_mj
  - selJets.n
  - tagJets.n
  model_ttbar:
  - TTbar4b_from_d3
  model_ttbar_tag: threeTag
  subsample: 0
phaseB_1:
  per_year_jcm: false
  jcm:
    config: coffea4bees/analysis/jcm_tools/metadata/HH4b_subsample_jcm_config.yml
    plot_config: coffea4bees/plots/metadata/plotsJCM.yml
    region: SB
    year: Run3
  validation:
    subsample: 0
    processor_config: coffea4bees/workflows/config/analysis_config_bkg_syst_test_subsample_HH4b_run3.yml
    plot_config: coffea4bees/plots/metadata/plots_subsample_v0_closure_HH4b.yml
    runner:
      workers: 4
      worker_memory: 6GB
      condor: true
      shared_dask: true
    config:
      blind: false
      apply_FvT: false
      apply_JCM: true
      apply_trigWeight: false
      apply_btagSF: true
      apply_boosted_veto: false
      run_SvB: false
      top_reconstruction: fast
      fill_histograms: kinematics
      fourTag_use_tight: true
classifier_setting:
- module: ml.DataLoader
  option:
  - optimize_sliceable_dataset: true
  - num_workers: 2
  - batch_eval: 65536
- module: ROOT
  option:
  - friend_allow_missing: false
- module: cms.CollisionData
  option:
  - eras:
      '2024':
      - C
      - D
      - E
      - F
      - G
      - H
      - I2
      - I3
- module: HCR.InputBranch
  option:
  - feature_ancillary:
    - xW
    - nSelJets
    - xbW
  - mass_regions:
    - SR
    - SB
- module: ml.Training
  option:
  - precision: fp16
fvt_train_workflow:
  main:
    module: train
    option:
    - --max-loaders 2
    - --max-trainers 3
    - --device cuda cpu
  dataset:
  - module: HCR.FvT.TrainBaseline
    option:
    - --metadata {metadata}
    - --max-workers 20
    - --data-source detector mixed
    - --no-detector-4b
    - --data-mixed-name {mixed_name}
    - --data-mixed-samples {mix}
    - --JCM-weight year:2024 {jcm_2024}@@JCM_weights
    - --friends "" {nominal_ci}@@HCR_input {mixed_ci}@@HCR_input
  model:
  - module: HCR.FvT.baseline.Train
    option:
    - --kfolds 3
    - --kfold-seed FvT random
    - --kfold-seed-offsets 0
    - --training FixedStep
    - epoch: 20
      bs_init: 1024
    - --finetuning FinetuneStep
    - epoch: 1
      bs_init: 16384
  setting:
  - module: IO
    option:
    - output: '{model}'
fvt_eval_workflow:
  main:
    module: evaluate
    option:
    - --max-evaluators 3
    - --device cuda cpu
  dataset:
  - module: HCR.FvT.Eval
    option:
    - --metadata {metadata}
    - --max-workers 8
    - --data-source detector
    - --friends "" {nominal_ci}@@HCR_input
  model:
  - module: HCR.FvT.baseline.Eval
    option:
    - --models
    - Final
    - '{model}/result.json'
  analysis:
  - module: kfold.Merge
    option:
    - --name FvT
    - --step 100000
    - --workers 4
    - --clean
  setting:
  - module: IO
    option:
    - output: '{FvT}'
phase_e_fvt:
  channel: HH4b
  mix_name: HH4b_bkg_syst_declib16_run3_2024
  n_models: 16
  plot_base: '{web_prod}/{roast_id}/classifier_plots'
  precision: fp16
  gpu_gres: mps:25
  plot_inputs: false
  plot_weights: false
  analyze: false
  evaluate: true
analysis_config:
  processor: coffea4bees/analysis/processors/processor_HH4b.py
  weights_file: coffea4bees/metadata/weights/weights_HH4b.yml
  runner:
    workers: 8
    chunksize: 100000
    condor: false
    shared_dask: false
    run_performance: false
analysis_config_mixeddata_bkgs: coffea4bees/workflows/config/analysis_config_mixeddata_bkgs_HH4b_run3.yml
closure_plot_config: coffea4bees/plots/metadata/plots_bkg_syst_closure_HH4b.yml
trigweights_file: coffea4bees/metadata/friends/trigweights_Run3_v6.json@@trigWeight
classifier: SvB_MA
variable: SvB_MA_ps_hh_fine
variable_substem: ps_hh_fine
signal_processes:
- GluGlutoHHto4B_kl-1p00_kt-1p00_c2-0p00
closure_rebin_candidates:
- 2
- 12
- 15
- 16
- 20
- 24
max_basis: 5
rebin: 12
no_sqrt_n_priors: false
convert_hist_to_json:
  histos:
  - SvB_MA.ps_hh_fine
  - SvB_MA.ps_hh
combine_outdir: bkg_syst_F_3_stats/datacards/
make_combine_inputs:
  stat_only: ''
  metadata_template: coffea4bees/stats_analysis/metadata/HH4b_run3_2024.yml
  multijet_process: data
  unify_background: false
  tt_processes:
  - TTTo
  - TTbar4b_from_d3
combine_flags: --three_tag threeTag --four_tag fourTag --region sum --blind
likelihood_scan_points: 40
likelihood_scan_r_min: 0
likelihood_scan_r_max: 2
likelihood_scan_y_cut: 30
likelihood_scan_y_max: 30
channels:
  HH4b:
    signallabel: ggHH_kl_1_kt_1_13p0TeV_hbbhbb
    othersignal: ''
    variable: SvB_MA.ps_hh_fine
    signal: GluGlutoHHto4B_kl-1p00_kt-1p00_c2-0p00
    closure_subdir: HH4b
    region: SR
    cut: sum
    combine_flags: --three_tag threeTag --four_tag fourTag --region SR --blind
fvt_closure:
  config:
    fourTag_use_tight: true
f1_validation:
  max_sb_yield: 2000000
eval_splits:
  CDE:
    --data-eras:
    - C
    - D
    - E
  F:
    --data-eras:
    - F
  G:
    --data-eras:
    - G
  HI:
    --data-eras:
    - H
    - I2
    - I3
orchard:
  time: '4:00:00'
  pack: 2
  pack_cpus: 16
  pack_mem: 120
  pack_wait: 900
  eval_time: '8:00:00'
  eval_pack: 8
  eval_pack_cpus: 8
  eval_pack_mem: 64
  eval_pack_wait: 900
pilot_gate: false
