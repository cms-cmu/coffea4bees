# ==============================================================================
# ttHbb Run 3 2023 Phase B.2 (classifier-input friend trees), CERN lxplus, outputs in /eos/user/j/jgaytanv only
# ==============================================================================
# Inputs for the combined Run 3 FvT model with per-era JCMs (2022 + 2023 + 2024). Produced alike to the existing 2022/2024
# B.2 inputs: repo-setup selected-jet threshold (2023 = 25 GeV via object_selection_thresholds.yml era_overrides, the
# processor default) and trigger weights PINNED to v1 (Run 3 keys of friends_ttHbb.yml; friends_ttHbb_Run3.yml moved to v3 on 2026-10-07).
# classifier_inputs below = the 2022 block of analysis_ttHbb_run3.yml except friend_file, make_classifier_input and three
# runner keys (lxplus_eos_scratch, skipbadfiles: false -> fail loudly instead of silently skipping chunks, dashboard_address: 0).
# Eras from data.yml (the Snakefile defaults drop C3/C4 and use "D"). No analysis_config/fvt blocks on purpose.
label: "ttHbb_run3_2023_b2_pt25_trigv1"
output_path: "/eos/user/j/jgaytanv/ttHbb/4b/output/ttHbb_run3_2023_b2_pt25_trigv1/"
cern_user: "jgaytanv"

dataset:
  - "ttHbb"
  - "data"
  - "TTTo2L2Nu_stitched"
  - "TTToSemiLeptonic_stitched"
  - "TTToHadronic_stitched"

year_eras:
  2023_preBPix:
    - "C01"
    - "C02"
    - "C11"
    - "C12"
    - "C3"
    - "C4"
  2023_BPix:
    - "D1"
    - "D2"

classifier_inputs:
  processor: "coffea4bees/analysis/processors/processor_ttHbb.py"
  friend_file: "coffea4bees/metadata/friends/friends_ttHbb.yml"
  weights_file: "coffea4bees/metadata/weights/weights_ttHbb.yml"
  datasets:
    - "ttHbb"
    - "data"
    - "TTTo2L2Nu_stitched"
    - "TTToSemiLeptonic_stitched"
    - "TTToHadronic_stitched"
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 10000
    condor: true
    shared_dask: true
    run_performance: true
    max_workers: 500
    condor_transfer_input_files:
      - src/
      - coffea4bees/analysis/
      - coffea4bees/metadata/
    lxplus_eos_scratch: "/eos/user/j/jgaytanv/ttHbb/4b/barista_scratch"
    skipbadfiles: false
    dashboard_address: 0
  config:
    blind: true
    apply_JCM: false
    apply_FvT: false
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: false
    top_reconstruction: slow
    fill_histograms: true
    candidates_selection_cfg: "coffea4bees/analysis/metadata/candidates_selection_thresholds_ttHbb_sb1000.yml"
    make_classifier_input: root://eosuser.cern.ch//eos/user/j/jgaytanv/ttHbb/4b/Run3_v1/b2_2023_pt25_trigv1/
