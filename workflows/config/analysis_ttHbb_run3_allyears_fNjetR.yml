# Combined Run 3 (2022+2023+2024) FvT with per-era f(nJet) x r^n JCMs; copy of analysis_ttHbb_run3.yml, only classifier_setting and fvt: changed.
# ==============================================================================
# ttHbb Run 3 workflow configuration (CERN lxplus, outputs on CERN EOS)
# ==============================================================================
# Inputs (picoAODs, trigger-weight friends) are read remotely from FNAL EOS; every
# output goes to the phys_higgs group area. Phase B.2 (classifier inputs) is the
# first phase run with this file. No ttHbb JCM exists for Run 3 yet: the classifier
# input friend trees dump weight_noJCM_noFvT, so apply_JCM is off here and the JCM
# is applied at training time from the JCM yaml (Phase B.1 is needed before Phase F).
label: "ttHbb_run3"
output_path: "/eos/cms/store/group/phys_higgs/ttHbb/mmarcheg/4b/output/ttHbb_run3/"
cern_user: "mmarcheg"
cern_path: "www/plots/ttHbb/analysis/4b/"

dataset:
  - "ttHbb"
  - "data"
  - "TTTo2L2Nu_stitched"
  - "TTToSemiLeptonic_stitched"
  - "TTToHadronic_stitched"

# 2022 only for now; 2023/2024 picoAODs and trigger-weight friends exist as well.
year_eras:
  2022_preEE:
    - "B"
    - "C"
    - "D"
  2022_EE:
    - "E"
    - "F"
    - "G"
  # 2023_preBPix: ["C01", "C02", "C11", "C12"]
  # 2023_BPix: ["D"]
  # "2024": [...]

# ==============================================================================
# PHASE B.2: CLASSIFIER INPUTS (friend trees for FvT / SvB training)
# ==============================================================================
# Produced for 2022_preEE + 2022_EE on 2026-09-22 (lxplus, CERN HTCondor): 1040 HCR_input friend files
# under make_classifier_input, indexed in coffea4bees/metadata/datasets/classifier_inputs_ttHbb_run3.json
# (use "...classifier_inputs_ttHbb_run3.json@@HCR_input" as the Phase C/D training `metadata`).
classifier_inputs:
  processor: "coffea4bees/analysis/processors/processor_ttHbb.py"
  friend_file: "coffea4bees/metadata/friends/friends_ttHbb_Run3.yml"
  weights_file: "coffea4bees/metadata/weights/weights_ttHbb.yml"
  datasets:
    - "ttHbb"
    - "data"
    - "TTTo2L2Nu_stitched"
    - "TTToSemiLeptonic_stitched"
    - "TTToHadronic_stitched"
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 10000
    condor: true
    shared_dask: true
    run_performance: true
    max_workers: 500
    condor_transfer_input_files:
      - src/
      - coffea4bees/analysis/
      - coffea4bees/metadata/
  config:
    blind: true
    apply_JCM: false
    apply_FvT: false
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: false
    top_reconstruction: slow
    fill_histograms: true
    candidates_selection_cfg: "coffea4bees/analysis/metadata/candidates_selection_thresholds_ttHbb.yml"
    make_classifier_input: root://eoscms.cern.ch//eos/cms/store/group/phys_higgs/ttHbb/mmarcheg/4b/Run3_v1/ttHbb_stitched/

# ==============================================================================
# PHASE B.1: JET COMBINATORIC MODEL (Snakefile_PhaseB_1_computeJCM.smk)
# ==============================================================================
# Runs the analysis processor (analysis_config below, JCM/FvT/SvB forced off) on data and the
# stitched ttbar, fits the JCM in the SB (tag run3_v1), then reruns with the JCM applied.
# The fit is committed as metadata/weights/JCM/Run3_ttHbb/jetCombinatoricModel_SB_run3_2022_v1.yml
# (the Snakemake tag stays run3_v1: it names the existing output directory on EOS).
tag: "run3_v1"
jcm_datasets:
  - "data"
  - "TTTo2L2Nu_stitched"
  - "TTToSemiLeptonic_stitched"
  - "TTToHadronic_stitched"
jcm_plot_config: "coffea4bees/plots/metadata/plots_JCM_ttHbb_stitched.yml"
jcm_extra_arguments: "--jcm_config coffea4bees/analysis/jcm_tools/metadata/ttHbb_stitched_jcm_config.yml -m coffea4bees/plots/metadata/plotsJCM_ttHbb_run3.yml -y Run3"
# No Run 3 cutflow reference yet: only dump the cutflows (the known_fullCounts_JCM_* files are Run 2).
jcm_known_counts_NoJCM: "none"
jcm_known_counts_wJCM: "none"

# ==============================================================================
# PHASE C: FvT CLASSIFIER (Snakefile_PhaseC_{1,2,3}_*.smk; GPU rules run as HTCondor jobs on lxplus)
# ==============================================================================
classifier_setting:
  - module: ml.DataLoader
    option:
      - optimize_sliceable_dataset: true
  - module: ROOT
    option:
      - friend_allow_missing: false
  - module: cms.CollisionData
    option:
      - eras:
          2022_preEE: [B, C, D]
          2022_EE: [E, F, G]
          2023_preBPix: [C01, C02, C11, C12, C3, C4]
          2023_BPix: [D1, D2]
          '2024': [C, D, E, F, G, H, I2, I3]
  - module: cms.MC_TTbar
    option:
      - datasets:
          - TTToSemiLeptonic_stitched
          - TTToHadronic_stitched
          - TTTo2L2Nu_stitched
  - module: HCR.InputBranch
    option:
      # `year` re-added: add_year keeps the first two digits of the era (22/23/24), no longer constant with
      # 2022 + 2023 + 2024 trained together (with a single year it normalises to NaN).
      - feature_ancillary: [xW, nSelJets, xbW, year]

fvt:
  eos_base: "root://eosuser.cern.ch//eos/user/j/jgaytanv/ttHbb/4b/Run3_v1/ttHbb_stitched"
  plot_base: "root://eosuser.cern.ch//eos/user/j/jgaytanv/www/plots/ttHbb/analysis/4b"
  classifier_config_paths: "coffea4bees"
  wfs_base: "coffea4bees/classifier/config/workflows/ttHbb_run3/FvT"
  label: "FvT_ttHbb_run3_allyears_perEraJCM"
  output_dir: "output/FvT_ttHbb_run3_allyears_perEraJCM/"
  plot_inputs: true
  plot_weights: true
  evaluate: true
  model: "{eos_base}/classifier/{label}"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: {eos_base}/classifier/{label}"
  eval_template: "model: {eos_base}/classifier/{label}, FvT: {eos_base}/friend/{label}"
  metadata: "coffea4bees/metadata/datasets/classifier_inputs_ttHbb_run3.json@@HCR_input"  # plot rules only (2022 index); training/evaluation friends below
  workflow_overrides:
    --JCM-weight:
      - 'year:2022_preEE coffea4bees/metadata/weights/JCM/Run3_ttHbb/jetCombinatoricModel_SB_run3_2022_preEE_fNjetR_v1.yml@@JCM_weights'
      - 'year:2022_EE coffea4bees/metadata/weights/JCM/Run3_ttHbb/jetCombinatoricModel_SB_run3_2022_EE_fNjetR_v1.yml@@JCM_weights'
      - 'year:2023_preBPix coffea4bees/metadata/weights/JCM/Run3_ttHbb/jetCombinatoricModel_SB_run3_2023_preBPix_pt25_fNjetR_v1.yml@@JCM_weights'
      - 'year:2023_BPix coffea4bees/metadata/weights/JCM/Run3_ttHbb/jetCombinatoricModel_SB_run3_2023_BPix_pt25_fNjetR_v1.yml@@JCM_weights'
      - 'year:2024 coffea4bees/metadata/weights/JCM/Run3_ttHbb/jetCombinatoricModel_SB_run3_2024_pt25_fNjetR_v1.yml@@JCM_weights'
    '--friends ""': 'coffea4bees/metadata/datasets/classifier_inputs_ttHbb_run3.json@@HCR_input coffea4bees/metadata/datasets/classifier_inputs_ttHbb_run3_2023_trigv1.json@@HCR_input coffea4bees/metadata/datasets/classifier_inputs_ttHbb_run3_2024_clean_v1.json@@HCR_input'
    'evaluate.yml::--friends ""': 'coffea4bees/metadata/datasets/classifier_inputs_ttHbb_run3.json@@HCR_input coffea4bees/metadata/datasets/classifier_inputs_ttHbb_run3_2023_trigv1.json@@HCR_input coffea4bees/metadata/datasets/classifier_inputs_ttHbb_run3_2024_clean_v1_fullcov.json@@HCR_input'
    # R1(b) (orchestrator jgaytanv-e7, 2026-10-13): evaluate's TARGET list comes from --metadata, not from the friend index, so the 31
    # partially covered 2024 picoAODs are removed from an evaluate-only metadata dir (else FriendTreeError -> hang, 10-13 run 12909404).
    'evaluate.yml::--metadata': 'coffea4bees/metadata/datasets_eval_run3_fullcov/'
  train_mem: 118000      # orchestrator (user-requested): whole single-GPU H100 NVL slot (TotalMemory 118000); S2 predicts 102.37M loaded -> ~104.2 GB (~0.97 GB/M + 4.8 GB)
  eval_mem: 192000       # jgaytanv-e7, user-ordered (GPU asap): 64 cpus x 3000; measured evaluate RSS peak 185.5 GB (12909404); limit not enforced
  train_runtime: 1440    # est. ~10-11 h (2022 1.5 h, 2024 6.25 h); flavour "tomorrow"
  eval_runtime: 1440
  retries: 1

# ==============================================================================
# PHASE F.1: MAIN ANALYSIS PROCESSOR (also the fallback block for Phase B.1)
# ==============================================================================
analysis_config:
  processor: "coffea4bees/analysis/processors/processor_ttHbb.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  friend_file: "coffea4bees/metadata/friends/friends_ttHbb_Run3.yml"
  weights_file: "coffea4bees/metadata/weights/weights_ttHbb.yml"
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 10000
    max_workers: 500
    dashboard_address: 0
    condor_transfer_input_files:
      - src/
      - coffea4bees/analysis/
      - coffea4bees/metadata/
  config:
    blind: true
    apply_JCM: true
    apply_FvT: true
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: false
    top_reconstruction: fast
    fill_histograms: true
    candidates_selection_cfg: "coffea4bees/analysis/metadata/candidates_selection_thresholds_ttHbb.yml"
    # Phase C FvT friend (kfold.Merge output of Snakefile_PhaseC_3_evaluate); runner.py merges this
    # over friend_file, so data gets trigWeight + FvT and MC keeps trigWeight only.
    friends:
      FvT: "root://eoscms.cern.ch//eos/cms/store/group/phys_higgs/ttHbb/mmarcheg/4b/Run3_v1/ttHbb_stitched/friend/FvT_ttHbb_run3/result.json@@analysis.0.merged"

# ==============================================================================
# PHASE C.4: FvT CLOSURE (Snakefile_PhaseC_4_FvT_closure.smk)
# ==============================================================================
# Reruns the processor (analysis_config above) on data with JCM x FvT applied; the ttbar
# histograms are reused from the Phase B.1 wJCM pass (FvT only applies to data).
fvt_closure:
  datasets:
    - "data"
    - "TTTo2L2Nu_stitched"
    - "TTToSemiLeptonic_stitched"
    - "TTToHadronic_stitched"
  JCM_file: "coffea4bees/metadata/weights/JCM/Run3_ttHbb/jetCombinatoricModel_SB_run3_2022_v1.yml"
  plot_config: "coffea4bees/plots/metadata/plots_FvT_closure_ttHbb_run3.yml"
  known_counts: "none"
  reuse_wJCM_ttbar: true
  jcm_output_path: "/eos/cms/store/group/phys_higgs/ttHbb/mmarcheg/4b/output/ttHbb_run3/computeJCM/"
