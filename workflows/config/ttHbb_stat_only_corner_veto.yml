# ==============================================================================
# ttHbb Run 2 NOMINAL STAT-ONLY ANALYSIS — Corner Veto (Self-Contained)
# ==============================================================================
# Runs full self-contained pipeline from Phase B (reusing Phase A picoAODs &
# trigger weights):
#   - Phase B: per-year JCM & classifier inputs with corner veto
#   - Phase C: FvT training & evaluation on detector data + stitched ttbar MC
#   - Phase C.4: FvT closure reprocessing ttbar MC with FvT friend
#   - Phase D: SvB (attention: false) & SvB_MA (attention: true) training and
#              evaluation on data, ttHbb signal, and stitched ttbar MC
#   - Phase F: full analysis + ttbar MC vs prediction comparisons + Combine
#              for both SvB and SvB_MA across all sub-categories
# ==============================================================================

base: coffea4bees/workflows/config/ttHbb.yml

label: "ttHbb_stat_only_corner_veto"
output_path: "output/ttHbb/"

dataset:
  - "ttHbb"
  - "data"
  - "TTTo2L2Nu_stitched"
  - "TTToSemiLeptonic_stitched"
  - "TTToHadronic_stitched"

ttbar_compare_plot_config: "coffea4bees/plots/metadata/plotsTTbar_MCvsFromD3_ttHbb.yml"
ttbar3b_compare_plot_config: "coffea4bees/plots/metadata/plotsTTbar3b_MCvsFromD3_ttHbb.yml"

candidates_selection_cfg: "coffea4bees/analysis/metadata/candidates_selection_thresholds_ttHbb_corner_veto.yml"
jcm_known_counts_fatal: false

# Phase B classifier inputs with corner veto
classifier_inputs:
  candidates_selection_cfg: "coffea4bees/analysis/metadata/candidates_selection_thresholds_ttHbb_corner_veto.yml"
  config:
    candidates_selection_cfg: "coffea4bees/analysis/metadata/candidates_selection_thresholds_ttHbb_corner_veto.yml"

# Phase C & D classifier settings
classifier_setting:
  - module: ml.DataLoader
    option:
      - optimize_sliceable_dataset: true
      - num_workers: 2
      - batch_eval: 65536
  - module: ROOT
    option:
      - friend_allow_missing: false
  - module: cms.MC_TTbar
    option:
      - datasets:
          - TTToSemiLeptonic_stitched
          - TTToHadronic_stitched
          - TTTo2L2Nu_stitched
  - module: cms.CollisionData
    option:
      - eras:
          UL16_postVFP: [F, G, H]
          UL16_preVFP: [C, D, E, F]
          UL17: [C, D, E, F]
          UL18: [A, B, C, D]
        years:
          - UL16_preVFP
          - UL16_postVFP
          - UL17
          - UL18
  - module: HCR.InputBranch
    option:
      - feature_ancillary: [xW, nSelJets, xbW, year]

# Phase C: FvT training & evaluation (on both detector data and stitched ttbar MC)
fvt:
  gpu_qos: medium
  gpu_mem: 24000
  eos_base: "{eos_prod}/{roast_id}"
  plot_base: "{web_prod}/{roast_id}/classifier"
  classifier_config_paths: "coffea4bees"
  label: "FvT_ttHbb_stitched"
  output_dir: "output/FvT_ttHbb_stitched/"
  plot_inputs: true
  plot_weights: true
  evaluate: true
  model: "{eos_base}/classifier/{label}"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: {eos_base}/classifier/{label}"
  eval_template: "model: {eos_base}/classifier/{label}, FvT: {eos_base}/friend/{label}"
  metadata: "{eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input"
  train_workflow:
    main:
      module: train
      option:
        - --max-loaders 2
        - --max-trainers 3
        - --device cuda cpu
    dataset:
      - module: HCR.FvT.TrainBaseline
        option:
          - --metadata coffea4bees/metadata/datasets/
          - --max-workers 20
          - --data-source detector
          - --JCM-weight year:UL16_preVFP {eos_prod}/{roast_id}/handoff/jetCombinatoricModel_SB_2024_v2_UL16_preVFP.yml@@JCM_weights
          - --JCM-weight year:UL16_postVFP {eos_prod}/{roast_id}/handoff/jetCombinatoricModel_SB_2024_v2_UL16_postVFP.yml@@JCM_weights
          - --JCM-weight year:UL17 {eos_prod}/{roast_id}/handoff/jetCombinatoricModel_SB_2024_v2_UL17.yml@@JCM_weights
          - --JCM-weight year:UL18 {eos_prod}/{roast_id}/handoff/jetCombinatoricModel_SB_2024_v2_UL18.yml@@JCM_weights
          - --friends "" {eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input
    model:
      - module: HCR.FvT.baseline.Train
        option:
          - --kfolds 3
          - --kfold-seed FvT random
          - --kfold-seed-offsets 0
          - --training FixedStep
          - bs_init: 1024
            epoch: 20
          - --finetuning FinetuneStep
          - bs_init: 16384
            epoch: 1
    setting:
      - module: IO
        option:
          - output: "{model}"
  eval_workflow:
    main:
      module: evaluate
      option:
        - --max-evaluators 3
        - --device cuda cpu
    dataset:
      - module: HCR.FvT.EvalBackground
        option:
          - --metadata coffea4bees/metadata/datasets/
          - --max-workers 8
          - --data-source detector
          - --mc-processes ttbar
          - --friends "" {eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input
    model:
      - module: HCR.FvT.baseline.Eval
        option:
          - --models
          - Final
          - "{model}/result.json"
    analysis:
      - module: kfold.Merge
        option:
          - --name FvT
          - --step 100000
          - --workers 4
          - --clean
    setting:
      - module: IO
        option:
          - output: "{FvT}"
      - module: ml.DataLoader
        option:
          - num_workers: 8

# Phase C.4: FvT closure reprocessing ttbar MC so FvTHists are filled on MC
fvt_closure:
  datasets: [data, TTToHadronic_stitched, TTToSemiLeptonic_stitched, TTTo2L2Nu_stitched]
  reuse_wJCM_ttbar: false
  plot_config: "coffea4bees/plots/metadata/plotsAll_ttHbb.yml"
  ttbar_compare_plot_config: "coffea4bees/plots/metadata/plotsTTbar_MCvsFromD3_ttHbb.yml"
  ttbar3b_compare_plot_config: "coffea4bees/plots/metadata/plotsTTbar3b_MCvsFromD3_ttHbb.yml"
  known_counts: "coffea4bees/analysis/tests/known_fullCounts_FvT_closure_ttHbb.yml"
  known_counts_fatal: false

# Phase D: SvB (attention: false) & SvB_MA (attention: true), evaluated on data, ttHbb, and ttbar
svb:
  eval_workflow:
    dataset:
      - module: HCR.ttHbb.Eval
        option:
          - --metadata coffea4bees/metadata/datasets/
          - --data-source detector
          - --mc-processes ttHbb ttbar
          - --max-workers 8
          - --friends "" {eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input

svb_ma:
  eval_workflow:
    dataset:
      - module: HCR.ttHbb.Eval
        option:
          - --metadata coffea4bees/metadata/datasets/
          - --data-source detector
          - --mc-processes ttHbb ttbar
          - --max-workers 8
          - --friends "" {eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input

# Phase F: Analysis config
analysis_config:
  config:
    apply_JCM: true
    fill_histograms: "kinematics+FvT+SvB"
    JCM_file:
      UL16_preVFP: "coffea4bees/metadata/weights/JCM/{roast_id}/jetCombinatoricModel_SB_2024_v2_UL16_preVFP.yml"
      UL16_postVFP: "coffea4bees/metadata/weights/JCM/{roast_id}/jetCombinatoricModel_SB_2024_v2_UL16_postVFP.yml"
      UL17: "coffea4bees/metadata/weights/JCM/{roast_id}/jetCombinatoricModel_SB_2024_v2_UL17.yml"
      UL18: "coffea4bees/metadata/weights/JCM/{roast_id}/jetCombinatoricModel_SB_2024_v2_UL18.yml"
    friends:
      FvT: "{eos_prod}/{roast_id}/friend/FvT_ttHbb_stitched/result.json@@analysis.0.merged"
      SvB: "{eos_prod}/{roast_id}/friend/SvB_ttHbb_stitched/result.json@@analysis.0.merged"
      SvB_MA: "{eos_prod}/{roast_id}/friend/SvB_MA_ttHbb_stitched/result.json@@analysis.0.merged"
    svb_binning_file: "{eos_prod}/{roast_id}/handoff/svb_quantiles.json"
    candidates_selection_cfg: "coffea4bees/analysis/metadata/candidates_selection_thresholds_ttHbb_corner_veto.yml"

# Phase F: Sub-categorized channels
channels:
  ttHbb:
    signal: ttHbb
    signallabel: ttHbb
    variable: SvB_MA.ps_ttHbb
    othersignal: ""
    region: SR
    cut: sum
    closure_subdir: ttHbb
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
  ttHbb_stat_only:
    signal: ttHbb
    signallabel: ttHbb
    variable: SvB_MA.ps_ttHbb
    othersignal: ""
