# ==============================================================================
# 2025 MvD on the 16x DECLUSTERED model: finetune-fix redo, WARM START from the original MvD
# ==============================================================================
# On top of mvd_declib16_run3_2025_20261028_c96a8ce-a4b6e04 (mvd_run3_2025_declib16.yml). V.1 is not re-run: the classifier-input manifest,
# classifier metadata and tight JCM are read from that roast's handoff. V.2: HH4b_Run3/MvD_warm loads
# its saved fold models (same k-fold split) and reruns the schedule's 5-epoch decay tail plus the
# fixed finetune (FinetuneStep, lr 1e-4; see mvd_run3_warm.yml). Then V.2c, V.3 (SvB_MvD, retrained),
# V.4. Layered on mvd_run3_2025_ftfix.yml (the mixed redo: same nominal upstream, era-split
# evaluations by era group, which here cover the detector data and the declustered sample of those
# eras -- its manifest has the data's era keys) rather than on mvd_run3_2025_declib16.yml, whose
# detector/declustered eval splits would merge in (dicts merge) and need 186 GB evaluation pods
# (NRP evaluation pods are capped at 64 Gi). The declustered-model settings of
# mvd_run3_2025_declib16.yml are restated below.
#
#   roast new --config coffea4bees/workflows/config/mvd_run3_2025_declib16_warm.yml \
#       --step nautilus:coffea4bees/workflows/Snakefile_MvD_2_train.smk \
#       --step cmslpc:coffea4bees/workflows/Snakefile_MvD.smk \
#       --step nautilus:coffea4bees/workflows/Snakefile_MvD_3_svb.smk
# ==============================================================================
base: coffea4bees/workflows/config/mvd_run3_2025_ftfix.yml

label: "mvd_run3_2025_declib16_warm"

inputs:
  # lists replace: nominal + the 16x declustered sample + the MvD roast whose V.1 and models are reused
  upstream_roasts: [nominal_run3_2025_20261027_1809191-df306da, declib16_run3_2025_20261028_69809f5-6e827c1, mvd_declib16_run3_2025_20261028_c96a8ce-a4b6e04]
  mixeddata_all: "{roast:declib16_run3_2025_20261028_69809f5-6e827c1}/handoff/mixeddata_all_declib16_2025.yml"
  mixed_jcm: "{roast:mvd_declib16_run3_2025_20261028_c96a8ce-a4b6e04}/handoff/jetCombinatoricModel_SB_mixeddata_tight.yml"

# --- the declustered model (as mvd_run3_2025_declib16.yml) ---
mixed_dataset_name: mixeddata_all_declib16_2025

mixed_jcm:
  threeTightTagFraction: 0.03

make_combine_inputs:
  multijet_process: mixeddata_all_declib16_2025

mvd:
  wfs_base: "coffea4bees/classifier/config/workflows/HH4b_Run3/MvD_warm"
  metadata: "{roast:mvd_declib16_run3_2025_20261028_c96a8ce-a4b6e04}/handoff/classifier_inputs_MvD.json@@HCR_input"
  train_mem: 180000
  workflow_overrides:
    --metadata: "{roast:mvd_declib16_run3_2025_20261028_c96a8ce-a4b6e04}/handoff/classifier_metadata"
    --JCM-weight: '"source:mixed_all" {roast:mvd_declib16_run3_2025_20261028_c96a8ce-a4b6e04}/handoff/jetCombinatoricModel_SB_mixeddata_tight.yml@@JCM_weights'
    '--friends ""': "{roast:mvd_declib16_run3_2025_20261028_c96a8ce-a4b6e04}/handoff/classifier_inputs_MvD.json@@HCR_input"
  workflow_inserts:
    --data-source: ["--data-mixed-all-name mixeddata_all_declib16_2025"]
    --training: ["--pretrained-weights {roast:mvd_declib16_run3_2025_20261028_c96a8ce-a4b6e04}/classifier/MvD"]

svb_mvd:
  metadata: "{roast:mvd_declib16_run3_2025_20261028_c96a8ce-a4b6e04}/handoff/classifier_inputs_MvD.json@@HCR_input"
  train_mem: 180000
  workflow_overrides:
    --metadata: "{roast:mvd_declib16_run3_2025_20261028_c96a8ce-a4b6e04}/handoff/classifier_metadata"
    --JCM-weight: '"source:mixed_all" {roast:mvd_declib16_run3_2025_20261028_c96a8ce-a4b6e04}/handoff/jetCombinatoricModel_SB_mixeddata_tight.yml@@JCM_weights'
    '--friends ""': "{roast:mvd_declib16_run3_2025_20261028_c96a8ce-a4b6e04}/handoff/classifier_inputs_MvD.json@@HCR_input"
  workflow_inserts:
    --data-source: ["--data-mixed-all-name mixeddata_all_declib16_2025"]
    'evaluate.yml::--mc-processes': ["--data-source detector mixed_all", "--data-mixed-all-name mixeddata_all_declib16_2025"]

# nothing blessed for the declustered model (as mvd_run3_2025_declib16.yml)
closure:
  known_counts: null

analysis:
  known_counts: null
