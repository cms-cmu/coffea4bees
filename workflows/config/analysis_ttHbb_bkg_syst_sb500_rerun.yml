# ==============================================================================
# ttHbb Run 2 BACKGROUND SYSTEMATIC — DeClustered 16x with sb500 RERUN
# ==============================================================================
# Reuses Stages A and B (subsamples, classifier inputs, JCM fits) from the
# reference roast: analysis_ttHbb_bkg_syst_sb500_20261011_6724c7f-5ba6029
#
# Genuine retraining of all 16 FvT models from epoch 0 on Nautilus GPUs (Stage C)
# and evaluation through Stage F on cmslpc with --ignore_failures OFF.
# ==============================================================================

base: coffea4bees/workflows/config/analysis_ttHbb_bkg_syst_declib16nc.yml

label: "analysis_ttHbb_bkg_syst_sb500_rerun"
mix_name: "ttHbb_bkg_syst_sb500_rerun"
output_path: "output/{roast_id}/"

# Reuses Stages A and B from the Oct 11 sb500 reference roast (103,480 events in SB)
upstream_pre_fvt: "analysis_ttHbb_bkg_syst_sb500_20261011_6724c7f-5ba6029"

publish_base: "{eos_prod}/{roast_id}"
handoff:
  eos_base: "{eos_prod}/{roast_id}/handoff"

train_mem: 32000
eval_mem: 24000

# Stage F_2: Two-stage closure constraints
match_closure_normalization: true
include_ensemble_variance: true
basis_type: fourier
max_basis: 4
no_sqrt_n_priors: true
unify_background: true
rebin: 12
f3_rebins:
  - 20
  - 24
closure_rebin_candidates:
  - 12
  - 15
  - 16
  - 20
  - 24

phase_e_fvt:
  channel: "ttHbb"
  mix_name: "ttHbb_bkg_syst_sb500_rerun"
  n_models: 16
  precision: ""

fvt_train_workflow:
  main:
    module: train
    option:
      - --max-loaders 2
      - --max-trainers 3
      - --device cuda cpu
  model:
    - module: HCR.FvT.baseline.Train
      option:
        - --kfolds 3
        - --kfold-seed FvT random
        - --kfold-seed-offsets 0
        - --training FixedStep
        - epoch: 20
          bs_init: 2048
        - --finetuning FixedStep
        - epoch: 1
          bs_init: 16384
