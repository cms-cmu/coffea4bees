# ttHbb Run 2 background systematic with the DeClustered library (declib16nc), can_ttH pairing,
# 230 GeV asymmetric-ellipse SB (m_lead<=230, nJet==4 inside the ellipse), no corner veto.
# Uses CosineAnnealing training schedule + FinetuneStep finetuning.
# Reuses pre-FvT handoff (Stages A & B) from Sindhu's roast ttHbb_20261107_bkg_syst_declib16nc_asymEllipse_SB230_3a7d3eb-d3dd276.

base: coffea4bees/workflows/config/ttHbb_bkg_syst_declib16nc.yml
label: "ttHbb_bkg_syst_declib16nc_asymEllipse_SB230_cosine"

upstream_pre_fvt: "pre_fvt"

stat_analysis_rebins:
  - 24
f3_rebins:
  - 24
f4_rebins:
  - 24
closure_extra_args: "--ignore_failures"

fvt_closure:
  known_counts_fatal: false

inputs:
  upstream_roasts:
    declib: declib16nc_run2_20261003_3ab8302-b2d2dec
    nominal: ttHbb_20261106_asymEllipse_SB230_4c068ae-d3dd276
    mixeddata: mixeddata_run2_20260927_c39c264-0ce4d59
    pre_fvt: ttHbb_20261107_bkg_syst_declib16nc_asymEllipse_SB230_3a7d3eb-d3dd276
  mixeddata_all: '{roast:declib}/handoff/synthetic_data_lib16nc_multijet.yml'
  ttbar_psdata: '{roast:mixeddata}/handoff/ttbar_PSData.yml'
  jcm_hists: '{roast:nominal}/{roast:nominal:output_path}PhaseB_1_computeJCM/histAll_NoJCM.coffea'
  nominal_hists: '{roast:nominal}/{roast:nominal:output_path}PhaseF_1_analysis/histAll_ttHbb.coffea'
  classifier_inputs: '{roast:nominal}/handoff/classifier_inputs_{roast:nominal:id}.json'
  SvB: '{roast:nominal}/friend/SvB_ttHbb_stitched/result.json@@analysis.0.merged'
  SvB_model: '{roast:nominal}/classifier/SvB_ttHbb_stitched/result.json'
  SvB_MA: '{roast:nominal}/friend/SvB_ttHbb_stitched/result.json@@analysis.0.merged'
  SvB_MA_model: '{roast:nominal}/classifier/SvB_ttHbb_stitched/result.json'
  input_handoff_eos: '{roast:pre_fvt}/handoff'

# Only SvB_MA: scoring the same model again as SvB would duplicate the evaluation and histograms.
classifiers:
  - "SvB_MA"
classifier_variables:
  SvB_MA: "SvB_MA_ps_ttHbb"

fvt_train_workflow:
  main:
    module: train
    option:
      - --max-loaders 2
      - --max-trainers 3
      - --device cuda cpu
  dataset:
    - module: HCR.FvT.TrainBaseline
      option:
        - --metadata {metadata}
        - --max-workers 20
        - --data-source detector mixed
        - --no-detector-4b
        - --data-mixed-name {mixed_name}
        - --data-mixed-samples {mix}
        - --JCM-weight year:UL16_preVFP {jcm_UL16_preVFP}@@JCM_weights
        - --JCM-weight year:UL16_postVFP {jcm_UL16_postVFP}@@JCM_weights
        - --JCM-weight year:UL17 {jcm_UL17}@@JCM_weights
        - --JCM-weight year:UL18 {jcm_UL18}@@JCM_weights
        - --friends "" {nominal_ci}@@HCR_input {mixed_ci}@@HCR_input
  model:
    - module: HCR.FvT.baseline.Train
      option:
        - --kfolds 3
        - --kfold-seed FvT random
        - --kfold-seed-offsets 0
        - --training CosineAnnealing
        - epoch: 20
          bs_init: 1024
        - --finetuning FinetuneStep
        - epoch: 1
          bs_init: 16384
  setting:
    - module: IO
      option:
        - output: '{model}'

analysis_config:
  config:
    pairing: can_ttH


