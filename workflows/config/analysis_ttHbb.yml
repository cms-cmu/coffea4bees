label: "ttHbb"
output_path: "output/ttHbb/"
analysis_config:
  processor: "coffea4bees/analysis/processors/processor_ttHbb.py"
  dataset_location: "coffea4bees/metadata/datasets/archive/Run2_2024_v2/"
  friend_file: "coffea4bees/metadata/datasets/archive/Run2_2024_v2/friends_ttHbb.yml"
  weights_file: "coffea4bees/metadata/weights/weights_HH4b_2024_v2.yml"
  runner:
    workers: 4
    worker_memory: 8GB
    chunksize: 10000
    condor: true
    shared_dask: true
    run_performance: true
  config:
    blind: false  #### until we properly defined SR
    apply_FvT: true
    apply_JCM: true
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: true
    SvB_MA: true
    SvB: null
    hist_cuts: ["pass_nSelJets_gt6", "fail_nSelJets_le6"]
    top_reconstruction: fast
    plot_ttbar_with_weights: true

plot_config: "coffea4bees/plots/metadata/plotsAll_ttHbb.yml"
known_counts_test: "coffea4bees/analysis/tests/known_Counts_ttHbb.yml"
known_counts_full: "coffea4bees/analysis/tests/known_fullCounts_ttHbb.yml"
cern_user: "algomez"
cern_path: "www/HH4b/Plots/"
dataset:
  - "ttHbb"
  - "data"
year_eras:
  UL18:
    - "A"
    - "B"
    - "C"
    - "D"

skimmer:
  processor: "coffea4bees/skimmer/processor/skimmer_4b.py"
  dataset_location: "coffea4bees/metadata/datasets/archive/Run2_2024_v2/"
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 10000
    picosize: 10000
    basketsize: 10000
    condor: true
    shared_dask: true
    run_performance: true
    allowlist_sites:
      - T3_US_FNALLPC
      - T2_US_Nebraska
    #   - T3_US_NotreDame
    #   - T2_US_Caltech
    #   - T1_US_FNAL_Disk
    #   - T2_US_MIT
      - T2_US_Purdue
      - T3_US_Baylor
      - T2_US_Wisconsin
    # blocklist_sites:
    #   - T2_US_MIT
    #   - T2_US_Purdue

  config:
    base_path: root://cmseos.fnal.gov//store/user/mmarcheg/ttHbb/2024_v2/
    step: 100000
    loosePtForSkim: true

trigger_weights:
  processor: "coffea4bees/analysis/processors/processor_trigger_weights.py"
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 10000
    condor: true
    shared_dask: true
    run_performance: true
    # Without this the default is ['coffea4bees/', 'src/'] = ~490MB, which is
    # gzipped once per cluster and then transferred to every condor worker.
    # The trigger-weights processor only reaches into coffea4bees.analysis and
    # src, so list just what is needed (~160MB).
    condor_transfer_input_files:
      - src/
      - coffea4bees/analysis/
      - coffea4bees/metadata/
  config:
    use_vectorized: false
    tagger: DeepJet
    make_classifier_input: root://cmseos.fnal.gov//store/user/mmarcheg/ttHbb/2024_v2/stitched/
    # make_classifier_input: root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/
    # make_classifier_input: output/trigger_weights/   ### local

convert_hist_to_json:
  histos: 
    - "SvB_MA.ps_ttHbb"
    - "SvB_MA.ps"
combine_outdir: "datacards/"
make_combine_inputs:
  stat_only: ""
  bkgsyst: "coffea4bees/stats_analysis/files/HIG-24-010/hh/hists_closure_3bDvTMix4bDvT_SvB_MA_ps_hh_rebin1.pkl"
channels:
  ttHbb:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "hh"
    region: "sum"
    cut: "sum"
  ttHbb_pass:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "hh"
    region: "sum"
    cut: "pass_nSelJets_gt6"

combine_flags: "--three_tag threeTag --four_tag fourTag --region sum --blind"
likelihood_scan_points: 40
likelihood_scan_r_min: -1
likelihood_scan_r_max: 1
likelihood_scan_y_cut: 100
likelihood_scan_y_max: 100