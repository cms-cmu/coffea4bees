# ==============================================================================
# GLOBAL WORKFLOW CONFIGURATION
# ==============================================================================
label: "ttHbb"
output_path: "output/ttHbb/"
cern_user: "algomez"
cern_path: "www/ttHbb/Plots/"

processor: "coffea4bees/analysis/processors/processor_ttHbb.py"
friend_file: "coffea4bees/metadata/friends/friends_ttHbb.yml"
weights_file: "coffea4bees/metadata/weights/weights_ttHbb.yml"
dataset_location: "coffea4bees/metadata/datasets/"
candidates_selection_cfg: "coffea4bees/analysis/metadata/candidates_selection_thresholds_ttHbb.yml"

dataset:
  - "ttHbb"
  - "data"

year_eras:
  UL16_preVFP:
    - "C"
    - "D"
    - "E"
    - "F"
  UL16_postVFP:
    - "F"
    - "G"
    - "H"
  UL17:
    - "C"
    - "D"
    - "E"
    - "F"
  UL18:
    - "A"
    - "B"
    - "C"
    - "D"

# ==============================================================================
# PHASE A: SKIMMING & TRIGGER WEIGHTS
# ==============================================================================
skimmer:
  processor: "coffea4bees/skimmer/processor/skimmer_4b.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 10000
    picosize: 100000
    basketsize: 10000
    condor: true
    shared_dask: true
    run_performance: true
    allowlist_sites:
      - T3_US_FNALLPC
      - T2_US_Nebraska
    #   - T3_US_NotreDame
    #   - T2_US_Caltech
    #   - T1_US_FNAL_Disk
    #   - T2_US_MIT
      - T2_US_Purdue
      - T3_US_Baylor
      - T2_US_Wisconsin
    # blocklist_sites:
    #   - T2_US_MIT
    #   - T2_US_Purdue

  config:
    base_path: root://cmseos.fnal.gov//store/user/mmarcheg/ttHbb/2024_v2/
    step: 100000
    loosePtForSkim: true

trigger_weights:
  processor: "coffea4bees/analysis/processors/processor_trigger_weights.py"
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 10000
    condor: true
    shared_dask: true
    run_performance: true
    # Without this the default is ['coffea4bees/', 'src/'] = ~490MB, which is
    # gzipped once per cluster and then transferred to every condor worker.
    # The trigger-weights processor only reaches into coffea4bees.analysis and
    # src, so list just what is needed (~160MB).
    condor_transfer_input_files:
      - src/
      - coffea4bees/analysis/
      - coffea4bees/metadata/
  config:
    use_vectorized: false
    tagger: DeepJet
    make_classifier_input: root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/

# ==============================================================================
# PHASE B: CALIBRATION & CLASSIFIER INPUTS (JCM & Friendtrees)
# ==============================================================================
jcm_plot_config: "coffea4bees/plots/metadata/plots_JCM_ttHbb.yml"
jcm_datasets:
  - "data"
  - "TTTo2L2Nu"
  - "TTToSemiLeptonic"
  - "TTToHadronic"

jcm_extra_arguments: "--jcm_config coffea4bees/analysis/jcm_tools/metadata/ttHbb_jcm_config.yml"

classifier_inputs:
  processor: "coffea4bees/analysis/processors/processor_ttHbb.py"
  friend_file: "coffea4bees/metadata/friends/friends_ttHbb.yml"
  weights_file: "coffea4bees/metadata/weights/weights_ttHbb.yml"
  candidates_selection_cfg: "coffea4bees/analysis/metadata/candidates_selection_thresholds_ttHbb.yml"
  datasets:
    - "ttHbb"
    - "data"
    - "TTTo2L2Nu"
    - "TTToSemiLeptonic"
    - "TTToHadronic"
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 10000
    condor: true
    shared_dask: true
    run_performance: true
  config:
    blind: true
    apply_JCM: true
    apply_FvT: false
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: false
    top_reconstruction: slow
    fill_histograms: true
    candidates_selection_cfg: "coffea4bees/analysis/metadata/candidates_selection_thresholds_ttHbb.yml"
    make_classifier_input: root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/ttHbb/

# ==============================================================================
# PHASE C & D: CLASSIFIER SETTINGS (Entirely on falcon / PSC)
# ==============================================================================
classifier_setting:
  - module: ml.DataLoader
    option:
      - optimize_sliceable_dataset: true
  - module: ROOT
    option:
      - friend_allow_missing: false
  - module: cms.CollisionData
    option:
      - eras:
          UL16_preVFP: [C, D, E, F]
          UL16_postVFP: [F, G, H]
          UL17: [B, C, D, E, F]
          UL18: [A, B, C, D]
  - module: HCR.InputBranch
    option:
      - feature_ancillary: [xW, nSelJets, xbW, year]

fvt:
  eos_base: "root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/ttHbb"
  plot_base: "root://eosuser.cern.ch//eos/user/a/algomez/www/HH4b/Plots"
  classifier_config_paths: "coffea4bees"
  wfs_base: "coffea4bees/classifier/config/workflows/ttHbb_2024_v2/FvT"
  label: "FvT_ttHbb"
  output_dir: "output/FvT_ttHbb/"
  plot_inputs: true
  model: "{eos_base}/classifier/{label}"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: {eos_base}/classifier/{label}"
  eval_template: "model: {eos_base}/classifier/{label}, FvT: {eos_base}/friend/{label}"
  metadata: "coffea4bees/metadata/datasets/classifier_inputs_ttHbb.json@@HCR_input"

svb:
  eos_base: "root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/ttHbb"
  plot_base: "root://eosuser.cern.ch//eos/user/a/algomez/www/HH4b/Plots"
  classifier_config_paths: "coffea4bees"
  wfs_base: "coffea4bees/classifier/config/workflows/ttHbb_2024_v2/SvB"
  label: "SvB_ttHbb"
  output_dir: "output/SvB_ttHbb/"
  plot_inputs: true
  evaluate: true
  model: "{eos_base}/classifier/{label}"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: {eos_base}/classifier/{label}, FvT: {eos_base}/friend/FvT_ttHbb"
  eval_template: "model: {eos_base}/classifier/{label}, SvB: {eos_base}/friend/{label}"
  metadata: "coffea4bees/metadata/datasets/classifier_inputs_ttHbb.json@@HCR_input"

# ==============================================================================
# PHASE F.1: MAIN ANALYSIS PROCESSOR, CUTFLOWS & PLOTTING
# ==============================================================================
analysis_config:
  processor: "coffea4bees/analysis/processors/processor_ttHbb.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  friend_file: "coffea4bees/metadata/friends/friends_ttHbb.yml"
  weights_file: "coffea4bees/metadata/weights/weights_ttHbb.yml"
  runner:
    workers: 4
    worker_memory: 8GB
    chunksize: 10000
    dashboard_address: 0
  config:
    blind: true
    apply_FvT: true
    apply_JCM: true
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: true
    SvB_MA: true
    SvB: null
    hist_cuts: ["pass_nSelJets_gt6"]
    top_reconstruction: fast
    plot_ttbar_with_weights: true

plot_config: "coffea4bees/plots/metadata/plotsAll_ttHbb.yml"
known_counts: "coffea4bees/analysis/tests/known_Counts_ttHbb.yml"
known_counts_test: "coffea4bees/analysis/tests/known_Counts_ttHbb.yml"
known_counts_full: "none"

# ==============================================================================
# PHASE F.2: COMBINE STATISTICAL INTERPRETATION & LIMITS
# ==============================================================================
convert_hist_to_json:
  histos: 
    - "SvB_MA.ps_ttHbb"
    - "SvB_MA.ps"

combine_outdir: "datacards/"
make_combine_inputs:
  stat_only: ""
  bkgsyst: "output/ttHbb/closure_studies/closure_fits/3bDvTMix4bDvT/SvB_MA/rebin1/SR/ttHbb/hists_closure_3bDvTMix4bDvT_SvB_MA_ps_ttHbb_fine_rebin1.pkl"

combine_flags: "--three_tag threeTag --four_tag fourTag --region sum --blind"
likelihood_scan_points: 40
likelihood_scan_r_min: 0
likelihood_scan_r_max: 2
likelihood_scan_y_cut: 30
likelihood_scan_y_max: 30

channels:
  ttHbb:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "ttHbb"
    region: "SR"
    cut: "sum"
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
  ttHbb_stat_only:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "ttHbb"
    region: "SR"
    cut: "sum"
    stat_only: true
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
  ttHbb_nSelJets_gt6:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "ttHbb"
    region: "SR"
    cut: "pass_nSelJets_gt6"
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
  ttHbb_nSelJets_gt6_stat_only:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "ttHbb"
    region: "SR"
    cut: "pass_nSelJets_gt6"
    stat_only: true
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
  ttHbb_sum_inclusive:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "ttHbb"
    region: "sum"
    cut: "sum"
    combine_flags: "--three_tag threeTag --four_tag fourTag --region sum --blind"
  ttHbb_sum_inclusive_stat_only:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "ttHbb"
    region: "sum"
    cut: "sum"
    stat_only: true
    combine_flags: "--three_tag threeTag --four_tag fourTag --region sum --blind"

# ==============================================================================
# PHASE E: BACKGROUND SYSTEMATICS & TWO-STAGE CLOSURE (Mixed Data / Synthetic Data)
# ==============================================================================
phase_e:
  data_type: "mixeddata_4b" # "mixeddata_4b" or "synthetic_data"
  label: "ttHbb_mixeddata"
  output_path: "output/ttHbb/closure_studies/"
  datasets_file: "coffea4bees/metadata/datasets/mixeddata_4b.yml"
  
  # Phase E_1: Only runs processor on pseudo-data
  phase_e_dataset:
    - "mixeddata_4b"
  years: "UL16_preVFP UL16_postVFP UL17 UL18"
  n_samples: 15
  
  # Singlefiles from Phase F to include in merging
  phase_f_output_path: "output/ttHbb/"
  phase_f_label: "ttHbb"
  include_real_data_from_phase_f: true
  
  # E_1: Analysis processor with SvB
  processor: "coffea4bees/analysis/processors/processor_ttHbb.py"
  metadata: "coffea4bees/analysis/metadata/candidates_selection_thresholds_ttHbb.yml"
  additional_parameters: "--shared-dask --condor --run-performance"
  
  # E_2: Plotting
  plot_script: "coffea4bees/plots/makePlots.py"
  comparison_plot_config: "coffea4bees/plots/metadata/plots_mixeddata_vs_data.yml"
  comparison_extra_args: "-s xW --year RunII"
  analysis_plot_config: "coffea4bees/plots/metadata/plotsAll_mixeddata.yml"
  analysis_extra_args: "-s xW --year RunII"
  
  # E_3: Two-Stage Closure
  mix_name: "3bDvTMix4bDvT" # "3bDvTMix4bDvT" for mixeddata, "syn" for synthetic
  nMixes: 15 # 15 for mixeddata, 1 for synthetic
  classifier: "SvB_MA"
  variable: "SvB_MA_ps_ttHbb_fine"
  channel: "ttHbb"
  rebin: "1"
  years_closure: "2016 2017 2018" # e.g. "2016 2017 2018" or "2017 2018"
  closure_extra_args: ""
  scale_mixed: 0.7
  input_file_data3b: "output/ttHbb/closure_studies/root_inputs/histAll_ttHbb_mixeddata.root"
  input_file_TT: "output/ttHbb/closure_studies/root_inputs/histAll_ttHbb_mixeddata.root"
  input_file_sig: "output/ttHbb/closure_studies/root_inputs/histAll_ttHbb_mixeddata.root"
