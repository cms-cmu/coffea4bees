# =============================================================================
# b-tagging SF calibration, Run 2 (Snakefile_btagSF_calibration.smk)
# =============================================================================
# Per-sample (Njet, HT) maps that remove the normalization effect of the b-tag shape SF.
# Derived on MC NanoAOD at >= 4 selected jets, before any b-tag requirement.
#
# ttbar samples are also filled as <sample>_ttB and <sample>_notB: the stitched ttbar samples take
# their ttB events from TTbb_* and the others from the inclusive TTTo*, so the analysis uses
#   btagSF_calibration_sample_map:
#     TTToHadronic_stitched:     {ttB: TTbb_Hadronic_ttB,     notB: TTToHadronic_notB}
#     TTToSemiLeptonic_stitched: {ttB: TTbb_SemiLeptonic_ttB, notB: TTToSemiLeptonic_notB}
#     TTTo2L2Nu_stitched:        {ttB: TTbb_2L2Nu_ttB,        notB: TTTo2L2Nu_notB}
#
# Run 3: 2022/2023 need NanoAOD entries for ttHbb in metadata/datasets/ttHbb.yml first;
# 2024/2025 have no b-tag shape SF, so there is nothing to calibrate.
# =============================================================================

label: "btagSF_calibration_run2"
output_path: "output/btagSF_calibration_run2/"

btagsf_calibration:
  processor: "coffea4bees/analysis/processors/processor_btagSF_calibration.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  tag: "run2_v1"
  datasets:
    - "TTToHadronic"
    - "TTToSemiLeptonic"
    - "TTTo2L2Nu"
    - "TTbb_Hadronic"
    - "TTbb_SemiLeptonic"
    - "TTbb_2L2Nu"
    - "ttHbb"
  years:
    - "UL16_preVFP"
    - "UL16_postVFP"
    - "UL17"
    - "UL18"
  runner:
    data_tier: nanoAOD
    workers: 4
    worker_memory: 4GB
    chunksize: 100000
    min_workers: 50
    max_workers: 250
    dashboard_address: 0
  config:
    object_selection_cfg: coffea4bees/analysis/metadata/object_selection_thresholds.yml
    njet_bins: [4, 5, 6, 7, 8, 9, 11, 20]
    ht_bins: [0, 500, 650, 800, 1000, 1200, 1400, 1600, 1800, 2000, 5000]
    ttbar_categories: [ttB, notB]
