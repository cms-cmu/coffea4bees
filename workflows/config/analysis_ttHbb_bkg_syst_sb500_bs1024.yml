# ==============================================================================
# ttHbb Run 2 BACKGROUND SYSTEMATIC — DeClustered 16x with sb500 and bs_init 1024
# ==============================================================================
# Reuses Stages A and B (subsamples, classifier inputs, JCM fits) from the
# existing sb500 roast: analysis_ttHbb_bkg_syst_sb500_20261011_6724c7f-5ba6029
#
# Only Stages C (FvT training with bs_init: 1024) and F (two-stage closure + Combine)
# need to be run!
# ==============================================================================

base: coffea4bees/workflows/config/analysis_ttHbb_bkg_syst_declib16nc.yml

label: "analysis_ttHbb_bkg_syst_sb500_bs1024"
mix_name: "ttHbb_bkg_syst_sb500_bs1024"
output_path: "output/{roast_id}/"

# Reuses Stages A and B from the Oct 11 sb500 reference roast (103,480 events in SB)
upstream_pre_fvt: "analysis_ttHbb_bkg_syst_sb500_20261011_6724c7f-5ba6029"

publish_base: "{eos_prod}/{roast_id}"
handoff:
  eos_base: "{eos_prod}/{roast_id}/handoff"

train_mem: 32000
eval_mem: 24000

# Stage F_2: Two-stage closure constraints
max_basis: 5
no_sqrt_n_priors: false

phase_e_fvt:
  channel: "ttHbb"
  mix_name: "ttHbb_bkg_syst_sb500_bs1024"
  n_models: 16

fvt_train_workflow:
  main:
    module: train
    option:
      - --max-loaders 2
      - --max-trainers 1
      - --device cuda cpu
  model:
    - module: HCR.FvT.baseline.Train
      option:
        - --kfolds 3
        - --kfold-seed FvT random
        - --kfold-seed-offsets 0
        - --training FixedStep
        - epoch: 20
          bs_init: 1024
        - --finetuning FixedStep
        - epoch: 1
          bs_init: 16384
