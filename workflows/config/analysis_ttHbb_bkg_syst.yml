label: "ttHbb_bkg_syst"
output_path: "output/ttHbb_bkg_syst/"
fourTag_use_tight: false
# EOS area this workflow writes to (the A_2 subsample picoAODs: <publish_base>/picoAOD/subsamples/v<k>/)
publish_base: "root://cmseos.fnal.gov//store/user/algomez/XX4b/mixeddata/Run2_v2/ttHbb_pz_rank0_0"
cern_user: "algomez"
cern_path: "www/ttHbb/Plots/"
channel: "ttHbb"
dataset_location: "coffea4bees/metadata/datasets/"

classifier_inputs_json: "output/ttHbb_bkg_syst/bkg_syst_A_3_process_subsamples/classifier_inputs/classifier_inputs_mixeddata_ttHbb.json"
mixeddata_friend_json: "output/ttHbb_bkg_syst/coffea4bees/metadata/friends/friends_ttHbb_bkg_syst_4b.json"
weights_file: "coffea4bees/metadata/weights/weights_ttHbb.yml"
years:
  - "UL16_preVFP"
  - "UL16_postVFP"
  - "UL17"
  - "UL18"

phase_f_output_path: "inputs/"
phase_f_label: "ttHbb"
nominal_coffea: "output/ttHbb/histAll_ttHbb.coffea"

# ttbar MC in inputs.jcm_hists: the ttbar term of the A_1 mixed-data JCM fit
ttbar_processes:
  - "TTTo2L2Nu_stitched"
  - "TTToSemiLeptonic_stitched"
  - "TTToHadronic_stitched"

# ==============================================================================
# STAGE A: CLOSURE SUBSAMPLES FROM A MIXEDDATA ROAST
#   A_1  mixed-data JCM fit in the analysis selection (mixeddata_all vs inputs.jcm_hists)
#   A_2  split mixeddata_all into subsamples.n subsamples with it; + ttbar pseudodata -> mixeddata_4b
#   A_3  processor_ttHbb over each subsample (pre-JCM histograms for B_1, classifier inputs, SvB)
# ==============================================================================
inputs:
  upstream_roasts: [mixeddata_run2_20260927_c39c264-0ce4d59]
  # The mixed data and the ttbar pseudodata: a MakeMixedData roast's handoff YAMLs (read in place)
  mixeddata_all: "{roast:mixeddata_run2_20260927_c39c264-0ce4d59}/handoff/mixeddata_all.yml"
  ttbar_psdata: "{roast:mixeddata_run2_20260927_c39c264-0ce4d59}/handoff/ttbar_PSData.yml"
  # 4b data + ttbar MC noJCM histograms in the ttHbb selection (the B.1 JCM-fit input). A_1 fits the
  # mixed-data JCM against them and B_1 the per-subsample JCMs. The runner config they were made with
  # must sit next to them as analysis_config_noJCM.yml (or set inputs.analysis_config_noJCM): A_1
  # histograms the mixed data with exactly that config.
  jcm_hists: "root://cmseos.fnal.gov//store/user/algomez/XX4b/mixeddata/Run2_v2/ttHbb_pz_rank0_0/output/computeJCM/histAll_NoJCM.coffea"

# A_1: make_jcm_weights.py, mixeddata_all as the "3b" sample; ttbarProcesses = ttbar_processes
mixed_jcm:
  config: "coffea4bees/analysis/jcm_tools/metadata/mixeddata_all_config.yml"
  region: "SB"
  float_t: true

# A_2: split_mixed_data.py / processor_study_mixed_data.py
subsamples:
  n: 16
  split_template: "coffea4bees/skimmer/metadata/split_mixeddata.yml"
  study_template: "coffea4bees/analysis/metadata/study_mixed_data.yml"

# A_3: unified subsample processing (processor_ttHbb over mixeddata_4b:v0..v15). Dumps:
#   1. Pre-JCM Histograms (selJets_noJCM.n / tagJets_noJCM.n for Stage B_1)
#   2. Classifier Input trees on EOS & merged JSON (for Stage C_1)
#   3. SvB Friend Trees on EOS & merged friend JSON (for Stage F_1)
# Runtime effective configs are staged into output/ttHbb_bkg_syst/bkg_syst_A_3_process_subsamples/configs/
phaseA_3:
  runner:
    workers: 4
    min_workers: 25
    max_workers: 200
    worker_memory: "6GB"
    friend_base: null
  config:
    run_SvB: true
    SvB_MA: true
    make_classifier_input: null
    make_friend_SvB: null
    # hist_cuts:
    #   - "pass_nSelJets_gt6"

classifier_inputs_base: "root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/ttHbb_stitched/classifier_inputs/mixeddata/"

# ==============================================================================
# STAGE B_1: DEDICATED JCM FITS & VALIDATION CLOSURE
# Fits JCM transfer weights against 4b Data - ttbar for each subsample (v0..v15)
# using coffea4bees/analysis/jcm_tools/make_jcm_weights.py.
# Evaluates processor_ttHbb with JCM applied on a single subsample (v0) and
# generates data-vs-model closure plots.
# ==============================================================================
phaseB_1:
  jcm:
    config: "coffea4bees/analysis/jcm_tools/metadata/ttHbb_subsample_jcm_config.yml"
    plot_config: "coffea4bees/plots/metadata/plots_JCM_ttHbb.yml"
    region: "SB"
    year: "RunII"
    # data_coffea: defaults to inputs.jcm_hists (as A_1)
  validation:
    subsample: 0
    processor_config: "coffea4bees/workflows/config/analysis_config_bkg_syst_test_subsample.yml"
    plot_config: "coffea4bees/plots/metadata/plots_subsample_v0_closure_ttHbb.yml"
    runner:
      workers: 4
      worker_memory: "6GB"
      condor: true
      shared_dask: true
    config:
      blind: false
      apply_FvT: false
      apply_JCM: true
      apply_trigWeight: false
      apply_btagSF: true
      apply_boosted_veto: false
      run_SvB: false
      top_reconstruction: "fast"
      fill_histograms: true
      hist_cuts:
        - "pass_nSelJets_gt6"

# ==============================================================================
# STAGE C_1: FVT CLASSIFIER TRAINING & EVALUATION (Bridges-2 GPU)
# Self-contained Stage C configuration (Option 1):
#   - classifier_setting: global settings (eras, feature branches, dataloader)
#   - fvt_train_workflow: training task template
#   - fvt_eval_workflow: evaluation task template
# Runtime effective configs are staged into output/ttHbb_bkg_syst/bkg_syst_C_1_FvT/wfs/
# ==============================================================================
classifier_setting:
  - module: ml.DataLoader
    option:
      - optimize_sliceable_dataset: true
      - num_workers: 2
      - batch_eval: 65536
  - module: ROOT
    option:
      - friend_allow_missing: false
  - module: cms.MC_TTbar
    option:
      - datasets:
          - TTToSemiLeptonic_stitched
          - TTToHadronic_stitched
          - TTTo2L2Nu_stitched
  - module: cms.CollisionData
    option:
      - eras:
          UL16_preVFP: [C, D, E, F]
          UL16_postVFP: [F, G, H]
          UL17: [B, C, D, E, F]
          UL18: [A, B, C, D]
        years:
          - UL16_preVFP
          - UL16_postVFP
          - UL17
          - UL18
  - module: HCR.InputBranch
    option:
      - feature_ancillary: [xW, nSelJets, xbW, year]
  - module: ml.Training
    option:
      - precision: fp16

fvt_train_workflow:
  main:
    module: train
    option:
      - --max-loaders 2
      - --max-trainers 3
      - --device cuda cpu
  dataset:
    - module: HCR.FvT.TrainBaseline
      option:
        - --metadata coffea4bees/metadata/datasets/
        - --max-workers 20
        - --data-source detector mixed
        - --no-detector-4b
        - --data-mixed-name mixeddata_4b
        - --data-mixed-samples {mix}
        - --JCM-weight "" {jcm}@@JCM_weights
        - --friends "" {nominal_ci}@@HCR_input {mixed_ci}@@HCR_input
  model:
    - module: HCR.FvT.baseline.Train
      option:
        - --kfolds 3
        - --kfold-seed FvT random
        - --kfold-seed-offsets 0
        - --training EarlyStopStep
        - epoch: 20
          bs_init: 2048
          patience: 3
          min_delta: 0.0001
          min_epoch: 8
        - --finetuning FixedStep
        - epoch: 1
          bs_init: 16384
  setting:
    - module: IO
      option:
        - output: "{model}"

fvt_eval_workflow:
  main:
    module: evaluate
    option:
      - --max-evaluators 3
      - --device cuda cpu
  dataset:
    - module: HCR.FvT.Eval
      option:
        - --metadata coffea4bees/metadata/datasets/
        - --max-workers 8
        - --data-source detector
        - --friends "" {nominal_ci}@@HCR_input
  model:
    - module: HCR.FvT.baseline.Eval
      option:
        - --models
        - Final
        - "{model}/result.json"
  analysis:
    - module: kfold.Merge
      option:
        - --name FvT
        - --step 100000
        - --workers 4
        - --clean
  setting:
    - module: IO
      option:
        - output: "{FvT}"

phase_e_fvt:
  channel: "ttHbb"
  mix_name: "ttHbb_bkg_syst"
  n_models: 16
  eos_base: "root://cmseos.fnal.gov//store/user/algomez/XX4b/mixeddata/Run2"
  plot_base: "root://eosuser.cern.ch//eos/user/a/algomez/www/HH4b/Plots"
  nominal_classifier_inputs: "coffea4bees/metadata/datasets/classifier_inputs_ttHbb_stitched.json"
  mixed_classifier_inputs_template: "output/ttHbb_bkg_syst/bkg_syst_A_3_process_subsamples/histAll_ttHbb_mixeddata_v{m}.json"
  jcm_template: "output/ttHbb_bkg_syst/bkg_syst_B_1_computeJCM/jetCombinatoricModel_SB_mix_v{m}.yml"
  precision: "fp16"
  gpu_partition: "GPU-shared"
  slurm_account: "phy260026p"
  gpu_gres: "gpu:1"
  gpu_mem: 22000
  eval_mem: 22000
  plot_inputs: false
  plot_weights: false
  analyze: false
  evaluate: true


analysis_config:
  processor: "coffea4bees/analysis/processors/processor_ttHbb.py"
  dataset_location: "output/ttHbb_bkg_syst/coffea4bees/metadata/datasets/"
  datasets_file: "output/ttHbb_bkg_syst/bkg_syst_A_2_make_subsamples/mixeddata_4b.yml"
  friend_file: "output/ttHbb_bkg_syst/coffea4bees/metadata/friends/friends_ttHbb_bkg_syst_4b.json"
  weights_file: "coffea4bees/metadata/weights/weights_ttHbb.yml"
  runner:
    workers: 8
    chunksize: 100000
    condor: false
    shared_dask: false
    run_performance: false
  config:
    fourTag_use_tight: false
    blind: false
    apply_FvT: false
    apply_JCM: false
    apply_trigWeight: false
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: true
    SvB_MA: true
    SvB: null
    apply_lepton_veto: false
    hist_cuts: ["pass_nSelJets_gt6"]
    top_reconstruction: fast
    plot_ttbar_with_weights: true

# TWO-STAGE CLOSURE CANDIDATES & MULTI-BINNING
closure_rebin_candidates:
  - 2   # 120 bins (240 / 2)
  - 12  # 20 bins (240 / 12)
  - 15  # 16 bins (240 / 15)
  - 16  # 15 bins (240 / 16)
  - 20  # 12 bins (240 / 20)
  - 24  # 10 bins (240 / 24)
max_basis: 10
rebin: 12


