# ==============================================================================
# Run 3 limits with the SvB_FeynNet score -- Phase F only, on top of nominal_run3
# ==============================================================================
# Only the differences from nominal_run3.yml; see nominal_run3_quadjet_run2.yml for how the
# `base:` overlay merges (dicts recursively, lists replace).
#
#   roast:    `roast new --config <this file>`, then submit ONLY step F.
#   by hand:  snakemake --configfile coffea4bees/workflows/config/nominal_run3.yml \
#                       --configfile coffea4bees/workflows/config/nominal_run3_feynnet.yml
#
# Nothing upstream is re-made. JCM, FvT and SvB_MA are all read from the published
# production nominal_run3_20260922_3f9e199-1e0504f -- pinned by explicit URL, NOT {roast_id},
# which here would name this roast, where no B/C/D outputs exist.
#
# Three Combine channels from the same F.1 histograms:
#   * HH4b               -- the base channel, SvB_MA.ps_hh_fine, untouched. Must reproduce the
#                           production's blinded stat-only Asimov: limit 3.70 (2.61-5.30), sig 0.80.
#                           If it does not, something other than the SvB changed; stop there.
#   * HH4b_FeynNet       -- SvB_FeynNet.p_ggHH_vs_bkg, 50 bins. Events FeynNet routes to ZZ/ZH (-1)
#                           or that fail minPs (-2) fall in underflow, as for ps_hh. Kept so the
#                           first roast's 5.08 / 0.39 is reproduced alongside the fine version.
#   * HH4b_FeynNet_fine  -- the same score at 240 bins, the ps_hh_fine granularity. The 50-bin
#                           top bin (0.98-1) holds most of the signal and cannot be split.
# Caveat (nominal_run3_feynnet_20260923_d54d644-c24101b): at 240 bins, ps_hh_fine has top bins with
# zero background, which these stat-only datacards (no autoMCStats) treat as background-free --
# that inflates HH4b's 0.80 (0.54 once they are merged). Check the fine FeynNet for the same.
#
# Loading SvB_FeynNet alongside SvB_MA does not change the selection: passSvB/failSvB prefer
# SvB_MA (analysis/helpers/candidates_selection.py, _assign_output_vars). So F.1 is kept on the
# base's blessed cutflow reference, known_fullCounts_Run3_nominal.yml, as a regression check.
#
# SvB_FeynNet friends (metadata/friends/SvBFeynNetfriend_mixeddata_data.json, via
# friends_HH4b.yml) cover data + signal only since coffea4bees 89988879 -- all F.1 reads, since
# the ttbar here is estimated from 3b data (plot_ttbar_with_weights), not MC.
base: coffea4bees/workflows/config/nominal_run3.yml

label: "Run3_nominal_feynnet"
output_path: "output/Run3_nominal_feynnet/"

analysis_config:
  config:
    friends:
      FvT: root://cmseos.fnal.gov//store/user/jda102/HH4b_prod/nominal_run3_20260922_3f9e199-1e0504f/friend/FvT_nominal/result.json@@analysis.0.merged
      SvB_MA: root://cmseos.fnal.gov//store/user/jda102/HH4b_prod/nominal_run3_20260922_3f9e199-1e0504f/friend/SvB_nominal/result.json@@analysis.0.merged
    # The production's own Phase B fit, read from its EOS handoff area (jetCombinatoricModel
    # opens it through fsspec). Not the metadata/weights/JCM/Run3_nominal/ symlink, which points
    # at the older checked-in Run3/v2 fit.
    JCM_file: root://cmseos.fnal.gov//store/user/jda102/HH4b_prod/nominal_run3_20260922_3f9e199-1e0504f/handoff/jetCombinatoricModel_SB_Run3_v1.yml
    # Lists replace, so restate the base's three and add SvB_FeynNet (per-year, friends_HH4b.yml).
    friends_include: [trigWeight, FvT, SvB_MA, SvB_FeynNet]

combine_outdir: "datacards/HH4b_run3_feynnet"

# HH4b is inherited from the base unchanged (dicts merge). Channel keys are split on '_' for
# the metadata template, so HH4b_FeynNet also uses HH4b_run3.yml (the fixed base template).
channels:
  HH4b_FeynNet:
    signallabel: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb"
    othersignal: ""
    variable: "SvB_FeynNet.p_ggHH_vs_bkg"
    signal: "GluGlutoHHto4B_kl-1p00_kt-1p00_c2-0p00"
    closure_subdir: "hh"
  HH4b_FeynNet_fine:
    signallabel: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb"
    othersignal: ""
    variable: "SvB_FeynNet.p_ggHH_vs_bkg_fine"
    signal: "GluGlutoHHto4B_kl-1p00_kt-1p00_c2-0p00"
    closure_subdir: "hh"
