# ==============================================================================
# Run 3 analysis CI config — the standalone counterpart of nominal_run3.yml
# ==============================================================================
# Used by gitlab-CI/stages_analysis.yml (analysis_data_Run3_coffea4bees and
# analysis_MC_Run3_coffea4bees), which really *execute* Phase F.1 with `test=true`, unlike the
# Run 2 CI jobs that only dry-run their config.
#
# WHY THIS IS SEPARATE FROM nominal_run3.yml
# ------------------------------------------
# The production config is roast-scoped: its JCM and its FvT/SvB friends live under
# {roast_id}, which `helpers/common.smk` resolves to the roast id inside a roast and to the
# config label outside one. Those per-roast artefacts are created by Phase B and Phase C/D, so
# outside a roast they do not exist:
#
#   * the JCM is opened with a plain open() -> FileNotFoundError, and
#   * runner.py merges friends as {**per_year, **config} so the config's FvT *replaces* the
#     working per-year entry from friends_HH4b.yml; when the per-roast file is missing the
#     friend is dropped with a warning, and with apply_FvT true every chunk then comes back
#     empty ("No chunks returned results").
#
# Making runner.py fall back to the per-year friend would fix CI and reintroduce exactly the
# silent-degradation the Run 2 campaign was spent eliminating: a production quietly training on
# another production's weights. So the production config stays honestly roast-scoped, and CI
# gets this file, which names only inputs that exist in a plain checkout.
#
# Keep the *processor settings* here in step with nominal_run3.yml (b-tagging, trigger weights,
# top reconstruction, tight 4b definition). What deliberately differs is only the roast-scoped
# machinery: no JCM_file, no friends override, no {roast_id} anywhere.
email: ""
label: "run3_nominal"
output_path: "output/run3_nominal/"

analysis_config:
  processor: "coffea4bees/analysis/processors/processor_HH4b.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  friend_file: "coffea4bees/metadata/friends/friends_HH4b.yml"
  weights_file: "coffea4bees/metadata/weights/weights_HH4b.yml"
  runner:
    workers: 4
    worker_memory: 8GB
    dashboard_address: 0
  config:
    blind: false
    # No FvT: the per-roast friend does not exist here, and the per-year Run 3 FvT in
    # friends_HH4b.yml is keyed to an earlier skim, so requiring it would make CI depend on
    # friend-tree UUIDs matching the current picoAODs. plot_ttbar_with_weights needs the FvT
    # d3 weights, so it is off too — the ttbar is taken from MC in this config's dataset list.
    apply_FvT: false
    plot_ttbar_with_weights: false
    apply_trigWeight: true
    # trigweights_Run3_v1.json covers TT/TTbb/ttHbb only, not the ggF signal (see
    # friends_HH4b.yml): warn rather than abort. Same reason as in nominal_run3.yml.
    require_trigWeight: false
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: true
    top_reconstruction: fast
    # Run 3 four-tag definition: tight btagPNetB working point. Keep in step with production.
    fourTag_use_tight: true

known_counts: "coffea4bees/analysis/tests/known_Counts_Run3.yml"
plot_config: "coffea4bees/plots/metadata/plotsAll_ttbarWeights.yml"
combine_flags: "--blind"

# ttbar from MC here, since plot_ttbar_with_weights is off and there is no FvT to build the
# d3 estimate from. `data` is not listed: in test mode Snakefile_PhaseF_1_analysis.smk
# synthesises the single `histAll_<label>_data.coffea` target the all_data job builds.
dataset:
  - "GluGlutoHHto4B_kl-1p00_kt-1p00_c2-0p00"
  - "TTTo2L2Nu"
  - "TTToSemiLeptonic"
  - "TTToHadronic"

# All four 2022/2023 eras, matching production. A test slice is ~22 s over the 14 chunks, so
# the extra coverage over a single era is nearly free.
year_eras:
  2022_preEE:
    - "B"
    - "C"
    - "D"
  2022_EE:
    - "E"
    - "F"
    - "G"
  2023_preBPix:
    - "C01"
    - "C02"
    - "C11"
    - "C12"
    - "C3"
    - "C4"
  2023_BPix:
    - "D1"
    - "D2"
