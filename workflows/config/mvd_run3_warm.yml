# ==============================================================================
# 2022+2023 MvD (mixed 1x) finetune-fix redo, WARM START from the original MvD models
# ==============================================================================
# As mvd_run3_ftfix.yml (V.1 reused from mvd_run3_20260927_91be0e9-f18c44b; V.2 MvD, V.2c, V.3 SvB_MvD,
# V.4; era-split evaluations), but the MvD is not trained from scratch: HH4b_Run3/MvD_warm loads each
# fold's saved model from mvd_run3_20260927_91be0e9-f18c44b (same k-fold split) and reruns only the
# tail of the schedule (5 epochs, lr 2.5e-3 -> 1e-5 at batch 16384) plus the fixed finetune
# (FinetuneStep, lr 1e-4). The fresh 22+23 retrains (seed 0: mvd_run3_ftfix_20261107_1c7c8db-3d65ecc,
# seed 1: mvd_run3_ftfix_s1_20261107_1c7c8db-3f6ea1b) reached the original's validation loss
# (~0.609) in only 1 of 6 folds (~0.618 otherwise); the original models are in the good minimum in
# all three folds, and only their old finetune needs undoing. Needs barista with remote
# --pretrained-weights (mvd-warm-start, b02b7c12).
#
#   roast new --config coffea4bees/workflows/config/mvd_run3_warm.yml \
#       --step nautilus:coffea4bees/workflows/Snakefile_MvD_2_train.smk \
#       --step cmslpc:coffea4bees/workflows/Snakefile_MvD.smk \
#       --step nautilus:coffea4bees/workflows/Snakefile_MvD_3_svb.smk
#   roast submit <id> --step MvD_2_train ; roast submit <id> --step MvD --targets all_V2c
#   roast submit <id> --step MvD_3_svb   ; roast submit <id> --step MvD --targets all_V4
# ==============================================================================
base: coffea4bees/workflows/config/mvd_run3_ftfix.yml

label: "mvd_run3_warm"

mvd:
  wfs_base: "coffea4bees/classifier/config/workflows/HH4b_Run3/MvD_warm"
  workflow_inserts:
    --training: ["--pretrained-weights {roast:mvd_run3_20260927_91be0e9-f18c44b}/classifier/MvD"]

closure:
  known_counts: "coffea4bees/analysis/tests/known_fullCounts_MvD_closure_Run3_warm.yml"

analysis:
  known_counts: "coffea4bees/analysis/tests/known_fullCounts_MvD_Run3_warm.yml"
