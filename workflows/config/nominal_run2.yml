# ==============================================================================
# GLOBAL WORKFLOW CONFIGURATION
# ==============================================================================
label: "TEST"
output_path: "output/TEST/"

dataset:
  - "GluGluToHHTo4B_cHHH1"
  - "GluGluToHHTo4B_cHHH0"
  - "GluGluToHHTo4B_cHHH2p45"
  - "GluGluToHHTo4B_cHHH5"
  - "ZH4b"
  - "ZZ4b"
  - "ggZH4b"

year_eras:
  UL16_preVFP:
    - "C"
    - "D"
    - "E"
    - "F"
  UL16_postVFP:
    - "F"
    - "G"
    - "H"
  UL17:
    - "C"
    - "D"
    - "E"
    - "F"
  UL18:
    - "A"
    - "B"
    - "C"
    - "D"

# ==============================================================================
# PHASE C & D: CLASSIFIER SETTINGS (Entirely on falcon / PSC)
# ==============================================================================
classifier_setting:
  - module: ml.DataLoader
    option:
      - optimize_sliceable_dataset: true
  - module: ROOT
    option:
      - friend_allow_missing: false
  - module: cms.CollisionData
    option:
      - eras:
          UL16_preVFP: [C, D, E, F]
          UL16_postVFP: [F, G, H]
          UL17: [B, C, D, E, F]
          UL18: [A, B, C, D]
  - module: HCR.InputBranch
    option:
      - feature_ancillary: [xW, nSelJets, xbW, year]

# ==============================================================================
# PHASE B.2: CLASSIFIER INPUT FRIEND TREES (cmslpc)
# ==============================================================================
# Everything else is inherited from analysis_config below.  These friend trees MUST go to
# EOS: the Condor workers cannot see the node-local output/ directory, and the merge step
# then fails with "cp: cannot stat ...".
classifier_inputs:
  config:
    make_classifier_input: "{eos_prod}/{roast_id}/classifier_inputs/"

# ==============================================================================
# PHASE B -> C/D HANDOFF
# ==============================================================================
# Where Phase B publishes the two files C and D consume (rule phaseB_handoff in
# Snakefile_PhaseB.smk).  B always writes local copies at
#   coffea4bees/metadata/weights/JCM/{roast_id}/jetCombinatoricModel_SB_2024_v2.yml
#   coffea4bees/metadata/datasets/classifier_inputs_{roast_id}.json
# on the host it runs on (cmslpc), which is what C.4 and F.1 read -- the analysis processor
# opens the JCM with a plain open(), so those consumers need a real file.
#
# eos_base additionally publishes both to EOS.  C and D run on falcon and read them through
# the classifier's parse.mapping, which deserializes with fsspec and so accepts root:// URLs,
# so nothing has to be copied into the falcon checkout by hand.  The fvt/svb blocks below
# must point at these same two URLs.  Leave eos_base unset and only the local copies are
# made, which is what a plain `snakemake --configfile ...` run outside roast wants.
handoff:
  eos_base: "{eos_prod}/{roast_id}/handoff"

# ==============================================================================
# PHASE C: FvT (falcon).  Self-contained per roast: models and friends go to the roast's own
# EOS directory, and training/evaluation read THIS roast's classifier-input manifest and JCM
# fit from the handoff area above.
# workflow_overrides: the checked-in templates classifier/config/workflows/HH4b_2024_v2/FvT/
# {train,evaluate}.yml stay the source of truth; only the listed flags are replaced
# (helpers/common.smk: write_workflow_overrides).
# ==============================================================================
fvt:
  eos_base: "{eos_prod}/{roast_id}"
  plot_base: "{web_prod}/{roast_id}/classifier"
  classifier_config_paths: "coffea4bees"
  wfs_base: "coffea4bees/classifier/config/workflows/HH4b_2024_v2/FvT"
  label: "FvT_nominal"
  output_dir: "output/FvT_nominal/"
  # yields page (output_dir/yields.html): four-tag data vs JCM x (3b data - 3b ttbar) + 4b ttbar
  yields_ratio: ["d4 / d3 - t3 + t4"]
  plot_inputs: true
  model: "{eos_base}/classifier/{label}"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: {eos_base}/classifier/{label}"
  eval_template: "model: {eos_base}/classifier/{label}, FvT: {eos_base}/friend/{label}"
  metadata: "{eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input"
  workflow_overrides:
    --metadata: "coffea4bees/metadata/datasets/"
    --JCM-weight: '"" {eos_prod}/{roast_id}/handoff/jetCombinatoricModel_SB_2024_v2.yml@@JCM_weights'
    '--friends ""': "{eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input"

# ==============================================================================
# PHASE C.4 (cmslpc, roast step C4): FvT closure -- the processor on data with JCM x FvT (no
# SvB; the ttbar histograms are reused from Phase B.1's wJCM pass, since the FvT does not
# touch MC), plots, cutflow check and closure table.  The remaining defaults live in
# Snakefile_PhaseC_4_FvT_closure.smk; the FvT friend is analysis_config.config.friends.FvT
# below, and the JCM is this roast's own copy.
# ==============================================================================
fvt_closure:
  datasets: [data, TTToHadronic, TTToSemiLeptonic, TTTo2L2Nu]
  plot_config: "coffea4bees/plots/metadata/plotsAll.yml"

# ==============================================================================
# PHASE D: SvB (falcon).  Same per-roast pattern as fvt; the FvT friend used for the
# background is {eos_base}/friend/FvT_nominal, i.e. THIS roast's Phase C output.
# ==============================================================================
svb:
  eos_base: "{eos_prod}/{roast_id}"
  plot_base: "{web_prod}/{roast_id}/classifier"
  classifier_config_paths: "coffea4bees"
  wfs_base: "coffea4bees/classifier/config/workflows/HH4b_2024_v2/SvB"
  label: "SvB_nominal"
  output_dir: "output/SvB_nominal/"
  plot_inputs: true
  evaluate: true
  model: "{eos_base}/classifier/{label}"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: {eos_base}/classifier/{label}, FvT: {eos_base}/friend/FvT_nominal"
  eval_template: "model: {eos_base}/classifier/{label}, SvB: {eos_base}/friend/{label}"
  metadata: "{eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input"
  workflow_overrides:
    --metadata: "coffea4bees/metadata/datasets/"
    --JCM-weight: '"" {eos_prod}/{roast_id}/handoff/jetCombinatoricModel_SB_2024_v2.yml@@JCM_weights'
    '--friends ""': "{eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input"

# ==============================================================================
# PHASE F.1: MAIN ANALYSIS PROCESSOR, CUTFLOWS & PLOTTING
# ==============================================================================
analysis_config:
  processor: "coffea4bees/analysis/processors/processor_HH4b.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  friend_file: "coffea4bees/metadata/friends/friends_HH4b.yml"
  weights_file: "coffea4bees/metadata/weights/weights_HH4b_2024_v2.yml"
  runner:
    workers: 4
    worker_memory: 8GB
    dashboard_address: 0
  config:
    blind: true
    apply_FvT: true
    apply_JCM: true
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: true
    SvB_MA: true
    SvB: null
    top_reconstruction: fast
    plot_ttbar_with_weights: true

plot_config: "coffea4bees/plots/metadata/plotsAll_ttbarWeights.yml"

# ==============================================================================
# PHASE F.2: COMBINE STATISTICAL INTERPRETATION & LIMITS
# ==============================================================================
combine_flags: "--blind"
combine_outdir: "datacards/HH4b_fine"
metadata_template: "coffea4bees/stats_analysis/metadata/{channel}.yml"

channels:
  HH4b:
    signallabel: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb"
    othersignal: "ggHH_kl_0_kt_1_13p0TeV_hbbhbb ggHH_kl_2p45_kt_1_13p0TeV_hbbhbb ggHH_kl_5_kt_1_13p0TeV_hbbhbb"
    variable: "SvB_MA.ps_hh_fine"
    signal: "GluGluToHHTo4B_cHHH1"
    closure_subdir: "hh"
  ZZ4b:
    signallabel: "ZZ_bbbb"
    othersignal: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb ZH_bbbb"
    variable: "SvB_MA.ps_zz"
    signal: "ZZ4b"
    closure_subdir: "zz"
  ZH4b:
    signallabel: "ZH_bbbb"
    othersignal: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb ZZ_bbbb"
    variable: "SvB_MA.ps_zh"
    signal: "ZH4b"
    closure_subdir: "zh"
