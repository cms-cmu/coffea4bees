# ==============================================================================
# ttHbb Run 2 BACKGROUND SYSTEMATIC — CosineAnnealing FvT Schedule (Roast B)
# ==============================================================================
# Evaluates the CosineAnnealing learning rate schedule and FinetuneStep on the
# 16 background systematic subsample models, mirroring Roast B (stat-only cosine).
# Layered on the default ttHbb background systematic workflow (ttHbb_bkg_syst.yml).
# Reuses pre-FvT stages A & B from ttHbb_bkg_syst_v3 on EOS to allow direct
# GPU training (Stage BKG_C) without re-running CPU subsample generation.
# ==============================================================================

base: coffea4bees/workflows/config/ttHbb_bkg_syst.yml

label: "ttHbb_bkg_syst_cosine"

upstream_pre_fvt: "pre_fvt"

inputs:
  upstream_roasts:
    nominal: ttHbb_run2_20261003_f7183e9-cca392c
    mixeddata: mixeddata_run2_20260927_c39c264-0ce4d59
    pre_fvt: ttHbb_bkg_syst_v3

fvt_train_workflow:
  model:
    - module: HCR.FvT.baseline.Train
      option:
        - --kfolds 3
        - --kfold-seed FvT random
        - --kfold-seed-offsets 0
        - --training CosineAnnealing
        - epoch: 20
          bs_init: 1024
        - --finetuning FinetuneStep
        - epoch: 1
          bs_init: 16384
