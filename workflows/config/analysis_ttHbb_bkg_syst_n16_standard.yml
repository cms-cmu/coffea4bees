# ==============================================================================
# ttHbb Run 2 BACKGROUND SYSTEMATIC — Standard Schedule FvT (n=16, 20 ep, no floor)
# ==============================================================================
# Layered on analysis_ttHbb_bkg_syst_declib16nc.yml (DeClustered 16x library).
# Tests n=16 intermediate architecture with standard 20-epoch schedule and removes
# FvT_pd3_floor to prevent artificial multijet suppression in the high-SvB tail.
# ==============================================================================

base: coffea4bees/workflows/config/analysis_ttHbb_bkg_syst_declib16nc.yml

label: "ttHbb_bkg_syst_n16_standard"
mix_name: "ttHbb_bkg_syst_n16_standard"
output_path: "output/{roast_id}/"

publish_base: "{eos_prod}/{roast_id}"
handoff:
  eos_base: "{eos_prod}/{roast_id}/handoff"

inputs:
  upstream_roasts:
    declib: declib16nc_run2_20261003_3ab8302-b2d2dec
    nominal: analysis_ttHbb_opt_param_20261018_846d264-1e8d320
    nominal_b: ttHbb_stat_only_20261012_49432f5-e211288
    mixeddata: mixeddata_run2_20260927_c39c264-0ce4d59
  mixeddata_all: "{roast:declib}/handoff/synthetic_data_lib16nc_multijet.yml"
  ttbar_psdata: "{roast:mixeddata}/handoff/ttbar_PSData.yml"
  jcm_hists: "{roast:nominal_b}/{roast:nominal_b:output_path}computeJCM/histAll_NoJCM.coffea"
  nominal_hists: "{roast:nominal}/{roast:nominal:output_path}histAll_{roast:nominal:label}.coffea"
  classifier_inputs: "{roast:nominal_b}/handoff/classifier_inputs_{roast:nominal_b:id}.json"
  SvB: "{roast:nominal}/friend/SvB_ttHbb_opt_param/result.json@@analysis.0.merged"
  SvB_model: "{roast:nominal}/classifier/SvB_ttHbb_opt_param/result.json"
  SvB_MA: "{roast:nominal}/friend/SvB_MA_ttHbb_opt_param/result.json@@analysis.0.merged"
  SvB_MA_model: "{roast:nominal}/classifier/SvB_MA_ttHbb_opt_param/result.json"

classifiers:
  - "SvB_MA"
  - "SvB"
classifier_variables:
  SvB_MA: "SvB_MA_ps_ttHbb"
  SvB: "SvB_ps_ttHbb"

subsamples:
  source: "seeds"
  n: 16
  dataset_name: "mixeddata_4b"
  runner:
    condor: true
    shared_dask: true
    worker_memory: "8GB"

phase_e_fvt:
  channel: "ttHbb"
  mix_name: "ttHbb_bkg_syst_n16_standard"
  n_models: 16

fvt_train_workflow:
  main:
    module: train
    option:
      - --max-loaders 2
      - --max-trainers 1
      - --device cuda cpu
  model:
    - module: HCR.FvT.baseline.Train
      option:
        - --architecture
        - n_features: 16
          use_kv_proj: true
          use_attention_gate: true
        - --kfolds 3
        - --kfold-seed FvT random
        - --kfold-seed-offsets 0
        - --training FixedStep
        - epoch: 20
          bs_init: 2048
        - --finetuning FixedStep
        - epoch: 1
          bs_init: 16384
