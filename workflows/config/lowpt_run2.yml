# ==============================================================================
# GLOBAL WORKFLOW CONFIGURATION
# ==============================================================================
email: "tgomezes@andrew.cmu.edu"
label: "run2_lowpt"
output_path: "output/run2_lowpt/"

dataset:
  - "GluGluToHHTo4B_cHHH1"
  - "GluGluToHHTo4B_cHHH0"
  - "GluGluToHHTo4B_cHHH2p45"
  - "GluGluToHHTo4B_cHHH5"
  - "ZH4b"
  - "ZZ4b"
  - "ggZH4b"

year_eras:
  UL16_preVFP:
    - "C"
    - "D"
    - "E"
    - "F"
  UL16_postVFP:
    - "F"
    - "G"
    - "H"
  UL17:
    - "C"
    - "D"
    - "E"
    - "F"
  UL18:
    - "A"
    - "B"
    - "C"
    - "D"

# ==============================================================================
# PHASE C & D: CLASSIFIER SETTINGS (Entirely on falcon / PSC)
# ==============================================================================
classifier_setting:
  - module: ml.DataLoader
    option:
      - optimize_sliceable_dataset: true
  - module: ROOT
    option:
      - friend_allow_missing: false
  - module: cms.CollisionData
    option:
      - eras:
          UL16_preVFP: [C, D, E, F]
          UL16_postVFP: [F, G, H]
          UL17: [B, C, D, E, F]
          UL18: [A, B, C, D]
  - module: HCR.InputBranch
    option:
      - feature_ancillary: [xW, nSelJets_lowpt, xbW, year]

fvt:
  eos_base: "root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/lowpt_sel_LWP"
  plot_base: "root://eosuser.cern.ch//eos/user/a/algomez/www/HH4b/Plots"
  classifier_config_paths: "coffea4bees"
  wfs_base: "coffea4bees/classifier/config/workflows/HH4b_2024_v2_lowpt/FvT"
  label: "lowpt_FvT"
  output_dir: "output/lowpt_FvT/"
  plot_inputs: true
  model: "{eos_base}/classifier/{label}"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: {eos_base}/classifier/{label}"
  eval_template: "model: {eos_base}/classifier/{label}, FvT: {eos_base}/friend/{label}"
  metadata: "coffea4bees/metadata/datasets/archive/Run2_2024_v2/classifier_inputs_lowpt_wlowptJCM.json@@HCR_input_lowpt"

svb:
  eos_base: "root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/lowpt_sel_LWP"
  plot_base: "root://eosuser.cern.ch//eos/user/a/algomez/www/HH4b/Plots"
  classifier_config_paths: "coffea4bees"
  wfs_base: "coffea4bees/classifier/config/workflows/HH4b_2024_v2_lowpt/SvB"
  label: "lowpt_SvB"
  output_dir: "output/lowpt_SvB/"
  plot_inputs: true
  evaluate: true
  model: "{eos_base}/classifier/{label}"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: {eos_base}/classifier/{label}, FvT: {eos_base}/friend/lowpt_FvT"
  eval_template: "model: {eos_base}/classifier/{label}, SvB: {eos_base}/friend/{label}"
  metadata: "coffea4bees/metadata/datasets/archive/Run2_2024_v2/classifier_inputs_lowpt_wlowptJCM.json@@HCR_input_lowpt"

# ==============================================================================
# PHASE E.1: MAIN ANALYSIS PROCESSOR, CUTFLOWS & PLOTTING
# ==============================================================================
analysis_config:
  processor: "coffea4bees/analysis/processors/processor_HH4b_lowpt.py"
  dataset_location: "coffea4bees/metadata/datasets/archive/Run2_2024_v2/"
  friend_file: "coffea4bees/metadata/datasets/archive/Run2_2024_v2/friends_HH4b_lowpt.yml"
  weights_file: "coffea4bees/metadata/weights/weights_HH4b_lowpt.yml"
  runner:
    chunksize: 10000
    workers: 4
    worker_memory: 4GB
    dashboard_address: 0
  config:
    SvB_MA: true
    blind: true
    apply_FvT: true
    apply_JCM: true
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: true
    SvB: null
    top_reconstruction: fast
    plot_ttbar_with_weights: true

known_counts: "coffea4bees/analysis/tests/known_Counts_lowpt_Run2.yml"
plot_config: "coffea4bees/plots/metadata/plotsAll_lowpt.yml"

# ==============================================================================
# PHASE E.2: COMBINE STATISTICAL INTERPRETATION & LIMITS
# ==============================================================================
combine_flags: "--three_tag lowpt_threeTag --four_tag lowpt_fourTag --blind"
combine_outdir: "datacards/HH4b_fine"
metadata_template: "coffea4bees/stats_analysis/metadata/{channel}.yml"

channels:
  HH4b:
    signallabel: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb"
    othersignal: "ggHH_kl_0_kt_1_13p0TeV_hbbhbb ggHH_kl_2p45_kt_1_13p0TeV_hbbhbb ggHH_kl_5_kt_1_13p0TeV_hbbhbb"
    variable: "SvB_MA.ps_hh_fine"
    signal: "GluGluToHHTo4B_cHHH1"
    closure_subdir: "hh"
  ZZ4b:
    signallabel: "ZZ_bbbb"
    othersignal: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb ZH_bbbb"
    variable: "SvB_MA.ps_zz"
    signal: "ZZ4b"
    closure_subdir: "zz"
  ZH4b:
    signallabel: "ZH_bbbb"
    othersignal: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb ZZ_bbbb"
    variable: "SvB_MA.ps_zh"
    signal: "ZH4b"
    closure_subdir: "zh"
