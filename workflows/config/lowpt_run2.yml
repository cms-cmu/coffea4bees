# ==============================================================================
# GLOBAL WORKFLOW CONFIGURATION
# ==============================================================================
label: "run2_lowpt"
output_path: "output/run2_lowpt/"

dataset:
  - "data"
  - "GluGluToHHTo4B_cHHH1"
  - "GluGluToHHTo4B_cHHH0"
  - "GluGluToHHTo4B_cHHH2p45"
  - "GluGluToHHTo4B_cHHH5"
  - "ZH4b"
  # - "ZZ4b"  # Temporarily disabled: UL16 chunks have new UUIDs after re-skim and are missing trigger-weight friends until trigweights_ZZ4b_UL16.yml is run and merged.
  - "ggZH4b"

year_eras:
  UL16_preVFP:
    - "C"
    - "D"
    - "E"
    - "F"
  UL16_postVFP:
    - "F"
    - "G"
    - "H"
  UL17:
    - "C"
    - "D"
    - "E"
    - "F"
  UL18:
    - "A"
    - "B"
    - "C"
    - "D"

# ==============================================================================
# PHASE B: CALIBRATION & CLASSIFIER INPUTS (JCM & Friendtrees)
# ==============================================================================
jcm_plot_config: "coffea4bees/plots/metadata/plotsAll_lowpt_noFvT.yml"
jcm_extra_arguments: "--lowpt --jcm_config coffea4bees/analysis/jcm_tools/metadata/lowpt_jcm_config.yml"
jcm_datasets:
  - "data"
  - "TTToSemiLeptonic"
  - "TTTo2L2Nu"
  - "TTToHadronic"

jcm_known_counts_fatal: false
jcm_known_counts_NoJCM: "none"
jcm_known_counts_wJCM: "none"

# ==============================================================================
# PHASE B.2: CLASSIFIER INPUT FRIEND TREES (cmslpc)
# ==============================================================================
classifier_inputs:
  datasets:
    - data
    - TTToHadronic
    - TTToSemiLeptonic
    - TTTo2L2Nu
    - GluGluToHHTo4B_cHHH1
    - GluGluToHHTo4B_cHHH0
    - GluGluToHHTo4B_cHHH2p45
    - GluGluToHHTo4B_cHHH5
    - ZH4b
    - ggZH4b
  config:
    make_classifier_input: "{eos_prod}/{roast_id}/classifier_inputs/"
    fill_histograms: false

# ==============================================================================
# PHASE B -> C/D HANDOFF
# ==============================================================================
handoff:
  eos_base: "{eos_prod}/{roast_id}/handoff"

# ==============================================================================
# PHASE C & D: CLASSIFIER SETTINGS (Entirely on falcon / PSC / Nautilus)
# ==============================================================================
classifier_setting:
  - module: ml.DataLoader
    option:
      - optimize_sliceable_dataset: true
  - module: ROOT
    option:
      - friend_allow_missing: false
  - module: cms.CollisionData
    option:
      - eras:
          UL16_preVFP: [C, D, E, F]
          UL16_postVFP: [F, G, H]
          UL17: [B, C, D, E, F]
          UL18: [A, B, C, D]
  - module: HCR.InputBranch
    option:
      - feature_ancillary: [xW, nSelJets_lowpt, xbW, year]

# ==============================================================================
# PHASE C: FvT (falcon or nautilus)
# ==============================================================================
fvt:
  eos_base: "{eos_prod}/{roast_id}"
  plot_base: "{web_prod}/{roast_id}/classifier"
  classifier_config_paths: "coffea4bees"
  label: "lowpt_FvT"
  output_dir: "output/lowpt_FvT/"
  yields_ratio: ["d4 / d3 - t3 + t4"]
  plot_inputs: true
  plot_weights: true
  evaluate: true
  model: "{eos_base}/classifier/{label}"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: {eos_base}/classifier/{label}"
  eval_template: "model: {eos_base}/classifier/{label}, FvT: {eos_base}/friend/{label}"
  metadata: "{eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input_lowpt"
  train_workflow:
    main:
      module: train
      option:
        - --max-loaders 2
        - --max-trainers 2
    dataset:
      - module: HCR.FvT_lowpt.TrainBaseline
        option:
          - --metadata coffea4bees/metadata/datasets/
          - --max-workers 20
          - --data-source detector
          - --JCM-weight "" {eos_prod}/{roast_id}/handoff/jetCombinatoricModel_SB_2024_v2.yml@@JCM_weights
          - --friends "" {eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input_lowpt
    model:
      - module: HCR.FvT.baseline.Train
        option:
          - --kfolds 3
          - --kfold-seed FvT random
          - --kfold-seed-offsets 0
          - --training FixedStep
          - --architecture
          - n_features: 8
            use_kv_proj: true
            use_attention_gate: true
          - epoch: 20
            bs_init: 1024
          - --finetuning FixedStep
          - epoch: 1
            bs_init: 16384
    setting:
      - module: IO
        option:
          - output: "{model}"
  eval_workflow:
    main:
      module: evaluate
      option:
        - --max-evaluators 3
        - --device cuda cpu
    dataset:
      - module: HCR.FvT_lowpt.Eval
        option:
          - --metadata coffea4bees/metadata/datasets/
          - --max-workers 8
          - --data-source detector
          - --friends "" {eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input_lowpt
    model:
      - module: HCR.FvT.baseline.Eval
        option:
          - --models
          - Final
          - "{model}/result.json"
    analysis:
      - module: kfold.Merge
        option:
          - --name FvT
          - --step 100000
          - --workers 5
          - --clean
    setting:
      - module: IO
        option:
          - output: "{FvT}"
      - module: ml.DataLoader
        option:
          - num_workers: 0

# ==============================================================================
# PHASE C.4: FvT CLOSURE (cmslpc)
# ==============================================================================
fvt_closure:
  datasets: [data, TTToHadronic, TTToSemiLeptonic, TTTo2L2Nu]
  plot_config: "coffea4bees/plots/metadata/plotsAll_lowpt.yml"
  known_counts_fatal: false

# ==============================================================================
# PHASE D: SvB (falcon or nautilus)
# ==============================================================================
svb:
  eos_base: "{eos_prod}/{roast_id}"
  plot_base: "{web_prod}/{roast_id}/classifier"
  classifier_config_paths: "coffea4bees"
  label: "lowpt_SvB"
  output_dir: "output/lowpt_SvB/"
  plot_inputs: true
  plot_weights: true
  evaluate: true
  model: "{eos_base}/classifier/{label}"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: {eos_base}/classifier/{label}, FvT: {eos_base}/friend/lowpt_FvT"
  eval_template: "model: {eos_base}/classifier/{label}, SvB: {eos_base}/friend/{label}"
  metadata: "{eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input_lowpt"
  train_workflow:
    main:
      module: train
      option:
        - --max-loaders 2
        - --max-trainers 3
    model:
      - module: HCR.SvB.ggF.baseline.Train
        option:
          - --roc-signal-by-category
          - --kfold-seed SvB random
          - --kfold-seed-offsets 0
          - --architecture
          - n_features: 8
            use_kv_proj: true
            use_attention_gate: true
          - --training FixedStep
          - epoch: 20
            bs_init: 1024
          - --finetuning FinetuneStep
          - epoch: 1
            bs_init: 16384
    dataset:
      - module: HCR.SvB_lowpt.Background
        option:
          - --metadata coffea4bees/metadata/datasets/
          - --norm 3
          - --JCM-weight "" {eos_prod}/{roast_id}/handoff/jetCombinatoricModel_SB_2024_v2.yml@@JCM_weights
          - --friends "" {eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input_lowpt
          - --friends label:data {FvT}/result.json@@analysis.0.merged
      - module: HCR.SvB_lowpt.Signal
        option:
          - --metadata coffea4bees/metadata/datasets/
          - --mc-processes ZH ggF
          - --friends "" {eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input_lowpt
    setting:
      - module: IO
        option:
          - output: "{model}"
  eval_workflow:
    main:
      module: evaluate
      option:
        - --max-evaluators 1
        - --device cuda cpu
    model:
      - module: HCR.SvB.ggF.baseline.Eval
        option:
          - --models
          - Final
          - "{model}/result.json"
    dataset:
      - module: HCR.SvB_lowpt.Eval
        option:
          - --metadata coffea4bees/metadata/datasets/
          - --mc-processes ttbar ZH ggF
          - --max-workers 8
          - --friends "" {eos_prod}/{roast_id}/handoff/classifier_inputs_{roast_id}.json@@HCR_input_lowpt
    analysis:
      - module: kfold.Merge
        option:
          - --name SvB_MA
          - --step 100000
          - --workers 5
          - --clean
    setting:
      - module: IO
        option:
          - output: "{SvB}"
      - module: ml.DataLoader
        option:
          - num_workers: 8

# ==============================================================================
# PHASE F.1: MAIN ANALYSIS PROCESSOR, CUTFLOWS & PLOTTING
# ==============================================================================
analysis_config:
  processor: "coffea4bees/analysis/processors/processor_HH4b_lowpt.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  friend_file: "coffea4bees/metadata/friends/friends_HH4b_lowpt.yml"
  weights_file: "coffea4bees/metadata/weights/weights_HH4b_lowpt.yml"
  runner:
    chunksize: 10000
    workers: 4
    worker_memory: 8GB
    dashboard_address: 0
  config:
    blind: false
    apply_FvT: true
    apply_JCM: true
    JCM_file: "coffea4bees/metadata/weights/JCM/{roast_id}/jetCombinatoricModel_SB_2024_v2.yml"
    friends:
      FvT: "{eos_prod}/{roast_id}/friend/lowpt_FvT/result.json@@analysis.0.merged"
      SvB_MA: "{eos_prod}/{roast_id}/friend/lowpt_SvB/result.json@@analysis.0.merged"
    friends_include: [trigWeight, FvT, SvB_MA]
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: true
    SvB_MA: null
    SvB: null
    top_reconstruction: fast
    plot_ttbar_with_weights: true
    fill_histograms: "SvB"

plot_config: "coffea4bees/plots/metadata/plotsAll_lowpt.yml"
known_counts_fatal: false
known_counts_test: "coffea4bees/analysis/tests/known_Counts_lowpt_Run2.yml"
known_counts_full: "none"

# ==============================================================================
# PHASE F.2: COMBINE STATISTICAL INTERPRETATION & LIMITS
# ==============================================================================
combine_flags: "--three_tag lowpt_threeTag --four_tag lowpt_fourTag --blind"
combine_outdir: "datacards/HH4b_fine"
metadata_template: "coffea4bees/stats_analysis/metadata/{channel}.yml"

make_combine_inputs:
  rebin: 1
  stat_only: "--stat_only"

channels:
  HH4b:
    signallabel: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb"
    othersignal: "ggHH_kl_0_kt_1_13p0TeV_hbbhbb ggHH_kl_2p45_kt_1_13p0TeV_hbbhbb ggHH_kl_5_kt_1_13p0TeV_hbbhbb"
    variable: "SvB_MA.ps_hh_fine"
    signal: "GluGluToHHTo4B_cHHH1"
    closure_subdir: "hh"
  # ZZ4b:
  #   signallabel: "ZZ_bbbb"
  #   othersignal: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb ZH_bbbb"
  #   variable: "SvB_MA.ps_zz"
  #   signal: "ZZ4b"
  #   closure_subdir: "zz"
  ZH4b:
    signallabel: "ZH_bbbb"
    othersignal: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb ZZ_bbbb"
    variable: "SvB_MA.ps_zh"
    signal: "ZH4b"
    closure_subdir: "zh"
