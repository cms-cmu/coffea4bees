label: "ttHbb_mixeddata"
output_path: "output/ttHbb_mixeddata_closure/"
dataset_location: "coffea4bees/metadata/datasets/"
datasets_file: "coffea4bees/metadata/datasets/mixeddata_4b.yml"
friend_file: "coffea4bees/metadata/friends/friends_ttHbb_mixeddata.yml"
weights_file: "coffea4bees/metadata/weights/weights_ttHbb.yml"
phase_e_dataset:
  - "mixeddata_4b"
years:
  - "UL16_preVFP"
  - "UL16_postVFP"
  - "UL17"
  - "UL18"
n_samples: 15

phase_f_output_path: "output/ttHbb_v3/"
phase_f_label: "ttHbb_v3"

# Phase E_3 closure settings
phase_e:
  mix_name: "3bDvTMix4bDvT"
  nMixes: 15
  classifier: "SvB_MA"
  variable: "SvB_MA_ps"
  channel: "ttHbb"
  rebin: "1"
  years_closure: "2016 2017 2018"
  closure_extra_args: "--pure_qcd"
  scale_mixed: 1.0

analysis_config:
  processor: "coffea4bees/analysis/processors/processor_ttHbb.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  datasets_file: "coffea4bees/metadata/datasets/mixeddata_4b.yml"
  friend_file: "coffea4bees/metadata/friends/friends_ttHbb_mixeddata.yml"
  weights_file: "coffea4bees/metadata/weights/weights_ttHbb.yml"
  runner:
    workers: 4
    worker_memory: 8GB
    condor: true
    shared_dask: true
    run_performance: true
  config:
    blind: false
    apply_FvT: false
    apply_JCM: false
    apply_trigWeight: false
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: true
    SvB_MA: true
    SvB: null
    apply_lepton_veto: false
    hist_cuts: ["pass_nSelJets_gt6", "fail_nSelJets_le6"]
    top_reconstruction: fast
    plot_ttbar_with_weights: true

channels:
  ttHbb:
    variable: "SvB_MA.ps"
    signal: "ttHbb"
