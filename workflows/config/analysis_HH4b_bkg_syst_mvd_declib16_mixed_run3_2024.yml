# ==============================================================================
# HH4b Run 3 2024 BACKGROUND SYSTEMATIC of the MvD-DECLUSTERED background, on MIXED data
# ==============================================================================
# The 2024 counterpart of analysis_HH4b_bkg_syst_mvd_declib16_mixed_run3.yml (2022+2023, roast
# analysis_HH4b_bkg_syst_mvd_declib16_mixed_run3_20261112_0c87fed-476ba18), standalone (2024 settings as
# analysis_HH4b_bkg_syst_declib16_run3_2024.yml: eras C..I3, trigweights_Run3_v6, HH4b_run3_2024.yml).
#   nominal     the 2024 MvD-declustered model mvd_run3_2024_declib16_warm (mixeddata_all_declib16_2024
#               four-tag x JCM x MvD, ttbar TTbar4b_from_MvD; fit variable its SvB_MvD, stored as SvB_MA);
#               V.1 inputs (classifier-input manifest, noJCM histograms) from mvd_declib16_run3_2024_20261026
#   A_1, A_2    run here (no 2024 FvT-on-mixed roast to link from): mixed-data JCM of the 2024 mixed data
#               (mixeddata_run3_2024_20261022) against the NON-TIGHT 2024 nominal, then the split into 16
#               subsamples + the 2024 ttbar pseudodata
#   A_3         the subsamples scored with the nominal's SvB_MvD
#   B_1         per subsample, JCM of the declustered four-tag events to mix_v<m> four-tag
#   C           per subsample, an MvD trained cold (the standard 20-epoch recipe): d4 = mix_v<m>,
#               mix4 = the declustered library x JCM_v<m>, t4 = ttbar MC; evaluated on the library,
#               split by era group; CMU ORCHARD, two trainings (180 GB each) per job
#   C_4         BKG_C4_MVD: kinematic closure of MvD_v0 against mix_v0
#   F           the library x JCM_v x MvD_v (bkg_model: mvd); closure in SvB_MvD; datacards on the
#               MvD-declustered nominal
# Compared with the 2024 FvT-on-declustered roast (analysis_HH4b_bkg_syst_declib16_run3_2024.yml).
#
#   bin/roast new --config coffea4bees/workflows/config/analysis_HH4b_bkg_syst_mvd_declib16_mixed_run3_2024.yml \
#       --phases BKG_AB,BKG_C,BKG_C4_MVD,BKG_F --cmslpc --train-on orchard --eval-on orchard
# ==============================================================================
label: HH4b_bkg_syst_mvd_declib16_mixed_run3_2024
output_path: output/{roast_id}/
per_year_jcm: false
unify_background: false
match_closure_normalization: false
fourTag_use_tight: true
publish_base: '{eos_prod}/{roast_id}'
handoff:
  eos_base: '{eos_prod}/{roast_id}/handoff'
channel: HH4b
mix_name: HH4b_bkg_syst_mvd_declib16_mixed_run3_2024
dataset_location: coffea4bees/metadata/datasets/
weights_file: coffea4bees/metadata/weights/weights_HH4b.yml
years:
- '2024'
year_eras:
  '2024':
  - C
  - D
  - E
  - F
  - G
  - H
  - I2
  - I3
phase_f_output_path: inputs/
phase_f_label: Run3_2024_nominal
ttbar_processes:
- TTTo2L2Nu
- TTToSemiLeptonic
- TTToHadronic
inputs:
  upstream_roasts:
    mixeddata: mixeddata_run3_2024_20261022_d7a35ab-8470e14
    nominal_nt: nominal_run3_2024_nontight_20261021_975a18e-e176976
    nominal_b: nominal_run3_2024_20261021_975a18e-e176976
    declib: declib16_run3_2024_20261025_d23bf9a-616755c
    mvd: mvd_run3_2024_declib16_warm_20261108_b02b7c1-7321448
    mvd_v1: mvd_declib16_run3_2024_20261026_e9a4dd4-e85d346
  mixeddata_all: '{roast:mixeddata}/handoff/mixeddata_all.yml'
  ttbar_psdata: '{roast:mixeddata}/handoff/ttbar_PSData.yml'
  jcm_hists: '{roast:nominal_nt}/{roast:nominal_nt:output_path}computeJCM/histAll_NoJCM.coffea'
  analysis_config_noJCM: '{roast:nominal_nt}/{roast:nominal_nt:output_path}computeJCM/analysis_config_noJCM.yml'
  classifier_inputs: '{roast:nominal_b}/handoff/classifier_inputs_{roast:nominal_b:id}.json'
  nominal_hists: '{roast:mvd}/{roast:mvd:output_path}V4/histAll_MvD.coffea'
  SvB: '{roast:mvd}/friend/SvB_MvD/result.json@@analysis.0.merged'
  SvB_model: '{roast:mvd}/classifier/SvB_MvD/result.json'
worker_memory: 8GB
subsamples:
  source: split
  n: 16
  dataset_name: mixeddata_4b
  split_template: coffea4bees/skimmer/metadata/split_mixeddata_Run3.yml
  study_template: coffea4bees/analysis/metadata/study_mixed_data_Run3.yml
  runner:
    condor: true
    shared_dask: true
    worker_memory: 8GB
subsample_processor_config: coffea4bees/workflows/config/analysis_config_bkg_syst_subsamples_HH4b_run3.yml
phaseA_3:
  runner:
    workers: 4
    min_workers: 25
    max_workers: 200
validation:
  plot_template: coffea4bees/plots/metadata/plots_bkg_syst_mixed_validation_HH4b.yml
  hists:
  - SvB_MA.ps_hh
  - SvB_MA.ps
  - SvB_MA.tt_vs_mj
  - selJets.n
  - tagJets.n
  model_ttbar:
  - TTbar4b_from_d3
  model_ttbar_tag: threeTag
  subsample: 0
phaseB_1:
  per_year_jcm: false
  jcm:
    config: coffea4bees/analysis/jcm_tools/metadata/mixeddata_declib16_subsample_jcm_config_Run3_2024.yml
    plot_config: coffea4bees/plots/metadata/plotsJCM.yml
    region: SB
    year: Run3
    data_coffea: '{roast:mvd_v1}/{roast:mvd_v1:output_path}V1/histAll_mixed_noJCM.coffea'
  validation:
    subsample: 0
    processor_config: coffea4bees/workflows/config/analysis_config_bkg_syst_test_subsample_HH4b_run3.yml
    plot_config: coffea4bees/plots/metadata/plots_subsample_v0_closure_HH4b.yml
    runner:
      workers: 4
      worker_memory: 6GB
      condor: true
      shared_dask: true
    config:
      blind: false
      apply_FvT: false
      apply_JCM: true
      apply_trigWeight: false
      apply_btagSF: true
      apply_boosted_veto: false
      run_SvB: false
      top_reconstruction: fast
      fill_histograms: kinematics
      fourTag_use_tight: true
classifier_setting:
- module: ml.DataLoader
  option:
  - optimize_sliceable_dataset: true
  - num_workers: 2
  - batch_eval: 65536
- module: ROOT
  option:
  - friend_allow_missing: false
- module: cms.CollisionData
  option:
  - eras:
      '2024':
      - C
      - D
      - E
      - F
      - G
      - H
      - I2
      - I3
- module: HCR.InputBranch
  option:
  - feature_ancillary:
    - xW
    - nSelJets
    - xbW
  - mass_regions:
    - SR
    - SB
- module: ml.Training
  option:
  - precision: fp16
fvt_train_workflow:
  main:
    module: train
    option:
    - --max-loaders 2
    - --max-trainers 3
    - --device cuda cpu
  dataset:
  - module: HCR.MvD.TrainBaseline
    option:
    - --metadata {metadata}
    - --max-workers 20
    - --data-source mixed_all mixed
    - --data-mixed-all-name mixeddata_all_declib16_2024
    - --data-mixed-name {mixed_name}
    - --data-mixed-samples {mix}
    - --JCM-weight "source:mixed_all,year:2024" {jcm_2024}@@JCM_weights
    - --friends "" {nominal_ci}@@HCR_input {mixed_ci}@@HCR_input
  model:
  - module: HCR.MvD.baseline.Train
    option:
    - --kfolds 3
    - --kfold-seed MvD random
    - --kfold-seed-offsets 0
    - --training FixedStep
    - epoch: 20
      bs_init: 1024
    - --finetuning FinetuneStep
    - epoch: 1
      bs_init: 16384
  setting:
  - module: IO
    option:
    - output: '{model}'
fvt_eval_workflow:
  main:
    module: evaluate
    option:
    - --max-evaluators 3
    - --device cuda cpu
  dataset:
  - module: HCR.MvD.Eval
    option:
    - --metadata {metadata}
    - --max-workers 8
    - --data-source mixed_all
    - --data-mixed-all-name mixeddata_all_declib16_2024
    - --friends "" {nominal_ci}@@HCR_input
  model:
  - module: HCR.MvD.baseline.Eval
    option:
    - --models
    - Final
    - '{model}/result.json'
  analysis:
  - module: kfold.Merge
    option:
    - --name MvD
    - --step 100000
    - --workers 4
    - --clean
  setting:
  - module: IO
    option:
    - output: '{FvT}'
  - module: ml.DataLoader
    option:
    - num_workers: 8
phase_e_fvt:
  channel: HH4b
  mix_name: HH4b_bkg_syst_mvd_declib16_mixed_run3_2024
  n_models: 16
  plot_base: '{web_prod}/{roast_id}/classifier_plots'
  precision: fp16
  gpu_gres: mps:25
  plot_inputs: false
  plot_weights: false
  analyze: false
  evaluate: true
  nominal_classifier_inputs: '{roast:mvd_v1}/handoff/classifier_inputs_MvD.json'
analysis_config:
  processor: coffea4bees/analysis/processors/processor_HH4b.py
  weights_file: coffea4bees/metadata/weights/weights_HH4b.yml
  runner:
    workers: 8
    chunksize: 100000
    condor: false
    shared_dask: false
    run_performance: false
analysis_config_mixeddata_bkgs: coffea4bees/workflows/config/analysis_config_mvd_bkgs_HH4b_run3.yml
closure_plot_config: coffea4bees/plots/metadata/plots_bkg_syst_closure_HH4b.yml
trigweights_file: coffea4bees/metadata/friends/trigweights_Run3_v6.json@@trigWeight
classifier: SvB_MA
variable: SvB_MA_ps_hh_fine
variable_substem: ps_hh_fine
signal_processes:
- GluGlutoHHto4B_kl-1p00_kt-1p00_c2-0p00
closure_rebin_candidates:
- 2
- 12
- 15
- 16
- 20
- 24
max_basis: 5
rebin: 12
no_sqrt_n_priors: false
convert_hist_to_json:
