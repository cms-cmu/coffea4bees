  metadata_template: coffea4bees/stats_analysis/metadata/HH4b_run3_2024.yml
  multijet_process: mixeddata_all_declib16_2024
  unify_background: false
  tt_processes:
  - TTbar4b_from_MvD
combine_flags: --three_tag threeTag --four_tag fourTag --region sum --blind
