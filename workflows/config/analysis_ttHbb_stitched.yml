# ==============================================================================
# GLOBAL WORKFLOW CONFIGURATION
# ==============================================================================
label: "ttHbb_stitched"
output_path: "output/ttHbb_stitched/"
cern_user: "mmarcheg"
cern_path: "www/plots/ttHbb/analysis/4b"

dataset:
  - "ttHbb"
  - "data"

year_eras:
  UL16_preVFP:
    - "C"
    - "D"
    - "E"
    - "F"
  UL16_postVFP:
    - "F"
    - "G"
    - "H"
  UL17:
    - "C"
    - "D"
    - "E"
    - "F"
  UL18:
    - "A"
    - "B"
    - "C"
    - "D"
  # --- Run 3 -----------------------------------------------------------------
  # Era keys must match metadata/datasets/data.yml (and triggers_HH4b.yml):
  # 2022_preEE / 2022_EE / 2023_preBPix / 2023_BPix / 2024
  "2022_preEE":       # Run2022 C+D, 7980.4 pb-1. "B" is the JetHT PD of Run2022C,
    - "B"             # "C" is the JetMET PD of the same era -- both are needed.
    - "C"
    - "D"
  "2022_EE":          # Run2022 E+F+G, 26671.7 pb-1
    - "E"
    - "F"
    - "G"
  "2023_preBPix":     # Run2023 C, 17960 pb-1. Split over JetMET0/JetMET1
    - "C01"           # (C01,C02,C11,C12) and ParkingHH (C3,C4).
    - "C02"
    - "C11"
    - "C12"
    - "C3"
    - "C4"
  "2023_BPix":        # Run2023 D, 9680 pb-1. ParkingHH v1+v2.
    - "D1"
    - "D2"
  "2024":             # Run2024 C-I, 109950 pb-1. Era I is split into I2/I3.
    - "C"
    - "D"
    - "E"
    - "F"
    - "G"
    - "H"
    - "I2"
    - "I3"
# ==============================================================================
# PHASE A: SKIMMING & TRIGGER WEIGHTS
# ==============================================================================
skimmer:
  processor: "coffea4bees/skimmer/processor/skimmer_4b.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 10000
    picosize: 100000
    basketsize: 10000
    condor: true
    shared_dask: true
    run_performance: true
    allowlist_sites:
      - T3_US_FNALLPC
      - T2_US_Nebraska
      - T2_US_Purdue
      - T3_US_Baylor
      - T2_US_Wisconsin

  config:
    base_path: root://cmseos.fnal.gov//store/user/mmarcheg/ttHbb/Run3_v1/ttHbb_stitched/
    step: 100000
    loosePtForSkim: true

trigger_weights:
  processor: "coffea4bees/analysis/processors/processor_trigger_weights.py"
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 10000
    condor: true
    shared_dask: true
    run_performance: true
    condor_transfer_input_files:
      - src/
      - coffea4bees/analysis/
      - coffea4bees/metadata/
  config:
    use_vectorized: false
    tagger: DeepJet
    make_classifier_input: root://cmseos.fnal.gov//store/user/mmarcheg/ttHbb/Run3_v1/ttHbb_stitched/

# ==============================================================================
# PHASE B: CALIBRATION & CLASSIFIER INPUTS (JCM & Friendtrees)
# ==============================================================================
jcm_plot_config: "coffea4bees/plots/metadata/plots_JCM_ttHbb_stitched.yml"
jcm_datasets:
  - "data"
  - "TTTo2L2Nu_stitched"
  - "TTToSemiLeptonic_stitched"
  - "TTToHadronic_stitched"

jcm_extra_arguments: "--jcm_config coffea4bees/analysis/jcm_tools/metadata/ttHbb_stitched_jcm_config.yml -m coffea4bees/plots/metadata/plotsJCM_ttHbb_stitched.yml"

classifier_inputs:
  processor: "coffea4bees/analysis/processors/processor_ttHbb.py"
  friend_file: "coffea4bees/metadata/datasets/friends_ttHbb_stitched_trigweight.yml"
  weights_file: "coffea4bees/metadata/weights/weights_ttHbb_stitched.yml"
  candidates_selection_cfg: "coffea4bees/analysis/metadata/candidates_selection_thresholds_ttHbb.yml"
  datasets:
    - "ttHbb"
    - "data"
    - "TTTo2L2Nu_stitched"
    - "TTToSemiLeptonic_stitched"
    - "TTToHadronic_stitched"
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 10000
    condor: true
    shared_dask: true
    run_performance: true
    condor_transfer_input_files:
      - src/
      - coffea4bees/analysis/
      - coffea4bees/metadata/
  config:
    blind: true
    apply_JCM: true
    apply_FvT: false
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: false
    top_reconstruction: slow
    fill_histograms: true
    make_classifier_input: root://cmseos.fnal.gov//store/user/mmarcheg/ttHbb/Run3_v1/ttHbb_stitched/

# ==============================================================================
# PHASE C & D: CLASSIFIER SETTINGS (Entirely on falcon / PSC)
# ==============================================================================
classifier_setting:
  - module: ml.DataLoader
    option:
      - optimize_sliceable_dataset: true
  - module: ROOT
    option:
      - friend_allow_missing: false
  - module: cms.CollisionData
    option:
      - eras:
          UL16_preVFP: [C, D, E, F]
          UL16_postVFP: [F, G, H]
          UL17: [B, C, D, E, F]
          UL18: [A, B, C, D]
          # Run 3 -- must stay in sync with year_eras above: CollisionData.eras
          # drives both the data and the MC file lists in the classifier
          # (classifier/config/dataset/HCR/_picoAOD.py).
          2022_preEE: [B, C, D]
          2022_EE: [E, F, G]
          2023_preBPix: [C01, C02, C11, C12, C3, C4]
          2023_BPix: [D1, D2]
          "2024": [C, D, E, F, G, H, I2, I3]
  - module: cms.MC_TTbar
    option:
      - datasets:
          - TTToSemiLeptonic_stitched
          - TTToHadronic_stitched
          - TTTo2L2Nu_stitched
  - module: HCR.InputBranch
    option:
      - feature_ancillary: [xW, nSelJets, xbW, year]

fvt:
  eos_base: "root://cmseos.fnal.gov//store/user/mmarcheg/ttHbb/Run3_v1/ttHbb_stitched"
  plot_base: "root://eosuser.cern.ch//eos/user/a/mmarcheg/www/plots/ttHbb/analysis/4b"
  classifier_config_paths: "coffea4bees"
  wfs_base: "coffea4bees/classifier/config/workflows/ttHbb_stitched/FvT"
  label: "FvT_ttHbb_stitched"
  output_dir: "output/FvT_ttHbb_stitched/"
  plot_inputs: true
  plot_weights: true
  evaluate: true
  model: "{eos_base}/classifier/{label}"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: {eos_base}/classifier/{label}"
  eval_template: "model: {eos_base}/classifier/{label}, FvT: {eos_base}/friend/{label}"
  metadata: "coffea4bees/metadata/datasets/classifier_inputs_ttHbb_stitched.json@@HCR_input"

svb:
  eos_base: "root://cmseos.fnal.gov//store/user/mmarcheg/ttHbb/Run3_v1/ttHbb_stitched"
  plot_base: "root://eosuser.cern.ch//eos/user/a/mmarcheg/www/plots/ttHbb/analysis/4b"
  classifier_config_paths: "coffea4bees"
  wfs_base: "coffea4bees/classifier/config/workflows/ttHbb_stitched/SvB"
  label: "SvB_ttHbb_stitched"
  output_dir: "output/SvB_ttHbb_stitched/"
  plot_inputs: true
  plot_weights: true
  evaluate: true
  model: "{eos_base}/classifier/{label}"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: {eos_base}/classifier/{label}, FvT: {eos_base}/friend/FvT_ttHbb_stitched"
  eval_template: "model: {eos_base}/classifier/{label}, SvB: {eos_base}/friend/{label}"
  metadata: "coffea4bees/metadata/datasets/classifier_inputs_ttHbb_stitched.json@@HCR_input"

# ==============================================================================
# PHASE F.1: MAIN ANALYSIS PROCESSOR, CUTFLOWS & PLOTTING
# ==============================================================================
analysis_config:
  processor: "coffea4bees/analysis/processors/processor_ttHbb.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  friend_file: "coffea4bees/metadata/datasets/friends_ttHbb_stitched.yml"
  weights_file: "coffea4bees/metadata/weights/weights_ttHbb_stitched.yml"
  runner:
    workers: 4
    worker_memory: 8GB
    chunksize: 10000
    dashboard_address: 0
  config:
    blind: true
    apply_FvT: true
    apply_JCM: true
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: true
    SvB_MA: true
    SvB: null
    hist_cuts: ["pass_nSelJets_gt6"]
    top_reconstruction: fast
    plot_ttbar_with_weights: true

plot_config: "coffea4bees/plots/metadata/plotsAll_ttHbb.yml"
plot_extra_arguments: ""
known_counts: "coffea4bees/analysis/tests/known_Counts_ttHbb.yml"
known_counts_test: "coffea4bees/analysis/tests/known_Counts_ttHbb.yml"
known_counts_full: "none"

# ==============================================================================
# PHASE F.2: COMBINE STATISTICAL INTERPRETATION & LIMITS
# ==============================================================================
convert_hist_to_json:
  histos:
    - "SvB_MA.ps_ttHbb"
    - "SvB_MA.ps"

combine_outdir: "datacards/"
make_combine_inputs:
  stat_only: ""
  bkgsyst: "coffea4bees/stats_analysis/files/HIG-24-010/zz/hists_closure_3bDvTMix4bDvT_SvB_MA_ps_zz_rebin1.pkl"

combine_flags: "--three_tag threeTag --four_tag fourTag --region sum --blind"
likelihood_scan_points: 40
likelihood_scan_r_min: 0
likelihood_scan_r_max: 2
likelihood_scan_y_cut: 30
likelihood_scan_y_max: 30

channels:
  ttHbb:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "ttHbb"
    region: "SR"
    cut: "sum"
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
  ttHbb_stat_only:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "ttHbb"
    region: "SR"
    cut: "sum"
    stat_only: true
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
  ttHbb_nSelJets_gt6:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "ttHbb"
    region: "SR"
    cut: "pass_nSelJets_gt6"
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
  ttHbb_nSelJets_gt6_stat_only:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "ttHbb"
    region: "SR"
    cut: "pass_nSelJets_gt6"
    stat_only: true
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
  ttHbb_sum_inclusive:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "ttHbb"
    region: "sum"
    cut: "sum"
    combine_flags: "--three_tag threeTag --four_tag fourTag --region sum --blind"
  ttHbb_sum_inclusive_stat_only:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "ttHbb"
    region: "sum"
    cut: "sum"
    stat_only: true
    combine_flags: "--three_tag threeTag --four_tag fourTag --region sum --blind"
