# Config of coffea4bees/workflows/Snakefile_CoReNet.smk.
# Instructions: coffea4bees/workflows/docs/CoReNet_boosted_workflow.md
label: "corenet_boosted"
output_path: "output/corenet_boosted/"
steps: [classifier]

inputs:
  # one entry per class: the ROOT files of that class
  classes:
    signal: ["PLACEHOLDER_signal.root"]
    background: ["PLACEHOLDER_background.root"]
  # where the model and the evaluation output are written (local or root://)
  output_base: "PLACEHOLDER_output"

classifier:
  label: "boosted_corenet"
  wfs_base: "coffea4bees/classifier/config/workflows/HH4b_boosted_corenet"
  model_options: {}

retries: 0
