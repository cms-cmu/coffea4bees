# ==============================================================================
# Run 2 analysis CI config — standalone counterpart of nominal_run2.yml
# ==============================================================================
# Keeps processor and skimmer settings aligned with nominal_run2.yml while
# omitting roast-scoped {eos_prod}/{roast_id} paths so each workflow phase
# executes cleanly inside GitLab CI.
email: ""
label: "run2_nominal_ci"
roast_id: "run2_nominal_ci"
output_path: "output/run2_nominal_ci/"

# ==============================================================================
# PHASE A: SKIMMER & TRIGGER WEIGHTS
# ==============================================================================
skimmer:
  runner:
    test_files: 1
    maxchunks: 2
    chunksize: 100000
    workers: 4
    allowlist_sites:
      - T3_CH_PSI
      - T3_US_FNALLPC
  config:
    base_path: "output/run2_nominal_ci/skimmer/picoaods/"

trigger_weights:
  runner:
    test_files: 1
    maxchunks: 2
    chunksize: 100000
    workers: 4

trig_validation:
  runner:
    test_files: 1
    maxchunks: 2
    chunksize: 100000
    workers: 4

# ==============================================================================
# PHASE B: JCM COMPUTATION & CLASSIFIER INPUT FRIEND TREES
# ==============================================================================
jcm_extra_arguments: "--jcm_config coffea4bees/analysis/jcm_tools/metadata/test_jcm_config.yml"

jcm:
  datasets:
    - "data"
    - "TTTo2L2Nu"
    - "TTToSemiLeptonic"
    - "TTToHadronic"
  runner:
    test_files: 1
    maxchunks: 2
    chunksize: 100000
    workers: 4
  config:
    fill_histograms: "kinematics"

classifier_inputs:
  config:
    make_classifier_input: "output/run2_nominal_ci/PhaseB_2_classifier_inputs/"
    fill_histograms: "kinematics"

# ==============================================================================
# PHASE C: FvT CLASSIFIER (CPU CI TEST)
# ==============================================================================
fvt:
  eos_base: "output/run2_nominal_ci/PhaseC_FvT"
  plot_base: "output/run2_nominal_ci/PhaseC_FvT/plots"
  classifier_config_paths: "coffea4bees"
  wfs_base: "coffea4bees/classifier/config/workflows/HH4b_2024_v2/FvT"
  label: "FvT_nominal"
  output_dir: "output/run2_nominal_ci/PhaseC_FvT/"
  yields_ratio: ["d4 / d3 - t3 + t4"]
  plot_inputs: false
  plot_weights: false
  evaluate: true
  fvt_max_chi2_ndf: 1000.0
  model: "output/run2_nominal_ci/PhaseC_FvT/model"
  friend: "output/run2_nominal_ci/PhaseC_FvT/friend"
  train_template: "model: output/run2_nominal_ci/PhaseC_FvT/model"
  eval_template: "model: output/run2_nominal_ci/PhaseC_FvT/model, FvT: output/run2_nominal_ci/PhaseC_FvT/friend"
  metadata: "output/run2_nominal_ci/PhaseB_2_classifier_inputs/classifier_inputs_friends.json@@HCR_input"
  classifier_setting:
    - module: ml.DataLoader
      option:
        - optimize_sliceable_dataset: true
        - num_workers: 0
    - module: ROOT
      option:
        - friend_allow_missing: true
    - module: monitor.Log
      option:
        - forward_exception: false
        - exit_on_exception: true
    - module: monitor.Monitor
      option:
        - enable: false
    - module: cms.CollisionData
      option:
        - eras:
            UL18: ["A"]
    - module: HCR.InputBranch
      option:
        - feature_ancillary: ["xW", "nSelJets", "xbW"]
  train_workflow:
    main:
      module: train
      option:
        - --device cpu
        - --max-loaders 1
        - --max-trainers 1
    dataset:
      - module: HCR.FvT.TrainBaseline
        option:
          - --metadata coffea4bees/metadata/datasets/
          - --max-workers 1
          - --test-files 1
          - --data-source detector
          - '--JCM-weight "" output/run2_nominal_ci/PhaseB_1_computeJCM/JCM_2024_v2/jetCombinatoricModel_SB_2024_v2.yml@@JCM_weights'
          - '--friends "" output/run2_nominal_ci/PhaseB_2_classifier_inputs/classifier_inputs_friends.json@@HCR_input'
    model:
      - module: HCR.FvT.baseline.Train
        option:
          - --kfolds 2
          - --kfold-seed FvT random
          - --kfold-seed-offsets 0
          - --training FixedStep
          - epoch: 1
            bs_init: 512
          - --finetuning FixedStep
          - epoch: 1
            bs_init: 1024
    setting:
      - module: IO
        option:
          - output: "{model}"
  eval_workflow:
    main:
      module: evaluate
      option:
        - --max-evaluators 1
        - --device cpu
    dataset:
      - module: HCR.FvT.Eval
        option:
          - --metadata coffea4bees/metadata/datasets/
          - --max-workers 1
          - --test-files 1
          - --data-source detector
          - '--friends "" output/run2_nominal_ci/PhaseB_2_classifier_inputs/classifier_inputs_friends.json@@HCR_input'
    model:
      - module: HCR.FvT.baseline.Eval
        option:
          - --models
          - Final
          - '{model}/result.json'
    analysis:
      - module: kfold.Merge
        option:
          - --name FvT
          - --step 100000
          - --workers 1
          - --clean
    setting:
      - module: IO
        option:
          - output: "{FvT}"

# ==============================================================================
# PHASE F.1: MAIN ANALYSIS PROCESSOR, CUTFLOWS & PLOTTING
# ==============================================================================
analysis_config:
  processor: "coffea4bees/analysis/processors/processor_HH4b.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  friend_file: "coffea4bees/metadata/friends/friends_HH4b.yml"
  weights_file: "coffea4bees/metadata/weights/weights_HH4b_2024_v2.yml"
  runner:
    workers: 4
    worker_memory: 8GB
    dashboard_address: 0
  config:
    blind: false
    apply_FvT: false
    apply_JCM: false
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: true
    SvB_MA: true
    SvB: null
    top_reconstruction: fast
    plot_ttbar_with_weights: false

known_counts: "coffea4bees/analysis/tests/known_Counts.yml"
plot_config: "coffea4bees/plots/metadata/plotsAll_ttbarWeights.yml"
combine_flags: "--blind"

dataset:
  - "GluGluToHHTo4B_cHHH1"
  - "TTTo2L2Nu"
  - "TTToSemiLeptonic"
  - "TTToHadronic"

year_eras:
  UL18:
    - "A"
