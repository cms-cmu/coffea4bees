# CI inputs of the b-tagging SF calibration test (workflows/config/btagSF_calibration_ci.yml).
# One pinned NanoAOD file per sample and era, so that the test always runs on the same events
# and does not depend on a Rucio lookup. The files are read through the CMS global redirector.
# Kept outside metadata/datasets/: that directory is merged as a whole and these keys would
# clash with the production entries.
datasets:
  ttHbb:
    xs:
      Run2: 0.2953
      Run3: 0.3257
    UL18:
      nanoAOD:
        - root://cms-xrd-global.cern.ch//store/mc/RunIISummer20UL18NanoAODv9/ttHTobb_M125_TuneCP5_13TeV-powheg-pythia8/NANOAODSIM/BPH_106X_upgrade2018_realistic_v16_L1v1-v2/2550000/9252DD7D-1F9A-904A-834F-48C36D75CF38.root
