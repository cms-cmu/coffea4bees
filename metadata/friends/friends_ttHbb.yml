friends:
  UL18:
    trigWeight: &trigWeight "coffea4bees/metadata/friends/trigweights_Run2_v2.json@@trigWeight"
    FvT: &FvT "root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/ttHbb_stitched/friend/FvT_ttHbb_stitched/result.json@@analysis.0.merged"
    SvB_MA: &SvB_MA "root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/ttHbb_stitched/friend/SvB_ttHbb_stitched/result.json@@analysis.0.merged"
  UL16_preVFP:
    trigWeight: *trigWeight
    FvT: *FvT
    SvB_MA: *SvB_MA
  UL16_postVFP:
    trigWeight: *trigWeight
    FvT: *FvT
    SvB_MA: *SvB_MA
  UL17:
    trigWeight: *trigWeight
    FvT: *FvT
    SvB_MA: *SvB_MA
  # ---------------------------------------------------------------------------------------------
  # Run 3 (ttHbb fNjetR chain, workflows/config/analysis_ttHbb_run3_fNjetR.yml): trigger weights
  # PINNED to trigweights_Run3_v1.json, the version the 2022/2024 Phase B.2 classifier inputs
  # and every per-era JCM fit were produced with, so the 2023 inputs and the combined Run 3
  # FvT/SvB/Phase F are consistent with them (friends_ttHbb_Run3.yml moved to v3/v4 in
  # 2026-10). FvT and SvB_MA for Run 3 are added per production through analysis_config.config.friends.
  # '2024' MUST stay quoted: unquoted it parses as an int and the string-keyed year lookup in
  # runner.py misses it, silently dropping the friend for that era.
  2022_preEE: &trigWeight_Run3_v1
    trigWeight: "coffea4bees/metadata/friends/trigweights_Run3_v1.json@@trigWeight"
  2022_EE: *trigWeight_Run3_v1
  2023_preBPix: *trigWeight_Run3_v1
  2023_BPix: *trigWeight_Run3_v1
  '2024': *trigWeight_Run3_v1
