# ==============================================================================
# GLOBAL WORKFLOW CONFIGURATION
# ==============================================================================
label: "ttHbb_Run3"
output_path: "output/ttHbb_Run3/"
cern_user: "algomez"
cern_path: "www/ttHbb_Run3/Plots/"

dataset:
  - "data"
  - "ttHbb"

year_eras:
  2023_BPix:
    - "D1"
    - "D2"

# ==============================================================================
# PHASE A: SKIMMING & TRIGGER WEIGHTS
# ==============================================================================
skimmer:
  processor: "coffea4bees/skimmer/processor/skimmer_4b.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 10000
    picosize: 200000
    basketsize: 10000
    condor: true
    shared_dask: true
    run_performance: true
  config:
    base_path: root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/ttHbb_Run3/
    step: 100000
    loosePtForSkim: true

trigger_weights:
  processor: "coffea4bees/analysis/processors/processor_trigger_weights.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  datasets:
    - "ttHbb"
    - "TTTo2L2Nu"
    - "TTToSemiLeptonic"
    - "TTToHadronic"
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 10000
    condor: true
    shared_dask: true
    run_performance: true
  config:
    use_vectorized: true
    tagger: PNet
    make_classifier_input: root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/ttHbb_Run3/

# ==============================================================================
# PHASE B: JET COMBINATORIC MODEL (JCM) — [One-time / Initial Setup]
# ==============================================================================
tag: "Run3_ttHbb"
jcm:
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 100000
    condor: true
    shared_dask: true
    run_performance: true
jcm_plot_config: "coffea4bees/plots/metadata/plots_JCM_ttHbb.yml"
jcm_datasets:
  - "data"
  - "TTTo2L2Nu"
  - "TTToSemiLeptonic"
  - "TTToHadronic"

jcm_extra_arguments: "--jcm_config coffea4bees/analysis/jcm_tools/metadata/ttHbb_jcm_config.yml"

# ==============================================================================
# PHASE C & D: CLASSIFIER SETTINGS (Entirely on falcon / PSC)
# ==============================================================================
classifier_inputs:
  processor: "coffea4bees/analysis/processors/processor_HH4b.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  friend_file: "coffea4bees/metadata/friends/friends_ttHbb_Run3.yml"
  weights_file: "coffea4bees/metadata/weights/weights_ttHbb_Run3.yml"
  datasets:
    - "ttHbb"
    - "data"
    - "TTTo2L2Nu"
    - "TTToSemiLeptonic"
    - "TTToHadronic"
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 100000
    condor: true
    shared_dask: true
    run_performance: true
  config:
    blind: true
    apply_JCM: true
    apply_FvT: false
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: false
    top_reconstruction: slow
    fill_histograms: true
    make_classifier_input: root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/ttHbb_Run3/

classifier_setting:
  - module: ml.DataLoader
    option:
      - optimize_sliceable_dataset: true
  - module: ROOT
    option:
      - friend_allow_missing: false
  - module: cms.CollisionData
    option:
      - eras:
          2023_BPix: [D1, D2]
  - module: HCR.InputBranch
    option:
      - feature_ancillary: [year, nSelJets, xW, xbW]

fvt:
  eos_base: "root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/ttHbb_Run3"
  plot_base: "root://eosuser.cern.ch//eos/user/a/algomez/www/HH4b/Plots"
  classifier_config_paths: "coffea4bees"
  wfs_base: "coffea4bees/classifier/config/workflows/ttHbb_Run3/FvT"
  label: "FvT"
  output_dir: "output/ttHbb_Run3/FvT/"
  plot_inputs: true
  model: "output/ttHbb_Run3/FvT/models"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: output/ttHbb_Run3/FvT/models"
  eval_template: "model: output/ttHbb_Run3/FvT/models, FvT: {eos_base}/friend/{label}"
  metadata: "coffea4bees/metadata/datasets/"
  datasets:
    - "data"
    - "TTTo2L2Nu"
    - "TTToHadronic"
    - "TTToSemiLeptonic"
  eval_dataset:
    - "data"

svb:
  eos_base: "root://cmseos.fnal.gov//store/user/algomez/XX4b/2024_v2/ttHbb_Run3"
  plot_base: "root://eosuser.cern.ch//eos/user/a/algomez/www/HH4b/Plots"
  classifier_config_paths: "coffea4bees"
  wfs_base: "coffea4bees/classifier/config/workflows/ttHbb_Run3/SvB"
  label: "SvB"
  output_dir: "output/ttHbb_Run3/SvB/"
  plot_inputs: true
  evaluate: true
  model: "output/ttHbb_Run3/SvB/models"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: output/ttHbb_Run3/SvB/models, FvT: {eos_base}/friend/FvT"
  eval_template: "model: output/ttHbb_Run3/SvB/models, SvB: {eos_base}/friend/{label}"
  metadata: "coffea4bees/metadata/datasets/"
  eval_dataset:
    - "data"
    - "ttHbb"

# ==============================================================================
# PHASE E.1: MAIN ANALYSIS PROCESSOR, CUTFLOWS & PLOTTING
# ==============================================================================
additional_parameters: "--shared-dask --condor --run-performance"

analysis_config:
  processor: "coffea4bees/analysis/processors/processor_ttHbb.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  friend_file: "coffea4bees/metadata/friends/friends_ttHbb_Run3.yml"
  weights_file: "coffea4bees/metadata/weights/weights_ttHbb_Run3.yml"
  runner:
    condor_cores: 1
    worker_memory: 8GB
    chunksize: 100000
    condor: true
    shared_dask: true
    run_performance: true
  config:
    blind: true
    apply_FvT: true
    apply_JCM: true
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: true
    SvB_MA: true
    SvB: null
    hist_cuts: ["pass_nSelJets_gt6", "fail_nSelJets_le6"]
    top_reconstruction: fast
    plot_ttbar_with_weights: true

plot_config: "coffea4bees/plots/metadata/plotsAll_ttHbb.yml"
known_counts: "coffea4bees/analysis/tests/known_Counts_Run3.yml"
known_counts_test: "coffea4bees/analysis/tests/known_Counts_Run3.yml"
known_counts_full: "none"

# ==============================================================================
# PHASE E.2: COMBINE STATISTICAL INTERPRETATION & LIMITS
# ==============================================================================
convert_hist_to_json:
  histos: 
    - "SvB_MA.ps_ttHbb"
    - "SvB_MA.ps"

combine_outdir: "datacards/ttHbb_Run3/"
metadata_template: "coffea4bees/stats_analysis/metadata/{channel}_run3.yml"
make_combine_inputs:
  metadata_template: "coffea4bees/stats_analysis/metadata/{channel}_run3.yml"
  stat_only: ""
  bkgsyst: "coffea4bees/stats_analysis/files/HIG-24-010/hh/hists_closure_3bDvTMix4bDvT_SvB_MA_ps_hh_rebin1.pkl"

combine_flags: "--three_tag threeTag --four_tag fourTag --region sum --blind"
likelihood_scan_points: 40
likelihood_scan_r_min: 0
likelihood_scan_r_max: 2
likelihood_scan_y_cut: 30
likelihood_scan_y_max: 30

channels:
  ttHbb:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "hh"
    region: "SR"
    cut: "sum"
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
  ttHbb_stat_only:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "hh"
    region: "SR"
    cut: "sum"
    stat_only: true
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
  ttHbb_nSelJets_gt6:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "hh"
    region: "SR"
    cut: "pass_nSelJets_gt6"
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
  ttHbb_nSelJets_gt6_stat_only:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "hh"
    region: "SR"
    cut: "pass_nSelJets_gt6"
    stat_only: true
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
  ttHbb_sum_inclusive:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "hh"
    region: "sum"
    cut: "sum"
    combine_flags: "--three_tag threeTag --four_tag fourTag --region sum --blind"
  ttHbb_sum_inclusive_stat_only:
    signallabel: "ttHbb"
    othersignal: ""
    variable: "SvB_MA.ps"
    signal: "ttHbb"
    closure_subdir: "hh"
    region: "sum"
    cut: "sum"
    stat_only: true
    combine_flags: "--three_tag threeTag --four_tag fourTag --region sum --blind"
